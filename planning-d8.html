<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>D8 Production · Planning</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315171b'/%3E%3Ctext x='32' y='40' font-family='Segoe UI,Arial' font-weight='800' font-size='27' fill='white' text-anchor='middle'%3ED8%3C/text%3E%3Crect x='17' y='47' width='10' height='4' fill='%23009246'/%3E%3Crect x='27' y='47' width='10' height='4' fill='%23ffffff'/%3E%3Crect x='37' y='47' width='10' height='4' fill='%23ce2b37'/%3E%3C/svg%3E">
<style>
/* ============ jetons ============ */
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
  --bg:#f2f4f6;--surface:#fff;--surface-2:#f7f8fa;--surface-3:#edf0f3;
  --border:#e1e5ea;--border-2:#ccd2da;
  --text:#191d23;--text-2:#485261;--text-3:#6d7783;
  --primary:#1487c9;--primary-2:#0e6da4;--primary-soft:#e7f3fb;
  --danger:#cf4040;--danger-soft:#fdeceb;--warn:#b4700c;--warn-soft:#fdf2e0;
  --ok:#2c8f55;--ok-soft:#e7f5ec;--info:#5a6a7d;--info-soft:#eef1f5;
  --side:#15171b;--side-2:#1c1f25;--side-3:#272b33;--side-tx:#c9cfd8;--side-mu:#7c8593;
  --r:11px;--r-sm:7px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  --sh-lg:0 18px 48px rgba(16,24,40,.24);
  --today:rgba(20,135,201,.07);
}
html[data-theme=dark]{
  --bg:#0e1014;--surface:#171a20;--surface-2:#1b1f26;--surface-3:#222730;
  --border:#2a2f38;--border-2:#3a414b;
  --text:#e6e9ee;--text-2:#b2bac5;--text-3:#8a939f;
  --primary:#3ba4e0;--primary-2:#6ab9e9;--primary-soft:#123047;
  --danger:#ea6a6a;--danger-soft:#381e20;--warn:#e3a145;--warn-soft:#372a13;
  --ok:#49bd7b;--ok-soft:#14301f;--info:#98a4b3;--info-soft:#212730;
  --side:#08090b;--side-2:#111318;--side-3:#1c1f26;
  --sh:0 1px 2px rgba(0,0,0,.5);--sh-lg:0 18px 48px rgba(0,0,0,.6);--today:rgba(59,164,224,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.ic.sm{width:14px;height:14px}
.mut{color:var(--text-3)}
.nowrap{white-space:nowrap}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.hide{display:none!important}
/* ============ structure ============ */
#app{display:flex;min-height:100vh}
#sb{width:250px;flex:none;background:var(--side);color:var(--side-tx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.sb-head{display:flex;align-items:center;gap:8px;padding:14px 10px 8px 14px}
.brand{display:flex;align-items:center;gap:11px;color:#fff;min-width:0;flex:1}
.brand:hover{text-decoration:none}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,#31363f,#0d0f13);display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;position:relative;box-shadow:inset 0 0 0 1px #ffffff1f;flex:none}
.logo::after{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:3px;border-radius:2px;background:linear-gradient(90deg,#009246 0 34%,#f2f2f2 34% 66%,#ce2b37 66%)}
.brand b{font-size:14.5px;font-weight:650;display:block;line-height:1.2}
.brand small{font-size:11px;color:var(--side-mu);display:block}
.sb-new{margin:6px 12px 8px;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border:0;border-radius:9px;background:var(--primary);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer}
.sb-new:hover{background:var(--primary-2)}
#nav{flex:1;overflow-y:auto;padding:2px 8px 14px}
.nav-sec{margin-top:9px}
.nav-h{display:flex;align-items:center;gap:6px;width:100%;background:0;border:0;color:var(--side-mu);font-size:12px;font-weight:600;padding:6px 8px;cursor:pointer;border-radius:6px}
.nav-h:hover{color:#fff}
.nav-h .ic{width:13px;height:13px;transition:transform .15s}
.nav-sec.closed .nav-h .ic{transform:rotate(-90deg)}
.nav-sec.closed .nav-list{display:none}
.nav-a{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;color:var(--side-tx);font-size:13.5px;position:relative;cursor:pointer}
.nav-a:hover{background:var(--side-2);color:#fff;text-decoration:none}
.nav-a.on{background:var(--side-3);color:#fff;font-weight:600}
.nav-a.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.nav-a .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.nav-b{margin-left:auto;font-size:11px;font-weight:650;padding:1px 7px;border-radius:9px;background:#ffffff17;color:#e3e7ee}
.nav-b.danger{background:#e0525233;color:#ffadad}
.nav-b.warn{background:#e3a14533;color:#ffd9a6}
.sb-foot{padding:9px 14px;border-top:1px solid #ffffff12;font-size:11.5px;color:var(--side-mu);display:flex;align-items:center;gap:8px}
#sb{transition:width .18s ease}
.nav-a .ini{display:none}
.sb-tg{display:flex;align-items:center;gap:8px;width:100%;border:0;background:0;color:var(--side-mu);font-size:12.5px;font-weight:600;padding:7px 8px;border-radius:8px;cursor:pointer}
.sb-tg:hover{background:var(--side-2);color:#fff}
.sb-tg .ic{width:16px;height:16px}
.sb-foot{flex-direction:column;align-items:stretch;gap:4px}
.sb-tip{position:fixed;z-index:95;transform:translateY(-50%);background:#0b0c0f;color:#fff;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:550;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;white-space:nowrap;border:1px solid #ffffff1c}
.sb-tip::before{content:"";position:absolute;left:-5px;top:50%;width:8px;height:8px;background:#0b0c0f;border-left:1px solid #ffffff1c;border-bottom:1px solid #ffffff1c;transform:translateY(-50%) rotate(45deg)}
.sb-tip small{color:#aab2bd;margin-left:6px;font-weight:400}
/* menu réduit : barre d'icônes (écrans larges ; sur mobile le menu reste un tiroir complet) */
@media(min-width:981px){
  body.mini #sb,body.mini.fs-l #sb,body.mini.fs-xl #sb{width:72px}
  body.mini .brand b,body.mini .brand small,body.mini .nav-h,body.mini .nav-a .lbl,body.mini .sb-new .lbl,body.mini .sb-foot #sb-info,body.mini .sb-tg span,body.mini #mini-top{display:none}
  body.mini .sb-head{justify-content:center;padding:14px 0 6px}
  body.mini .brand{flex:none;gap:0}
  body.mini .brand .trunc{display:none}
  body.mini .sb-new{width:44px;height:44px;margin:6px auto 12px;padding:0;border-radius:13px;box-shadow:0 4px 14px rgba(20,135,201,.35)}
  body.mini .sb-new .ic{width:20px;height:20px}
  body.mini #nav{padding:0 0 10px;overflow-x:hidden;scrollbar-width:none}
  body.mini #nav::-webkit-scrollbar{display:none}
  body.mini .nav-sec{margin:0;padding:7px 0;border-top:1px solid #ffffff12}
  body.mini .nav-sec:first-child{border-top:0;padding-top:0}
  body.mini .nav-sec.closed .nav-list{display:flex}
  body.mini .nav-list{display:flex;flex-direction:column;align-items:center;gap:3px}
  body.mini .nav-a{width:48px;height:42px;padding:0;justify-content:center;border-radius:12px}
  body.mini .nav-a .ic{width:20px;height:20px}
  body.mini .nav-a:hover{background:var(--side-3)}
  body.mini .nav-a.on{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(20,135,201,.3)}
  body.mini .nav-a.on::before{display:none}
  body.mini .nav-a .dot{display:none}
  body.mini .nav-a .ini{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;font-size:11px;font-weight:750;letter-spacing:.02em}
  body.mini .nav-a.on .ini{box-shadow:0 0 0 2px #fff}
  body.mini .nav-a .nav-b{position:absolute;top:1px;right:1px;margin:0;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;font-size:10px;line-height:1;border-radius:9px;background:#5b6472;color:#fff;box-shadow:0 0 0 2px var(--side)}
  body.mini .nav-a .nav-b.danger{background:#e05252}
  body.mini .nav-a .nav-b.warn{background:#d98b1c}
  body.mini .sb-foot{padding:8px 0;align-items:center}
  body.mini .sb-tg{width:48px;justify-content:center;padding:9px 0}
}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:54px;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:25}
#crumbs{font-size:13px;color:var(--text-3);display:flex;align-items:center;gap:6px;min-width:0}
#crumbs b{color:var(--text);font-weight:600}
.srch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 9px;color:var(--text-3);cursor:pointer;font-size:13px;min-width:210px}
.srch:hover{border-color:var(--border-2)}
kbd{font:11px/1 var(--mono);border:1px solid var(--border-2);border-bottom-width:2px;border-radius:4px;padding:3px 5px;color:var(--text-3);background:var(--surface)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);padding:4px 9px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--text-3);display:block}
.sync.ok i{background:var(--ok)}.sync.saving i{background:var(--primary)}.sync.err i{background:var(--danger)}.sync.warn i{background:var(--warn)}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:0;color:var(--text-2);cursor:pointer}
.ibtn:hover{background:var(--surface-3);color:var(--text)}
#burger{display:none}
.who{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:13px}
.who:hover{border-color:var(--border-2)}
.av{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
#view{padding:20px 22px 48px;flex:1}
#banner:not(:empty){padding:10px 22px 0}
.bnr{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:9px;font-size:13px;border:1px solid var(--border);background:var(--surface);margin-bottom:8px}
.bnr.warn{background:var(--warn-soft);border-color:#e3a14555;color:var(--warn)}
.bnr.danger{background:var(--danger-soft);border-color:#cf404055;color:var(--danger)}
.bnr.info{background:var(--primary-soft);border-color:#1487c944}
/* ============ page ============ */
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.phead h1{font-size:22px}
.phead p{margin:3px 0 0;color:var(--text-3);font-size:13px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.card>h3,.card-h{padding:12px 15px;border-bottom:1px solid var(--border);font-size:14.5px;display:flex;align-items:center;gap:9px}
.card-b{padding:15px}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:550;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-2)}
.btn.dgr{color:var(--danger);border-color:#cf404055}
.btn.dgr:hover{background:var(--danger-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.gh{border-color:transparent;background:0}
.btn.gh:hover{background:var(--surface-3)}
.btn[disabled]{opacity:.5;pointer-events:none}
.in,select.in,textarea.in{width:100%;padding:7px 10px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text)}
.in:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.in{resize:vertical;min-height:62px}
select.in{cursor:pointer}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.fld .help{font-size:11.5px;color:var(--text-3)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.fgrid.one{grid-template-columns:1fr}
.sw{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
.sw input{position:absolute;opacity:0;width:0}
.sw i{width:38px;height:21px;border-radius:12px;background:var(--border-2);position:relative;transition:background .15s;flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px #0003}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(17px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:550;background:var(--surface-3);color:var(--text-2);border:1px solid transparent;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.sel{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-2)}
label.chip{cursor:pointer}
label.chip input{display:none}
.tag{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--t);color:var(--c);border:1px solid var(--tb)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--t);color:var(--c);border:1px solid var(--tb)}
/* tableaux */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--text-3);padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);position:sticky;top:54px;z-index:5}
.tbl th.s{cursor:pointer;user-select:none}
.tbl th.s:hover{color:var(--text)}
.tbl td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.clic{cursor:pointer}
.tbl .n{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);box-shadow:var(--sh)}
.tbl-wrap .tbl th{top:0}
.empty{padding:34px 20px;text-align:center;color:var(--text-3)}
.empty b{display:block;color:var(--text-2);font-size:15px;margin-bottom:5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .in{width:auto;min-width:130px}
.toolbar .srchin{min-width:230px}
.pager{display:flex;gap:5px;align-items:center;justify-content:flex-end;padding:9px 11px;font-size:12.5px;color:var(--text-3)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;color:inherit}
.kpi:hover{border-color:var(--border-2);text-decoration:none}
.kpi .v{font-size:25px;font-weight:700;line-height:1;display:block}
.kpi .l{font-size:12.5px;color:var(--text-3);margin-top:3px;display:block}
.kpi .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--t);color:var(--c);flex:none}
/* suivi / étapes */
.seg{display:inline-flex;gap:2px;vertical-align:middle}
.seg i{width:19px;height:9px;border-radius:2px;background:var(--c);display:block}
.seg i.todo{background:repeating-linear-gradient(45deg,var(--c),var(--c) 3px,transparent 3px,transparent 6px);box-shadow:inset 0 0 0 1px var(--c)}
.steps{display:flex;flex-direction:column;gap:9px}
.step{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);border-left:4px solid var(--c)}
.step .si{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--t);color:var(--c);flex:none}
.step .sb{flex:1;min-width:0}
.step .sn{font-weight:620;font-size:13.5px}
.step .sd{font-size:12.5px;color:var(--text-2);margin-top:2px}
/* planning */
.plan{display:flex;gap:14px;align-items:flex-start}
.plan-main{flex:1;min-width:0}
.pl{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--sh)}
.pl-scroll{overflow-x:auto}
.pl-inner{min-width:880px}
.pl-head{display:flex;position:sticky;top:0;z-index:6;background:var(--surface-2);border-bottom:1px solid var(--border-2)}
.pl-res{width:168px;flex:none;padding:8px 10px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.pl-track{flex:1;position:relative;min-width:0;min-height:var(--rowh,60px)}
.pl-head .pl-track{min-height:0}
.pl-days{display:grid;grid-template-columns:repeat(var(--d),minmax(0,1fr))}
.pl-day{padding:7px 8px;text-align:center;border-left:1px solid var(--border);font-size:12.5px}
.pl-day b{display:block;font-weight:620;font-size:13px;text-transform:capitalize}
.pl-day.today{background:var(--today)}
.pl-day.today b{color:var(--primary-2)}
.pl-day.off{background:repeating-linear-gradient(135deg,var(--surface-3),var(--surface-3) 6px,transparent 6px,transparent 12px);color:var(--text-3)}
.pl-halves{display:grid;grid-template-columns:repeat(2,1fr);font-size:10.5px;color:var(--text-3);margin-top:3px}
.pl-occ{font-size:11px;font-weight:650;padding:1px 6px;border-radius:9px;display:inline-block;margin-top:3px;background:var(--t);color:var(--c)}
.pl-row{display:flex;border-bottom:1px solid var(--border)}
.pl-row:last-child{border-bottom:0}
.pl-grp{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface-3);border-bottom:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-2)}
.pl-grp .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pl-bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.pl-bg div{border-left:1px solid var(--border)}
.pl-bg div.h2{border-left-style:dashed}
.pl-bg div.today{background:var(--today)}
.pl-bg div.off{background:repeating-linear-gradient(135deg,var(--surface-3),var(--surface-3) 6px,transparent 6px,transparent 12px)}
.pl-items{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-auto-rows:min-content;grid-auto-flow:dense;gap:4px;padding:5px 4px}

<script>
'use strict';
/* =====================================================================
   D8 PRODUCTION · PLANNING  —  application autonome (1 fichier)
   Stockage : IndexedDB (poste local) ou api.php (serveur partagé, multi-postes,
   avec connexion par identifiant et mot de passe)
   Aucune dépendance externe : fonctionne hors ligne, sur intranet.
   ===================================================================== */
const APP_VERSION = '1.0';
const KEY = 'd8planning';

/* ---------- petits outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const num = (n, d = 0) => Number(n || 0).toLocaleString('fr-FR', { maximumFractionDigits: d, minimumFractionDigits: d });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pushMap = (m, k, v) => { const a = m.get(k); a ? a.push(v) : m.set(k, [v]); };
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const label = x => !x ? '' : (x.name != null ? x.name : [x.firstName, x.lastName].filter(Boolean).join(' '));
const byOrder = (a, b) => (a.order ?? 99) - (b.order ?? 99) || label(a).localeCompare(label(b), 'fr');
const byName = (a, b) => label(a).localeCompare(label(b), 'fr');
const initials = s => String(s || '?').split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function tint(hex, a) {
  const h = String(hex || '#8a939f').replace('#', '');
  const f = (h.length === 3 ? h.split('').map(c => c + c).join('') : h).padEnd(6, '0').slice(0, 6);
  const n = parseInt(f, 16) || 0;
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
/** variables CSS d'une couleur : --c teinte pleine, --t fond, --tb bordure */
const cvar = (hex, a = .17, b = .35) => `--c:${hex};--t:${tint(hex, a)};--tb:${tint(hex, b)}`;
function download(name, content, type = 'text/plain;charset=utf-8') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
const readFile = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(f, 'utf-8'); });
function pickFile(accept) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept;
    i.onchange = () => res(i.files[0] || null); i.click();
  });
}

/* ---------- CSV ---------- */
const CSV = {
  cell(v) { v = String(v ?? ''); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; },
  make(rows) { return '\ufeff' + rows.map(r => r.map(CSV.cell).join(';')).join('\r\n'); },
  parse(text) {
    text = String(text).replace(/^\ufeff/, '');
    const l0 = text.split(/\r?\n/)[0] || '';
    const cnt = c => (l0.split(c).length - 1);
    const sep = cnt(';') >= cnt(',') && cnt(';') >= cnt('\t') ? ';' : (cnt('\t') > cnt(',') ? '\t' : ',');
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === sep) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim() !== ''));
  }
};

  dow: s => (D.parse(s).getDay() + 6) % 7,

  diff: (a, b) => Math.round((D.parse(b) - D.parse(a)) / 864e5),
  month: s => String(s).slice(0, 7),
  week(s) {

  },
  fmt(s, o) { return s ? new Intl.DateTimeFormat('fr-FR', o || { day: '2-digit', month: '2-digit', year: 'numeric' }).format(D.parse(s)) : ''; },
  short: s => D.fmt(s, { day: '2-digit', month: '2-digit' }),

  fromAny(s) {

const HOLS = {};
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return y + '-' + pad(mo) + '-' + pad(da);
}
function holidays(y) {
  if (HOLS[y]) return HOLS[y];
  const e = easter(y), m = {};
  m[y + '-01-01'] = 'Jour de l’an'; m[D.add(e, 1)] = 'Lundi de Pâques'; m[y + '-05-01'] = 'Fête du Travail';
  m[y + '-05-08'] = 'Victoire 1945'; m[D.add(e, 39)] = 'Ascension'; m[D.add(e, 50)] = 'Lundi de Pentecôte';
  m[y + '-07-14'] = 'Fête nationale'; m[y + '-08-15'] = 'Assomption'; m[y + '-11-01'] = 'Toussaint';
  m[y + '-11-11'] = 'Armistice'; m[y + '-12-25'] = 'Noël';
  return HOLS[y] = m;
}

function nextWork(s, n = 1) { let d = s, k = 0; while (k < n) { d = D.add(d, 1); if (isWork(d)) k++; } return d; }

      const s = steps[k], sv = db.services.find(x => x.id === SVK[k]);
      const o = {
        id: ++opId, projectId: n, serviceId: sv.id, statusId: 's_todo', staffId: '', date: '', slot: 'AM',
        halfDays: sv.mode === 'half' ? 2 : 1, prepDone: false, matricule: '', contact: 'none', calls: 0, notes: '', seq: 0, doneAt: ''
      };
      if (Array.isArray(s)) {
        o.statusId = STK[s[0]]; o.staffId = s[1]; o.date = dt(s[2]); o.slot = s[3] || 'AM';
        o.halfDays = s[4] || (sv.mode === 'half' ? 2 : 1);
        o.prepDone = !!s[5]; o.matricule = s[6] || '';
        o.contact = s[7] !== undefined ? s[7] : (sv.needsContact ? 'ok' : 'none');
        o.calls = o.contact === 'ok' ? 1 : 0;
        if (s[0] === 'd') o.doneAt = o.date;
        if (!first || o.date < first) first = o.date;
      }
      ops.push(o);
    }
    const prod = ops.find(o => o.serviceId === 'sv_prod');
    db.projects.push({
      id: n, client, erpRef: ref, part, typeId, agencyId, daModelId: daId(da), commercialId: com,
      city, address: '', requested: req == null ? '' : dt(req), tags, contactName: '', phone: '', notes: '',
      opGroupId: prod ? (OGH[prod.halfDays] || 'og_n05') : '', archived: false, archivedAt: '', autoArch: false,
      createdAt: (first ? D.add(first, -12) : D.today()) + 'T09:00:00', createdBy: ''
    });
    db.ops.push(...ops);
  }
  db.counters.op = opId + 1;
  db.projects.find(p => p.id === 18111).archived = true;
  db.projects.find(p => p.id === 18111).archivedAt = dt(-5);
  autoArchive(db);
  return db;
}

/* ---------- migration / normalisation ---------- */
function migrate(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) return seed();
  d.schema = d.schema || 1;
  d.meta = d.meta || {};
  d.meta.gen = d.meta.gen || uid('g');      // identité de la base : change quand elle est vidée, réinitialisée ou restaurée
  d.log = Array.isArray(d.log) ? d.log : [];
  d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
  for (const k of COLLS) if (!Array.isArray(d[k])) d[k] = [];
  d.counters = Object.assign({ project: 1, op: 1 }, d.counters || {});
  for (const p of d.projects) { p.id = +p.id; d.counters.project = Math.max(d.counters.project, p.id + 1); p.tags = p.tags || []; }
  for (const o of d.ops) { o.id = +o.id; o.projectId = +o.projectId; d.counters.op = Math.max(d.counters.op, o.id + 1); }
  for (const s of d.staff) s.groupIds = s.groupIds || [];
  for (const a of d.agencies) a.circuit = a.circuit || [];
  for (const t of d.projectTypes) t.services = t.services || [];
  for (const r of d.roles) r.perms = r.perms || [];
  return d;
}

/* ---------- archivage automatique ---------- */
function autoArchive(d) {
  if (!d.settings.autoArchive) return;
  const stg = new Map(d.statuses.map(s => [s.id, s.stage]));
  const by = new Map(); for (const o of d.ops) pushMap(by, o.projectId, o);
  const today = D.today();
  for (const p of d.projects) {
    const ops = by.get(p.id) || [];
    const done = ops.length > 0 && ops.every(o => stg.get(o.statusId) === 'done');
    if (done && !p.archived) { p.archived = true; p.archivedAt = ops.reduce((m, o) => o.doneAt > m ? o.doneAt : m, '') || today; p.autoArch = true; }
    else if (!done && p.archived && p.autoArch) { p.archived = false; p.archivedAt = ''; p.autoArch = false; }
  }
}

/* =====================================================================
   2. STOCKAGE : IndexedDB (local) ou api.php (serveur partagé)
   ===================================================================== */
const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!self.indexedDB) return rej(new Error('IndexedDB indisponible'));
      const r = indexedDB.open(KEY, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(IDB.db = r.result);
      r.onerror = () => rej(r.error);
    });
  },
  get(k) { return new Promise((res, rej) => { const q = IDB.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v) { return new Promise((res, rej) => { const t = IDB.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
};

async function fetchJSON(url, opt = {}, ms = 8000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, Object.assign({ signal: ctl.signal, cache: 'no-store' }, opt));
    const txt = await r.text();
    let body = null; try { body = JSON.parse(txt); } catch (e) { }
    return { status: r.status, ok: r.ok, body };
  } finally { clearTimeout(t); }
}

/* ---------- super administrateur ----------
   Exigé pour vider, réinitialiser ou restaurer la base. En base partagée, le mot de passe est
   vérifié par le serveur (api.php), qui refuse aussi ces opérations sans confirmation.
   En base locale, seule cette empreinte le vérifie : simple garde-fou contre les fausses manœuvres. */
const SA_LOCAL = { salt: '43f481137543254e', sha256: '6be04719b753012489a0616109231983d49a5eb7d4a5913ae63b3f89184e7986' };
async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function confirmTyped(msg, o = {}) {           // super administrateur : on confirme en tapant un mot, sans mot de passe partagé
  return new Promise(res => {
    let done = false;
    const m = modal({
      size: 'sm', title: o.title || 'Confirmation · super administrateur',
      body: `<form id="ct-f" class="fgrid one" novalidate><p style="margin:0;line-height:1.5">${msg}</p>
        <div class="fld"><label>Tapez <b>CONFIRMER</b> pour valider</label><input class="in" name="w" autocomplete="off" autofocus></div></form>`,
      foot: `<span class="spacer"></span><button class="btn" data-close>Annuler</button><button class="btn dgr" data-ok disabled>${esc(o.ok || 'Confirmer')}</button>`,
      onClose: () => { if (!done) res(false); }
    });
    const inp = $('[name=w]', m.el), btn = $('[data-ok]', m.el);
    inp.oninput = () => { btn.disabled = inp.value.trim().toUpperCase() !== 'CONFIRMER'; };
    const go = () => { if (btn.disabled) return; done = true; m.close(); res(true); };
    btn.onclick = go; $('#ct-f', m.el).onsubmit = e => { e.preventDefault(); go(); };
  });
}
function superAdmin(msg, o = {}) {
  return new Promise(res => {
    let done = false;
    const m = modal({
      size: 'sm', title: o.title || 'Mot de passe super administrateur',
      body: `<form id="sa-f" class="fgrid one" novalidate>
        <p style="margin:0;line-height:1.5">${msg}</p>
        <input type="text" name="username" value="superadmin" autocomplete="username" hidden>
        <div class="fld"><label>Mot de passe super administrateur${o.change ? ' actuel' : ''}</label><input class="in" type="password" name="password" autocomplete="current-password" autofocus></div>
        ${o.change ? `<div class="fld"><label>Nouveau mot de passe (12 caractères minimum)</label><input class="in" type="password" name="next" autocomplete="new-password"></div>
        <div class="fld"><label>Confirmation</label><input class="in" type="password" name="confirm" autocomplete="new-password"></div>` : ''}
        <div class="bnr danger hide" data-err></div></form>`,
      foot: `<span class="spacer"></span><button class="btn" data-close>Annuler</button><button class="btn ${o.change ? 'pri' : 'dgr'}" data-ok>${esc(o.ok || 'Confirmer')}</button>`,
      onClose: () => { if (!done) res(false); }
    });
    const err = t => { const b = $('[data-err]', m.el); b.innerHTML = ic('warn') + '<span>' + esc(t) + '</span>'; b.classList.remove('hide'); };
    const go = async () => {
      const v = Object.fromEntries(new FormData($('#sa-f', m.el)));
      if (!v.password) return err('Saisissez le mot de passe.');
      if (o.change && String(v.next || '').length < 12) return err('Le nouveau mot de passe doit faire au moins 12 caractères.');
      if (o.change && v.next !== v.confirm) return err('Les deux nouveaux mots de passe ne correspondent pas.');
      const btn = $('[data-ok]', m.el); btn.disabled = true;
      let good = false;
      if (Sync.mode === 'server') {
        const r = await Auth.api(o.change ? 'sa-change' : 'sa-check', o.change ? { password: v.password, next: v.next } : { password: v.password }).catch(() => null);
        good = !!(r && r.ok);
        if (!good) { btn.disabled = false; return err((r && r.body && r.body.error) || 'Serveur injoignable.'); }
      } else {
        try { good = await sha256hex(SA_LOCAL.salt + v.password) === SA_LOCAL.sha256; }
        catch (e) { btn.disabled = false; return err('Vérification impossible dans ce navigateur.'); }
        if (!good) { btn.disabled = false; return err('Mot de passe super administrateur incorrect.'); }
      }
      done = true; m.close(); res(true);
    };
    $('[data-ok]', m.el).onclick = go;
    $('#sa-f', m.el).onsubmit = e => { e.preventDefault(); go(); };
  });
}

const Sync = {
  mode: 'memory', version: 0, pending: [], busy: false, retry: 0, bc: null, lastSave: '',
  async init() {
    const forceLocal = new URLSearchParams(location.search).has('local');
    if (/^https?:/.test(location.protocol) && !forceLocal) {
      let r = null;
      try { r = await Auth.api('me'); } catch (e) { /* pas d'API → mode local */ }
      if (r && r.body) {                          // api.php répond : base partagée, connexion obligatoire
        if (r.status === 401 && r.body.auth === false) r = { ok: true, body: await Auth.prompt(r.body) };
        if (!r.ok || !r.body.auth) throw fatalErr(r.body.error === 'Action inconnue'
          ? 'Le fichier api.php installé sur le serveur est une ancienne version : remplacez-le par celui livré avec cette page.'
          : 'Le serveur a répondu : ' + (r.body.error || 'réponse inattendue') + '.');

function checkOp(o, ghost) {
  const out = [], sv = svc(o.serviceId) || {}, T = D.today(), st = stage(o);
  const add = (level, type, msg) => out.push({ level, type, msg });
  if (!o.date) return out;
  const halves = halvesRaw(o.date, o.slot, o.halfDays, sv.mode);
  if (halves.some(([d]) => !isWork(d))) add('warn', 'holiday', 'Placée sur un jour non travaillé');
  if (!o.staffId) add('warn', 'unassigned', 'Aucune ressource affectée');
  else {
    const abs = halves.map(([d, s]) => absenceAt(o.staffId, d, s)).find(Boolean);
    if (abs) add('danger', 'absent', staffName(o.staffId) + ' est absent (' + label(get('absenceTypes', abs.typeId)) + ')');
    if (sv.mode === 'half') {
      const m = idx().slots.get(o.staffId);
      const busy = halves.some(([d, s]) => (m && m.get(d + '|' + s) || []).some(id => id !== o.id));
      if (busy) add('danger', 'overlap', 'Créneau déjà occupé par une autre opération');
    } else {
      const capN = sv.capMode === 'count' ? (+sv.perDay || 1) : Math.round(hpd() / ((+sv.defHours) || hpd() / 2));
      for (const d of [...new Set(halves.map(h => h[0]))]) {
        const n = (idx().dayOps.get(o.staffId + '|' + d) || []).filter(x => x.id !== o.id && x.serviceId === o.serviceId).length + 1;
        if (n > capN) add('warn', 'overcap', `${staffName(o.staffId)} : ${n} opérations le ${D.short(d)} (capacité ${capN})`);

  if (pr && !pr.date && stage(pr) !== 'done') add('info', 'waiting', `L’étape ${label(svc(pr.serviceId))} n’est pas encore planifiée`);
  const e = earliestStart(o);

}

    for (const o of ops) {

function modal(o) {

    <header><h3 class="trunc">${esc(o.title || '')}</h3>${o.head || ''}<button class="ibtn" data-close title="Fermer">${ic('x')}</button></header>

  $('#modals').appendChild(el);
  const close = () => { if (!el.isConnected) return; el.remove(); o.onClose && o.onClose(); };
  el._close = close;                 // Échap passe aussi par onClose
  el.addEventListener('mousedown', e => { if (e.target === el) close(); });
  $$('[data-close]', el).forEach(b => b.addEventListener('click', close));
  const api = { el, close };
  if (o.onMount) o.onMount(el, close);
  setTimeout(() => { const f = $('[autofocus]', el) || $('.mb input:not([type=hidden]):not([type=checkbox]),.mb select,.mb textarea', el); f && f.focus(); }, 30);
  return api;
}

let POP = null;
function closePop() { if (POP) { POP.remove(); POP = null; document.removeEventListener('mousedown', outPop); } }
function outPop(e) { if (POP && !POP.contains(e.target)) closePop(); }
function popover(anchor, html) {
  closePop();
  const r = anchor.getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'card';
  el.style.cssText = `position:fixed;z-index:70;min-width:210px;max-width:320px;padding:6px;top:${Math.round(r.bottom + 6)}px;right:${Math.max(8, Math.round(window.innerWidth - r.right))}px;box-shadow:var(--sh-lg)`;
  el.innerHTML = html;
  document.body.appendChild(el); POP = el;
  // pas assez de place en dessous : on ouvre au-dessus, et au besoin avec défilement interne
  const h = el.offsetHeight, below = window.innerHeight - r.bottom - 14, above = r.top - 14;

  el.style.maxHeight = Math.max(160, h > below && above > below ? above : below) + 'px';
  el.style.overflowY = 'auto';
  setTimeout(() => document.addEventListener('mousedown', outPop), 0);

}

/* ---------- graphiques (SVG, sans librairie) ---------- */
function chart(spec) { const id = 'c' + (++chN); spec.h = Math.round((spec.h || 240) * viewScale()); CH[id] = spec; return `<div class="chart" data-chart="${id}"${spec.key ? ` data-key="${esc(spec.key)}"` : ''} style="height:${spec.h || 240}px"></div>`; }
function drawCharts() {
  for (const el of $$('.chart[data-chart]')) {
    const s = CH[el.dataset.chart]; if (!s) continue;
    const w = Math.max(300, el.clientWidth || 640), h = s.h || 240;
    el.innerHTML = s.type === 'area' ? svgArea(s, w, h) : s.type === 'donut' ? svgDonut(s, w, h) : s.type === 'lines' ? svgLines(s, w, h) : s.type === 'stack' ? svgStack(s, w, h) : svgBars(s, w, h);
  }
}
function axis(W, H, max, pl, pr, pt, pb, dec) {
  let g = ''; const h = H - pt - pb;
  for (let i = 0; i <= 4; i++) {
    const y = pt + h - h * i / 4;
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--border)"/>
          <text x="${pl - 6}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="var(--text-3)">${num(max * i / 4, dec || 0)}</text>`;
  }
  return g;
}
function svgBars(s, W, H) {
  const pl = 40, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = H - pt - pb;
  const data = s.data || [], max = s.max || niceMax(Math.max(1, ...data.map(d => +d.value || 0)), !s.dec);
  const bw = w / Math.max(1, data.length), step = Math.max(1, Math.ceil(data.length / Math.max(3, Math.floor(w / 64))));
  let out = axis(W, H, max, pl, pr, pt, pb, s.dec);
  data.forEach((d, i) => {
    const x = pl + i * bw, cx = x + bw / 2;
    if (d.mark) out += `<rect x="${x}" y="${pt}" width="${bw}" height="${h}" fill="var(--today)"/>`;
    if (d.value == null) out += `<text x="${cx}" y="${pt + h - 3}" text-anchor="middle" font-size="10" fill="var(--text-3)">–</text>`;
    else {
      const bh = Math.max(d.value > 0 ? 2 : 0, h * Math.min(1.02, d.value / max));
      const bwid = Math.min(24, Math.max(2, bw * .62));
      out += `<path d="${barPath(x + (bw - bwid) / 2, pt + h - bh, bwid, bh, 4)}" fill="${d.color || 'var(--primary)'}"/>
        <rect x="${x.toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${h}" fill="transparent"><title>${esc(d.tip || d.label + ' : ' + num(d.value, s.dec || 0))}</title></rect>`;
    }
    if (i % step === 0) out += `<text x="${cx}" y="${H - 7}" text-anchor="middle" font-size="10" fill="var(--text-3)">${esc(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">${out}</svg>`;
}
function svgArea(s, W, H) {
  const pl = 40, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = H - pt - pb;
  const data = s.data || [], max = s.max || niceMax(Math.max(1, ...data.map(d => +d.value || 0)), !s.dec);
  const X = i => pl + (data.length < 2 ? w / 2 : i * w / (data.length - 1));
  const Y = v => pt + h - h * Math.min(1, (+v || 0) / max);
  let line = '', dots = '';
  data.forEach((d, i) => { line += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(d.value).toFixed(1) + ' '; });
  const area = line + `L${X(data.length - 1).toFixed(1)} ${pt + h} L${X(0).toFixed(1)} ${pt + h} Z`;
  const step = Math.max(1, Math.ceil(data.length / Math.max(3, Math.floor(w / 72))));
  let lab = '';
  data.forEach((d, i) => {
    if (d.value > 0) dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y(d.value).toFixed(1)}" r="3" fill="var(--primary)"><title>${esc(d.tip || d.label + ' : ' + num(d.value))}</title></circle>`;
    if (i % step === 0) lab += `<text x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10" fill="var(--text-3)">${esc(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">${axis(W, H, max, pl, pr, pt, pb, s.dec)}
    <path d="${area}" fill="var(--primary-soft)"/><path d="${line}" fill="none" stroke="var(--primary)" stroke-width="2"/>${dots}${lab}</svg>`;
}
function hbars(rows, opt = {}) {
  const max = Math.max(1, ...rows.map(r => r.value));
  return `<div class="hbars">${rows.map(r => `<div class="hb"><span class="trunc" title="${esc(r.label)}">${esc(r.label)}</span>
    <span class="bar"><i style="--c:${r.color || 'var(--primary)'};width:${(r.value / max * 100).toFixed(1)}%"></i></span>
    <span class="v">${num(r.value, opt.dec || 0)}${opt.unit || ''}</span></div>`).join('')}</div>`;
}

function pageFor(r) {
  const s = r.seg;
  if (!s.length) return pageDash(r.q);
  switch (s[0]) {
    case 'projets': return pageProjects(false, r.q);
    case 'archives': return pageProjects(true, r.q);
    case 'preparation': return pagePrep(r.q);
    case 'planning': return pagePlanning(s[1], r.q);
    case 'absences': return pageAbsences(r.q);
    case 'gantt': return pageGantt(r.q);
    case 'ecrans': return pageScreens();
    case 'ecran': return pageKiosk(s[1] || 'rotation', r.q);
    case 'alertes': return pageAlerts(r.q);
    case 'rapports': return can('reports') ? pageReports(s[1] || 'activite', r.q) : deniedBox();
    case 'admin': return pageAdmin(s[1] || 'parametres', r.q);
  }
  return emptyBox('Page introuvable', 'Cette adresse ne correspond à aucune vue.');
}
function formVals(root) {
  const v = {};
  for (const el of $$('[name]', root)) {
    const k = el.name;
    if (el.type === 'checkbox') { if (el.dataset.multi) { v[k] = v[k] || []; if (el.checked) v[k].push(el.value); } else v[k] = el.checked; }
    else if (el.type === 'radio') { if (el.checked) v[k] = el.value; }
    else if (el.type === 'number') v[k] = el.value === '' ? '' : +el.value;
    else v[k] = el.value;
  }
  return v;
}
function matchProject(p, q) {
  if (!p) return false;
  const n = norm(q);
  return String(p.id).includes(n) || norm(p.client).includes(n) || norm(p.city).includes(n) ||
    norm(p.erpRef).includes(n) || norm(label(get('daModels', p.daModelId))).includes(n);
}
function prepList() {
  const T = D.today(), h = +DB.settings.prepHorizon || 14, out = [];
  for (const o of DB.ops) {
    const sv = svc(o.serviceId);
    if (!sv || !sv.needsPrep || !o.date) continue;
    const p = P(o.projectId); if (!p || p.archived) continue;
    if (o.prepDone && stage(o) === 'done') continue;
    if (o.date > D.add(T, h)) continue;
    out.push({ o, p, late: !o.prepDone && o.date < T && stage(o) !== 'done' });
  }
  return out.sort((a, b) => a.o.date < b.o.date ? -1 : a.o.date > b.o.date ? 1 : a.o.id - b.o.id);
}

function filterProjects(arch) {               // liste affichée = liste exportée (mêmes filtres, même tri)
  const F = UI.pf = Object.assign({ q: '', type: '', da: '', ag: '', com: '', tag: '', flag: '' }, UI.pf);
  const S = UI.sortP = UI.sortP || { k: 'id', d: -1 };
  let rows = DB.projects.filter(p => !!p.archived === arch);
  if (F.q) rows = rows.filter(p => matchProject(p, F.q));
  if (F.type) rows = rows.filter(p => p.typeId === F.type);
  if (F.da) rows = rows.filter(p => p.daModelId === F.da);
  if (F.ag) rows = rows.filter(p => p.agencyId === F.ag);
  if (F.com) rows = rows.filter(p => p.commercialId === F.com);
  if (F.tag) rows = rows.filter(p => (p.tags || []).includes(F.tag));
  if (F.flag === 'late') rows = rows.filter(p => lateFlag(p));
  if (F.flag === 'todo') rows = rows.filter(p => projOps(p.id).some(o => !o.date && stage(o) !== 'done'));
  const val = (p, k) => k === 'id' ? p.id : k === 'client' ? norm(p.client) : k === 'req' ? (p.requested || '') :
    k === 'city' ? norm(p.city) : k === 'type' ? norm(label(get('projectTypes', p.typeId))) : k === 'ag' ? norm(label(get('agencies', p.agencyId))) : '';
  rows.sort((a, b) => { const x = val(a, S.k), y = val(b, S.k); return (x < y ? -1 : x > y ? 1 : 0) * S.d; });
  return rows;
}

/* ------------------------------ planning ------------------------------ */
function weekStats(s, sv, days) {
  const half = sv.mode === 'half';
  let cap = 0, used = 0;
  for (const d of days) {
    if (!isWork(d)) continue;
    let av = 0; for (const sl of [0, 1]) if (!absenceAt(s.id, d, sl)) av++;
    if (half) {
      cap += av;
      const m = idx().slots.get(s.id) || new Map();
      for (const sl of [0, 1]) if ((m.get(d + '|' + sl) || []).some(id => (O(id) || {}).serviceId === sv.id)) used++;
    } else {
      cap += av / 2 * (+sv.perDay || 1);
      used += (idx().dayOps.get(s.id + '|' + d) || []).filter(o => o.serviceId === sv.id).length;
    }
  }
  const pct = cap > 0 ? Math.round(used / cap * 100) : null;
  return { cap, used, pct, txt: half ? `${used}/${cap} demi-journées` : `${used}/${num(cap, 0)} interventions` };
}
function planRow(s, days, ops, sv, opt = {}) {
  const half = sv.mode === 'half', n = days.length * (half ? 2 : 1), T = D.today();
  const colOf = (d, sl) => { const i = days.indexOf(d); return i < 0 ? -1 : (half ? i * 2 + sl : i); };
  let items = '';
  if (s.id) {
    const marks = [];
    for (let c = 0; c < n; c++) {
      const d = days[half ? Math.floor(c / 2) : c], sl = half ? c % 2 : 0;
      marks[c] = half ? absenceAt(s.id, d, sl) : (absenceAt(s.id, d, 0) || absenceAt(s.id, d, 1));
    }
    let c = 0;
    while (c < n) {
      if (!marks[c]) { c++; continue; }
      const a = marks[c]; let e = c; while (e + 1 < n && marks[e + 1] === a) e++;
      const t = get('absenceTypes', a.typeId) || { name: 'Absence', color: '#c9a227' };
      items += `<div class="abs" style="${cvar(t.color, .2, .55)};grid-column:${c + 1} / span ${e - c + 1}"${opt.readonly ? '' : ` data-act="edit-abs" data-id="${a.id}"`}
        title="${esc(label(t) + ' du ' + D.fmt(a.start) + ' au ' + D.fmt(a.end) + (a.note ? ' — ' + a.note : ''))}">${esc(label(t))}</div>`;
      c = e + 1;
    }
  }
  for (const o of ops) {
    const hs = opHalves(o);
    const cols = hs.map(([d, sl]) => colOf(d, half ? sl : 0)).filter(x => x >= 0);
    if (!cols.length) continue;
    const uniq = [...new Set(cols)].sort((a, b) => a - b);
    const contL = hs[0][0] < days[0], contR = hs[hs.length - 1][0] > days[days.length - 1];
    let i = 0;
    while (i < uniq.length) {
      let j = i; while (j + 1 < uniq.length && uniq[j + 1] === uniq[j] + 1) j++;
      items += opCard(o, {
        gc: `${uniq[i] + 1} / span ${uniq[j] - uniq[i] + 1}`,
        cl: i === 0 ? contL : true, cr: j === uniq.length - 1 ? contR : true,
        flash: opt.flash === o.id, readonly: opt.readonly
      });
      i = j + 1;
    }
  }
  let bg = '';
  for (let c = 0; c < n; c++) {
    const d = days[half ? Math.floor(c / 2) : c];
    bg += `<div class="${[half && c % 2 ? 'h2' : '', d === T ? 'today' : '', isWork(d) ? '' : 'off'].filter(Boolean).join(' ')}" data-c="${c}"></div>`;
  }
  const st = s.id ? weekStats(s, sv, days) : null;
  const kind = { vehicle: 'truck', team: 'users', contractor: 'user', person: 'user' }[s.kind] || 'user';
  return `<div class="pl-row" data-staff="${esc(s.id)}" data-days="${days.join(',')}" data-half="${half ? 1 : 0}" data-n="${n}" data-sv="${sv.id}">
    <div class="pl-res">
      <span class="resn"${s.id ? ` data-act="res" data-id="${s.id}"` : ''}>${s.id ? ic(kind, 'sm') : ic('warn', 'sm')}<span class="trunc">${esc(label(s))}</span></span>
      ${st ? `<span class="mut" style="font-size:11px">${st.txt}</span><span class="load"><i style="--c:${occColor(st.pct)};width:${Math.min(100, st.pct || 0)}%"></i></span>` : ''}
    </div>
    <div class="pl-track" style="--n:${n}"><div class="pl-bg">${bg}</div><div class="pl-items">${items}</div></div></div>`;
}
function pagePlanning(svId, q) {
  const sv = svc(svId);
  if (!sv) return emptyBox('Planning introuvable', 'Ce service n’existe plus. Vérifiez « Services & plannings ».');
  const wk = D.monday(q.w || UI.week || D.today());
  UI.week = wk; saveUI();
  const days = workDaysOfWeek(wk);
  if (!days.length) return emptyBox('Aucun jour travaillé', 'Configurez les jours travaillés dans les paramètres.');
  const half = sv.mode === 'half', last = days[days.length - 1], T = D.today();
  const flash = q.op ? +q.op : 0;
  const weekOps = DB.ops.filter(o => o.serviceId === sv.id && o.date && opDays(o).some(d => d >= days[0] && d <= last));
  const byStaff = new Map(); weekOps.forEach(o => pushMap(byStaff, o.staffId || '', o));
  const view = UI.plView || 'grid';

  let rows = '', seen = new Set();
  for (const g of serviceGroups(sv.id)) {
    const st = DB.staff.filter(x => (x.groupIds || []).includes(g.id) && x.active !== false && !seen.has(x.id)).sort(byName);
    st.forEach(x => seen.add(x.id));

  ${absYearCard(m.slice(0, 4))}`;

function absYearCard(yr) {                   // jours ouvrés d'absence par mois et par motif
  const months = []; for (let i = 1; i <= 12; i++) months.push(yr + '-' + pad(i));
  const last = mm => D.add(D.add(mm + '-01', 32).slice(0, 7) + '-01', -1);
  const series = DB.absenceTypes.map(t => ({ name: t.name, color: t.color,
    values: months.map(mm => DB.absences.filter(a => a.typeId === t.id).reduce((s, a) => s + absHalves(a, mm + '-01', last(mm)), 0) / 2) }))
    .filter(x => x.values.some(v => v > 0));
  return `<div class="card" style="margin-top:14px"><div class="card-h">${ic('bar')}<span>Jours d’absence ${yr}, par mois et par motif</span>${series.length ? xpBtn('chart:abs-year', { icon: 1 }) : ''}</div>
    <div class="card-b">${series.length ? chart({ type: 'stack', key: 'abs-year', title: 'Jours d’absence ' + yr + ' par mois et par motif', xl: 'Mois', unit: ' j', dec: 1, h: 270,
      labels: months.map(mm => D.fmt(mm + '-01', { month: 'short' })), full: months.map(mm => D.monthName(mm)), series }) : emptyBox('Aucune absence en ' + yr, '')}</div></div>`;
}

        if (v.end < v.start || (v.end === v.start && v.startSlot === 'PM' && v.endSlot === 'AM')) return toast('La fin de l’absence précède son début.', 'danger');
        mutate(a ? 'Modification d’une absence' : 'Saisie d’une absence', db => {
          if (a) Object.assign(db.absences.find(x => x.id === a.id), v);
          else db.absences.push(Object.assign({ id: uid('ab') }, v));
        });
        close();
      };
    }
  });
}

  const perDay = days.map(d => ({ label: D.short(d), full: D.fmt(d), value: done.filter(p => p.archivedAt === d).length, tip: D.long(d) }));
  const count = (key, coll) => countBy(done, key, coll).slice(0, 12);
  const wks = []; for (let w = D.monday(R.from); w <= R.to; w = D.add(w, 7)) wks.push(w);
  const inWk = (d, w) => d && d >= w && d <= D.add(w, 6);

/* ---------- palette de commandes ---------- */
function palette() {
  closeModals();
  const cmds = [];
  for (const s of navModel()) for (const i of s.items) cmds.push({ t: i.t, s: s.h, go: i.r, ic: i.ic || 'arrow' });
  cmds.push({ t: 'Nouveau projet', s: 'Action', act: 'new-project', ic: 'plus' },
    { t: 'Nouvelle absence', s: 'Action', act: 'new-absence', ic: 'calx' },
    { t: 'Exporter une sauvegarde', s: 'Action', act: 'export-json', ic: 'download' },
    { t: 'Importer un fichier (Excel, CSV, JSON)', s: 'Action', act: 'imp', ic: 'upload' },
    { t: 'Basculer le thème clair / sombre', s: 'Action', act: 'theme', ic: 'moon' },
    { t: 'Raccourcis clavier', s: 'Action', act: 'shortcuts', ic: 'keyboard' });
  const el = document.createElement('div'); el.className = 'mwrap';
  el.innerHTML = `<div class="mdl pal"><input id="pal-in" placeholder="Rechercher un projet, une page, une action…" autocomplete="off"><div class="pal-l" id="pal-l"></div></div>`;
  $('#modals').appendChild(el);
  el._close = () => el.remove();
  el.addEventListener('mousedown', ev => { if (ev.target === el) el._close(); });
  const inp = $('#pal-in', el), list = $('#pal-l', el);
  let res = [], sel = 0;
  const build = q => {
    const n = norm(q);
    res = cmds.filter(c => !n || norm(c.t).includes(n)).slice(0, 8);
    if (n.length > 1) {
      for (const p of DB.projects) {
        if (res.length > 16) break;
        if (matchProject(p, n)) res.push({ t: p.client, s: '#' + p.id + ' · ' + (p.city || ''), proj: p.id, ic: 'package' });
      }
    }
    sel = 0; paint();
  };
  const paint = () => {
    list.innerHTML = res.map((c, i) => `<div class="pal-i${i === sel ? ' on' : ''}" data-i="${i}">${ic(c.ic)}<span>${esc(c.t)}</span><small>${esc(c.s)}</small></div>`).join('')
      || `<div class="pal-i mut">Aucun résultat</div>`;
    $$('.pal-i[data-i]', list).forEach(x => { x.onmousedown = ev => { ev.preventDefault(); run(+x.dataset.i); }; });
  };
  const run = i => {
    const c = res[i]; if (!c) return;
    el.remove();
    if (c.go) go(c.go); else if (c.proj) openProject(c.proj); else if (c.act) ACT[c.act]({ dataset: {} });
  };
  inp.addEventListener('input', () => build(inp.value));
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { sel = Math.min(res.length - 1, sel + 1); paint(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp') { sel = Math.max(0, sel - 1); paint(); ev.preventDefault(); }
    else if (ev.key === 'Enter') { run(sel); ev.preventDefault(); }
  });
  build(''); setTimeout(() => inp.focus(), 30);
}

  const clock = () => { const el = $('#ki-clock'); if (el) el.textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };

  const sec = cur ? +cur.scroll || 0 : 0;
  if (sec > 0) {
    let t = 0;
    kioskTimers.push(setInterval(() => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      if (max <= 8) { window.scrollTo(0, 0); return; }
      t += 0.5;

/* =====================================================================
   8. EXPORTS, IMPORTS & DIAGRAMMES
   Tout se fait dans le navigateur, sans bibliothèque externe (fonctionne hors ligne) :
   Excel (.xlsx) · CSV · JSON · PDF (fenêtre d'impression) · agenda (.ics) · PNG · SVG · presse-papiers.
   Un jeu de données = { title, sheet?, sub?, pdf?, cols: [{ l, t?, dec? }], rows: [[…]] }
   t : 'text' (défaut) · 'int' · 'num' · 'date' (AAAA-MM-JJ) · 'dt' (date-heure ISO)
   ===================================================================== */
const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'export';
const yesNo = b => b ? 'oui' : 'non';
const SLOT_TXT = (o, sv) => (sv || {}).mode === 'half' ? (o.slot === 'PM' ? 'après-midi' : 'matin') : 'journée';
const CONTACT_TXT = { ok: 'rendez-vous confirmé', msg: 'message laissé', none: 'non contacté' };
const ALERT_LEVEL = { danger: 'Bloquante', warn: 'À surveiller', info: 'Information' };

/* valeur lisible d'une cellule (PDF, largeur des colonnes Excel) */
function dsText(c, v) {
  if (v == null || v === '') return '';
  if (c.t === 'date') return D.fmt(String(v).slice(0, 10));
  if (c.t === 'dt') return D.dt(v);
  if (c.t === 'num') return num(v, c.dec ?? 1);
  return String(v);
}
/* valeur CSV / presse-papiers : virgule décimale et dates JJ/MM/AAAA, relues telles quelles par Excel en français */
function dsCsv(c, v) {
  if (v == null || v === '') return '';
  if (c.t === 'num' || c.t === 'int') return String(Math.round(+v * 100) / 100).replace('.', ',');
  if (c.t === 'date' || c.t === 'dt') return dsText(c, v);
  return String(v);
}
const dsObjects = ds => ds.rows.map(r => Object.fromEntries(ds.cols.map((c, i) => [c.l, r[i] ?? ''])));
const dsCsvText = ds => CSV.make([ds.cols.map(c => c.l), ...ds.rows.map(r => ds.cols.map((c, i) => dsCsv(c, r[i])))]);

/* lecture d'un fichier texte : UTF-8, sinon Windows-1252 (CSV enregistrés par Excel en français) */
async function readText(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^﻿/, ''); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}
/* presse-papiers : l'API moderne exige HTTPS, d'où la méthode de secours */
function copyText(t) {

}

/* ---------- lecture de n'importe quel fichier tabulaire ---------- */
function objectsToRows(list) {
  const keys = []; for (const o of list) if (o && typeof o === 'object') for (const k of Object.keys(o)) if (!keys.includes(k)) keys.push(k);
  return [keys, ...list.map(o => keys.map(k => { const v = (o || {})[k]; return Array.isArray(v) ? v.join(', ') : v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : v; }))];
}
async function readTabular(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'xls' || ext === 'ods') throw new Error('Format .' + ext + ' non pris en charge : ouvrez le fichier dans Excel ou LibreOffice et enregistrez-le en .xlsx ou .csv.');
  if (ext === 'xlsx' || ext === 'xlsm') return { sheets: await readXlsx(await file.arrayBuffer()) };
  const text = await readText(file);
  if (ext === 'json' || /^\s*[\[{]/.test(text)) {
    let j; try { j = JSON.parse(text); } catch (e) { throw new Error('JSON invalide : ' + e.message); }
    if (j && !Array.isArray(j) && Array.isArray(j.projects) && j.settings) return { backup: j };
    if (Array.isArray(j)) return { sheets: [{ name: file.name.replace(/\.\w+$/, ''), rows: objectsToRows(j) }] };
    const arrs = Object.entries(j || {}).filter(([, v]) => Array.isArray(v));
    if (arrs.length) return { sheets: arrs.map(([k, v]) => ({ name: k, rows: objectsToRows(v) })) };
    throw new Error('Ce JSON ne contient aucun tableau de lignes.');
  }
  return { sheets: [{ name: file.name.replace(/\.\w+$/, ''), rows: CSV.parse(text) }] };
}

/* ---------- images : SVG autonome et PNG ---------- */
let LIGHT_VARS = null;
function lightVars() {            // couleurs du thème clair, quel que soit le thème affiché (papier, courriel)
  if (LIGHT_VARS) return LIGHT_VARS;
  LIGHT_VARS = {};
  for (const sh of document.styleSheets) {
    let rules; try { rules = sh.cssRules; } catch (e) { continue; }
    for (const r of rules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--')) LIGHT_VARS[p] = r.style.getPropertyValue(p).trim();
  }
  return LIGHT_VARS;
}

  const s = new XMLSerializer().serializeToString(el).replace(/var\((--[\w-]+)\)/g, (m, k) => v[k] || '#888888')
    .replace(/^<svg\b[^>]*>/, `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Segoe UI, Arial, sans-serif"><rect width="${W}" height="${H}" fill="#ffffff"/>`);

}

    const url = URL.createObjectURL(new Blob([s], { type: 'image/svg+xml;charset=utf-8' })), img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(H * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);

    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image illisible')); };
    img.src = url;

        'END:VEVENT');
    }
  }
  for (const a of abs) {
    out.push('BEGIN:VEVENT', `UID:abs${a.id}@d8planning`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${a.start.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${D.add(a.end, 1).replace(/-/g, '')}`,
      `SUMMARY:${q((label(get('absenceTypes', a.typeId)) || 'Absence') + (staffOf ? ' · ' + staffName(a.staffId) : ''))}`, 'END:VEVENT');
  }

}

}
function absHalves(a, from, to) {          // demi-journées ouvrées d'absence comprises entre from et to
  let n = 0;

}

const parseBool = v => { const s = norm(v); return /^(oui|o|yes|y|vrai|true|1|x|actif|active)$/.test(s) ? true : /^(non|n|no|faux|false|0|inactif|inactive)$/.test(s) ? false : undefined; };
const parseNum = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : ''; };
const headIdx = (head, ...names) => { for (const n of names) { const i = head.findIndex(h => h === n); if (i >= 0) return i; } for (const n of names) { const i = head.findIndex(h => h.includes(n)); if (i >= 0) return i; } return -1; };
const IMPORTS = {
  projects: { label: 'Projets', perm: 'projects' },
  absences: { label: 'Absences & congés', perm: 'absences' },
  ...Object.fromEntries(Object.keys(SCHEMAS).filter(k => k !== 'roles').map(k => [k, { label: SCHEMAS[k].label, perm: collPerm(k) }]))
};
const PROJ_COLS = {
  id: ['n°', 'numero', 'num', '#', 'id'], client: ['client', 'nom'], type: ['type', 'mouvement'], da: ['modele', 'distributeur', 'machine'],
  city: ['ville'], address: ['adresse'], req: ['date demandee', 'demand', 'date'], ag: ['agence', 'site'], com: ['commercial'],
  ref: ['commande', 'reference', 'ref'], part: ['rang'], tags: ['etiquette', 'tag'], contact: ['contact'], phone: ['telephone', 'tel'], notes: ['note', 'commentaire']
};
const ABS_COLS = { staff: ['ressource', 'personne', 'salarie', 'technicien', 'nom'], type: ['motif', 'type'], start: ['du', 'debut le', 'date de debut', 'date debut', 'depuis'], startSlot: ['debut'], end: ['au', 'fin le', 'date de fin', 'date fin', 'jusqu'], endSlot: ['fin'], note: ['note', 'commentaire'] };
function mapCols(head, spec) {
  const used = new Set(), out = {};
  for (const [k, names] of Object.entries(spec)) {
    let i = -1;
    for (const n of names) { i = head.findIndex((h, j) => !used.has(j) && h === n); if (i >= 0) break; }
    if (i < 0) for (const n of names) { i = head.findIndex((h, j) => !used.has(j) && h.includes(n) && n.length > 1); if (i >= 0) break; }
    if (i >= 0) used.add(i);
    out[k] = i;
  }
  return out;
}
function collCols(kind, head) {
  const S = SCHEMAS[kind], out = {};
  for (const f of S.fields) out[f.k] = head.findIndex(h => h === norm(f.l) || h === norm(f.k));
  out.id = head.findIndex(h => h === 'id' || h === 'identifiant');
  return out;
}
function recognized(target, head) {
  if (target === 'projects') { const m = mapCols(head, PROJ_COLS); return Object.keys(m).filter(k => m[k] >= 0).map(k => head[m[k]]); }
  if (target === 'absences') { const m = mapCols(head, ABS_COLS); return Object.keys(m).filter(k => m[k] >= 0).map(k => head[m[k]]); }
  const m = collCols(target, head); return Object.keys(m).filter(k => m[k] >= 0).map(k => head[m[k]]);
}
function guessTarget(name, head, pref) {
  const n = norm(name);
  for (const [k, t] of Object.entries(IMPORTS)) if (can(t.perm) && (n === norm(t.label) || n.includes(norm(t.label).split(' ')[0]))) return k;
  if (pref && can(IMPORTS[pref].perm)) return pref;
  let best = null, bs = 0;
  for (const k of Object.keys(IMPORTS)) { if (!can(IMPORTS[k].perm)) continue; const s = recognized(k, head).length; if (s > bs) { bs = s; best = k; } }
  return best;
}
async function importFile(pref) {

  let parsed;
  try { parsed = await readTabular(f); } catch (e) { return toast(e.message || 'Fichier illisible.', 'danger'); }
  if (parsed.backup) { if (!needs('data')) return; return restoreBackup(parsed.backup, f.name); }

    nSkip ? `<b>${nSkip}</b> ligne(s) ignorée(s) : champ obligatoire vide` : '',

function activiteData(R) {
  const days = []; for (let d = R.from; d <= R.to; d = D.add(d, 1)) if (isWork(d)) days.push(d);
  return DB.services.filter(s => s.active !== false).sort(byOrder).map(sv => {
    const rows = staffOfService(sv.id).map(s => {
      const ops = (idx().opsByStaff.get(s.id) || []).filter(o => o.serviceId === sv.id);
      const done = ops.filter(o => doneInRange(o, R.from, R.to));
      let cap = 0, used = 0;
      for (const d of days) {
        let av = 0; for (const sl of [0, 1]) if (!absenceAt(s.id, d, sl)) av++;
        if (sv.mode === 'half') {
          cap += av;
          used += [0, 1].filter(sl => ((idx().slots.get(s.id) || new Map()).get(d + '|' + sl) || []).some(id => (O(id) || {}).serviceId === sv.id)).length;
        } else {
          cap += av / 2 * (+sv.perDay || 1);
          used += (idx().dayOps.get(s.id + '|' + d) || []).filter(o => o.serviceId === sv.id).length;
        }
      }
      return { s, n: done.length, hours: done.reduce((t, o) => t + opHours(o), 0), pct: cap > 0 ? Math.round(used / cap * 100) : null };
    }).filter(r => r.n || r.pct);
    return { sv, rows };
  }).filter(g => g.rows.length);
}
