    if (!x) return toast('Rien à exporter ici.', 'warn');
    const t = x.title || (x.ds && x.ds.title) || '', n = x.ds ? num(x.ds.rows.length) + ' ligne(s)' : x.sheets ? x.sheets.length + ' feuilles' : '';
    popover(el, `<div style="padding:7px 10px 6px;border-bottom:1px solid var(--border);margin-bottom:3px"><b>Exporter</b>
        <div class="mut" style="font-size:12px">${esc(t)}${n ? ' · ' + n : ''}</div></div>
      ${xpFormats(x).map(f => `<div class="pal-i" data-act="xp-go" data-x="${esc(el.dataset.x)}" data-f="${f}">${ic(FMT[f][0])}
        <span style="display:flex;flex-direction:column;line-height:1.3">${FMT[f][1]}<span class="mut" style="font-size:11.5px">${FMT[f][2]}</span></span></div>`).join('')}`);
  },
  'xp-go': async el => {
    closePop();
    try { const x = xpGet(el.dataset.x); if (x) await exportAs(el.dataset.f, x); }
    catch (err) { console.error(err); toast('Export impossible : ' + err.message, 'danger'); }
  },
  imp: el => { closePop(); if (needs('import')) importFile(el.dataset.t || ''); },
  'g-mode': el => { UI.gantt.mode = el.dataset.v; saveUI(); render(); },
  'g-shift': el => { UI.gantt.from = D.add(D.monday(UI.gantt.from || D.today()), +el.dataset.d); saveUI(); render(); },
  'g-today': () => { UI.gantt.from = D.add(D.monday(D.today()), -7); saveUI(); render(); }
});
ON.gantt = el => {
  UI.gantt[el.dataset.k] = el.type === 'checkbox' ? el.checked : (el.dataset.k === 'weeks' || el.dataset.k === 'zoom' ? +el.value : el.value);
  saveUI(); scheduleRender();
};
/* répartitions des projets terminés (rapport « Projets & délais ») */
function countBy(list, key, coll) {
  const m = new Map();
  for (const p of list) m.set(p[key], (m.get(p[key]) || 0) + 1);
  return [...m.entries()].map(([k, v]) => ({ label: label(get(coll, k)) || 'non renseigné', value: v, color: (get(coll, k) || {}).color }))
    .sort((a, b) => b.value - a.value);
}
const HB = { daModelId: ['daModels', 'Modèle'], typeId: ['projectTypes', 'Type de projet'], agencyId: ['agencies', 'Agence'] };
XP.hb = key => {
  const [coll, l] = HB[key] || [], R = UI.rep; if (!coll) return null;
  return { ds: { title: 'Projets terminés par ' + l.toLowerCase(), sub: `du ${D.fmt(R.from)} au ${D.fmt(R.to)}`, cols: [{ l }, { l: 'Projets terminés', t: 'int' }], rows: countBy(projetsDone(R), key, coll).map(r => [r.label, r.value]) } };
};

/* =====================================================================
   9. SÉCURITÉ & ACCÈS (droit « security » ; certaines actions exigent « users » ou « super »)
   ===================================================================== */
const SEC = { data: null, busy: false };
const AUTH_EV = {
  login: ['Connexion', 'ok'], fail: ['Échec de connexion', 'danger'], blocked: ['Adresse bloquée', 'danger'], disabled: ['Compte désactivé refusé', 'warn'],
  logout: ['Déconnexion', ''], signup: ['Création d’accès', 'ok'], password: ['Mot de passe changé', ''], reset: ['Accès réinitialisé', 'warn'],
  kick: ['Déconnexion forcée', 'warn'], 'kick-all': ['Tout le monde déconnecté', 'warn'], 'sa-ok': ['Mot de passe super admin saisi', ''],
  'sa-fail': ['Mot de passe super admin erroné', 'danger'], 'sa-change': ['Mot de passe super admin changé', 'warn'], 'sec-set': ['Réglages de sécurité modifiés', 'warn'],
  unblock: ['Adresse débloquée', ''], 'backup-now': ['Sauvegarde manuelle', 'ok'], 'backup-get': ['Sauvegarde téléchargée', '']
};
async function loadSecurity() {
  if (SEC.busy || Sync.mode !== 'server') return; SEC.busy = true;
  const b = r => r && r.ok ? r.body : null;
  const [acc, log, fails, bk, cfg] = await Promise.all(['accounts', 'auth-log', 'fails', 'backups', 'sec-get'].map(a => Auth.api(a).catch(() => null)));
  SEC.data = { acc: (b(acc) || {}).accounts || [], log: (b(log) || {}).events || [], fails: b(fails) || { ips: [] }, backups: b(bk) || { files: [] }, cfg: b(cfg) || {} };
  SEC.busy = false;
  if (route().path === '/admin/securite') render();
}
async function fetchBackup(name) {
  const r = await fetch('api.php?a=backup-get&f=' + encodeURIComponent(name), { cache: 'no-store' });
  if (!r.ok) throw new Error('sauvegarde introuvable');
  return r.text();
}
function pageSecurity() {
  const supers = DB.users.filter(u => isSuperUser(u)).sort(byName), iAmSuper = can('super');
  const sec = (t, icn, inner, acts = '') => `<div class="card" style="margin-bottom:14px"><div class="card-h">${ic(icn)}<span>${t}</span><span style="margin-left:auto;display:flex;gap:6px">${acts}</span></div>${inner}</div>`;
  const superCard = sec('Super administrateurs', 'shield', `<div class="card-b">
      <p class="mut" style="margin:0 0 10px">Le super administrateur a tous les droits, sans restriction : lui seul peut nommer ou retirer un super administrateur, modifier ce rôle,
        changer les réglages de sécurité et déconnecter tout le monde. Vider, réinitialiser ou restaurer la base exige toujours de retaper le mot de passe super administrateur, même pour lui.</p>
      <div class="chips" style="margin-bottom:12px">${supers.map(u => `<span class="pill" style="${cvar('#7c5cc4', .16, .4)}">${ic('shield', 'sm')} ${esc(label(u))}</span>`).join('') || '<span class="mut">Aucun super administrateur pour l’instant.</span>'}</div>
      <div class="row wrap">${iAmSuper ? `<span class="pill" style="${cvar('#3c9f5f', .16, .4)}">${ic('check', 'sm')} Vous êtes super administrateur</span>
          ${Sync.mode === 'server' ? `<button class="btn" data-act="sa-change">${ic('lock')} Mot de passe partagé</button><button class="btn dgr" data-act="kick-all">${ic('logout')} Déconnecter tout le monde</button>` : ''}`
        : can('users') ? `<button class="btn pri" data-act="become-super">${ic('shield')} Devenir super administrateur</button>
          <span class="mut" style="font-size:12.5px">Le mot de passe super administrateur est demandé.</span>` : ''}</div></div>`);
  const head = phead('Sécurité & accès', 'Qui peut entrer, qui est entré, et de quoi repartir en cas de problème');
  if (Sync.mode !== 'server') return head + superCard + `<div class="bnr info">${ic('info')}<span>Le journal des connexions, les sessions, les adresses bloquées et les sauvegardes du serveur
    n’existent qu’en base partagée (api.php sur un serveur). En base locale, les données ne quittent pas ce navigateur.</span></div>`;
  if (!SEC.data || lastPath !== route().path) loadSecurity();
  const D0 = SEC.data;
  if (!D0) return head + superCard + `<div class="card"><div class="card-b mut">Chargement…</div></div>`;
  const users = can('users');
  const accRows = D0.acc.map(a => ({ a, u: get('users', a.userId) })).sort((x, y) => String(y.a.lastLogin || '').localeCompare(String(x.a.lastLogin || '')));
  const accHTML = `<div class="tbl-wrap" style="box-shadow:none;border:0;border-radius:0"><table class="tbl"><thead><tr><th>Personne</th><th>Identifiant</th><th>Rôle</th><th>Accès créé</th><th>Dernière connexion</th><th style="width:90px"></th></tr></thead><tbody>
    ${accRows.map(({ a, u }) => `<tr><td><b>${esc(u ? label(u) : '(fiche supprimée)')}</b>${u && u.active === false ? ' <span class="mut">· désactivé</span>' : ''}</td><td><span class="chip">${esc(a.login)}</span></td>
      <td>${u ? (isSuperUser(u) ? `<span class="pill" style="${cvar('#7c5cc4', .16, .4)}">${esc(label(roleOf(u)))}</span>` : esc(label(roleOf(u)))) : ''}</td>
      <td class="nowrap mut">${esc(D.dt(a.created))}</td><td class="nowrap">${esc(D.dt(a.lastLogin) || '—')}</td>
      <td class="nowrap">${users && u && !(Auth.user && Auth.user.userId === u.id) && (iAmSuper || !isSuperUser(u)) ? `<button class="ibtn" data-act="kick" data-id="${esc(u.id)}" title="Forcer la déconnexion">${ic('logout')}</button>
        <button class="ibtn" data-act="reset-access" data-id="${esc(u.id)}" title="Réinitialiser l’accès">${ic('lock')}</button>` : ''}</td></tr>`).join('')
    || `<tr><td colspan="6">${emptyBox('Aucun accès créé', '')}</td></tr>`}</tbody></table></div>`;
  const logHTML = `<div class="tbl-wrap" style="max-height:420px;box-shadow:none;border:0;border-radius:0"><table class="tbl"><thead><tr><th style="width:140px">Date</th><th>Événement</th><th>Identifiant</th><th>Adresse IP</th><th>Détail</th></tr></thead><tbody>
    ${D0.log.slice(0, 200).map(e => { const k = AUTH_EV[e.ev] || [e.ev, '']; const col = { ok: '#3c9f5f', danger: '#d1444a', warn: '#b4700c' }[k[1]];
      return `<tr><td class="nowrap mut">${esc(D.dt(e.t))}</td><td>${col ? `<span class="pill" style="${cvar(col, .14, .35)}">${esc(k[0])}</span>` : esc(k[0])}</td>
        <td>${esc(e.login || '—')}</td><td class="n">${esc(e.ip)}</td><td class="mut">${esc(e.info || '')}</td></tr>`; }).join('')
    || `<tr><td colspan="5">${emptyBox('Journal vide', 'Les connexions apparaîtront ici.')}</td></tr>`}</tbody></table></div>`;
  const ips = D0.fails.ips || [];
  const ipHTML = `<div class="card-b">${ips.length ? `<table class="tbl"><thead><tr><th>Adresse IP</th><th>Échecs</th><th>Dernier essai</th><th>État</th><th></th></tr></thead><tbody>
    ${ips.map(x => `<tr><td class="n">${esc(x.ip)}</td><td>${x.n} / ${D0.fails.max}</td><td>${esc(D.dt(x.last))}</td>
      <td>${x.blocked ? `<span class="pill" style="${cvar('#d1444a', .14, .35)}">bloquée jusqu’à ${esc(D.dt(x.until).slice(-5))}</span>` : '<span class="mut">surveillée</span>'}</td>
      <td><button class="btn sm" data-act="unblock" data-ip="${esc(x.ip)}">Débloquer</button></td></tr>`).join('')}</tbody></table>`
    : `<p class="mut" style="margin:0">Aucune tentative ratée récente. Après ${D0.fails.max || 8} échecs, une adresse est bloquée ${Math.round((D0.fails.window || 900) / 60)} min.</p>`}</div>`;
  const files = D0.backups.files || [];
  const bkHTML = `<div class="card-b"><p class="mut" style="margin:0 0 10px">Le serveur garde une copie au plus toutes les ${Math.round((D0.backups.every || 900) / 60)} min, et les ${D0.backups.keep || 150} dernières.</p>
    ${files.length ? `<div class="tbl-wrap" style="max-height:330px"><table class="tbl"><thead><tr><th>Date</th><th>Version</th><th>Taille</th><th></th></tr></thead><tbody>
      ${files.map(f => `<tr><td>${esc(D.dt(f.date))}${/manuelle/.test(f.name) ? ' <span class="chip">manuelle</span>' : ''}</td><td class="n">v${f.version ?? '?'}</td><td>${num(f.size / 1024, 0)} Ko</td>
        <td class="nowrap"><button class="btn sm" data-act="bk-get" data-f="${esc(f.name)}">${ic('download', 'sm')} Télécharger</button>
          ${can('data') ? `<button class="btn sm dgr" data-act="bk-restore" data-f="${esc(f.name)}">${ic('repeat', 'sm')} Restaurer</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="mut" style="margin:0">Aucune copie pour l’instant.</p>'}</div>`;
  const c = D0.cfg;
  const cfgHTML = `<div class="card-b"><form id="sec-f" class="fgrid">
      <div class="fld"><label>Code pour créer son accès</label><input class="in" name="signupCode" value="${esc(c.signupCode || '')}" ${iAmSuper ? '' : 'disabled'} placeholder="aucun code demandé" autocomplete="off">
        <span class="help">Sans code, la première personne qui choisit un nom « à créer » prend l’accès.</span></div>
      <div class="fld"><label>Déconnexion après inactivité (heures)</label><input class="in" type="number" min="1" max="72" name="sessionHours" value="${c.sessionHours || 12}" ${iAmSuper ? '' : 'disabled'}></div>
      <div class="fld"><label>Longueur minimale des mots de passe</label><input class="in" type="number" min="8" max="64" name="minPassword" value="${c.minPassword || 8}" ${iAmSuper ? '' : 'disabled'}></div></form>
    <div class="row wrap" style="margin-top:12px">${iAmSuper ? `<button class="btn pri" data-act="sec-save">${ic('check')} Enregistrer</button>` : '<span class="mut">Modifiable par un super administrateur.</span>'}
      ${c.https === false ? `<span class="pill" style="${cvar('#b4700c', .14, .35)}">${ic('warn', 'sm')} Connexion non chiffrée (http) : les mots de passe circulent en clair</span>` : ''}</div></div>`;
  return head + superCard
    + sec(`Accès des utilisateurs (${D0.acc.length})`, 'usercircle', accHTML)
    + sec('Journal des connexions', 'activity', logHTML, xpBtn('auth-log', { sm: 1 }))
    + `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr))">${sec('Adresses IP surveillées', 'warn', ipHTML)}${sec('Réglages de sécurité', 'sliders', cfgHTML)}</div>`
    + sec('Sauvegardes du serveur', 'database', bkHTML, `<button class="btn sm" data-act="bk-now">${ic('plus', 'sm')} Sauvegarder maintenant</button>`);
}
XP['auth-log'] = () => SEC.data ? { ds: { title: 'Journal des connexions', sheet: 'Connexions', cols: [{ l: 'Date', t: 'dt' }, { l: 'Événement' }, { l: 'Identifiant' }, { l: 'Adresse IP' }, { l: 'Détail' }],
  rows: SEC.data.log.map(e => [e.t, (AUTH_EV[e.ev] || [e.ev])[0], e.login, e.ip, e.info]) } } : null;
const secCall = async (a, body, okMsg) => {
  const r = await Auth.api(a, body).catch(() => null);
  toast(r && r.ok ? okMsg : (r && r.body && r.body.error) || 'Serveur injoignable.', r && r.ok ? 'ok' : 'danger');
  if (r && r.ok) { SEC.data = null; loadSecurity(); }
  return r && r.ok;
};
Object.assign(ACT, {
  'become-super': async () => {
    if (!needs('users')) return;
    if (!await superAdmin('Vous allez recevoir le rôle « Super administrateur » : tous les droits, sans restriction. Saisissez le mot de passe super administrateur pour confirmer.', { ok: 'Devenir super administrateur', forcePwd: true })) return;
    const myId = (me() || {}).id;
    mutate('Nomination super administrateur · ' + label(me()), db => {
      let r = db.roles.find(x => (x.perms || []).includes('super'));
      if (!r) { r = { id: db.roles.some(x => x.id === 'r_super') ? uid('rol') : 'r_super', name: 'Super administrateur', perms: ['super'], v2: true }; db.roles.unshift(r); }
      const u = db.users.find(x => x.id === myId); if (u) u.roleId = r.id;
    });
    toast('Vous êtes super administrateur', 'ok');
  },
  'kick-all': async () => {
    if (!needs('super')) return;
    if (!await confirmTyped('Toutes les personnes connectées, sauf vous, seront déconnectées et devront ressaisir leur mot de passe.', { ok: 'Déconnecter tout le monde' })) return;
    secCall('kick-all', {}, 'Tout le monde a été déconnecté');
  },
  unblock: el => { if (needs('security')) secCall('unblock', { ip: el.dataset.ip }, 'Adresse débloquée'); },
  'bk-now': () => { if (needs('security')) secCall('backup-now', {}, 'Sauvegarde créée sur le serveur'); },
  'bk-get': async el => {
    try { download(el.dataset.f, await fetchBackup(el.dataset.f), 'application/json'); }
    catch (e) { toast('Téléchargement impossible : ' + e.message, 'danger'); }
  },
  'bk-restore': async el => {
    if (!needs('data')) return;
    let data; try { data = JSON.parse(await fetchBackup(el.dataset.f)); } catch (e) { return toast('Sauvegarde illisible.', 'danger'); }
    restoreBackup(data, el.dataset.f);
  },
  'sec-save': () => {
    if (!needs('super')) return;
    const v = formVals($('#sec-f'));
    secCall('sec-set', { signupCode: v.signupCode, sessionHours: +v.sessionHours, minPassword: +v.minPassword }, 'Réglages de sécurité enregistrés');
  }
});

/* =====================================================================
   7. DÉMARRAGE
   ===================================================================== */
(async function start() {
  applyTheme();
  if (UI.mini) document.body.classList.add('mini');
  applyFs();
  try { DB = await Sync.init(); }
  catch (e) { console.error(e); if (e.fatal) return Auth.fatal(e.message); DB = migrate(null); }
  if (Sync.mode === 'server') { UI.user = Auth.user.userId; saveUI(); }
  else if (!UI.user || !DB.users.some(u => u.id === UI.user)) {
    const a = DB.users.find(u => isSuperUser(u)) || DB.users.find(u => effPerms(roleOf(u)).includes('users')) || DB.users[0];
    UI.user = a ? a.id : ''; saveUI();
  }
  setSync(Sync.mode === 'memory' ? 'warn' : 'ok',
    Sync.mode === 'server' ? 'Synchronisé · v' + Sync.version : Sync.mode === 'local' ? 'Enregistré sur ce poste' : 'Aucun stockage');
  if (Sync.mode === 'server' && !me()) banner('danger', 'Votre fiche utilisateur n’existe plus dans le planning : consultation seule. Contactez un administrateur.', 'nouser');
  if (Sync.mode === 'memory') banner('danger', 'Ce navigateur bloque le stockage : les modifications seront perdues à la fermeture. Exportez régulièrement une sauvegarde.', 'nostore');
  if (!location.hash) location.hash = '#/';
  render();
  window.addEventListener('hashchange', render);
  window.addEventListener('resize', debounce(() => {   // largeur ou hauteur changée : taille du texte, Gantt et planning recalculés
    applyFs();
    if (['gantt', 'planning', 'ecran'].includes(route().seg[0])) render(); else drawCharts();
  }, 200));
  setInterval(() => Sync.poll(), Math.max(5, +DB.settings.pollSec || 15) * 1000);
  const u = me();
  if (u && u.lastLogin !== D.today()) mutate('Connexion', db => { const x = db.users.find(y => y.id === u.id); if (x) x.lastLogin = D.today(); }, { nolog: true });
})();
