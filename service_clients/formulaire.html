<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<meta name="color-scheme" content="light dark">
<title>Demande de remboursement – D8</title>
<!--
  D8 · Service clients — formulaire client en ligne (demande de remboursement).
  Ouvert par le client avec le lien personnel reçu par e-mail : formulaire.html?t=<jeton>.
  Aucun cookie, aucune ressource extérieure. Les contrôles sont refaits par le serveur (api.php).
-->
<style>
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --navy:#1f3864;--blue:#2e5c8a;--gold:#ae8441;
  --bg:#f2f4f7;--surface:#fff;--surface-2:#f7f8fa;--border:#dde2e8;--border-2:#c4ccd6;
  --text:#1b2330;--text-2:#465163;--text-3:#68727f;
  --primary:#1f3864;--on-primary:#fff;--focus:#2e5c8a;
  --danger:#b42323;--danger-soft:#fdeceb;--ok:#2c7a4b;--ok-soft:#e7f5ec;--info-soft:#eef2f8;--gold-soft:#f7f1e6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1218;--surface:#171b22;--surface-2:#1c2129;--border:#2b313b;--border-2:#3b434f;--text:#e6e9ee;--text-2:#b4bcc8;--text-3:#8b95a3;
    --navy:#9db8e3;--blue:#9db8e3;--primary:#7fa3d9;--on-primary:#0f1218;--focus:#9db8e3;--danger:#ef7b7b;--danger-soft:#3a1f22;--ok:#5cc28a;--ok-soft:#173023;--info-soft:#1f2a3c;--gold:#c9a063;--gold-soft:#2b2418;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-bottom:3px solid var(--gold);border-radius:14px 14px 0 0;padding:18px 20px}
header.top img{height:46px;width:auto;background:#fff;border-radius:6px;padding:2px}
header.top h1{margin:0;font-size:22px;line-height:1.2;color:var(--navy);letter-spacing:.2px}
header.top p{margin:2px 0 0;color:var(--blue);font-size:14px}
main.card{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;padding:6px 20px 22px}
.intro{color:var(--text-2);font-size:15px}
.intro b{color:var(--text)}
fieldset{border:none;margin:0;padding:18px 0 4px;border-top:1px solid var(--border)}
fieldset:first-of-type{border-top:none}
legend{padding:0;font-weight:700;font-size:17px;color:var(--navy);margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
@media (max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:10px 10px 40px}header.top{padding:14px}header.top h1{font-size:19px}main.card{padding:4px 14px 18px}}
label.l,.l{font-weight:600;font-size:14.5px}
.req{color:var(--danger)}
.hint{font-size:13px;color:var(--text-3);margin-top:-3px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],textarea{width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border-2);border-radius:9px;padding:10px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.comb{font:600 18px/1 ui-monospace,Consolas,monospace;letter-spacing:.3em;max-width:220px}
.money{position:relative;max-width:220px}
.money input{padding-right:30px}
.money::after{content:"€";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:9px;cursor:pointer;background:var(--surface)}
.opt:hover{background:var(--surface-2)}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--navy);flex:none}
.opt:has(input:checked){border-color:var(--navy);background:var(--info-soft)}
.opt .other{margin-top:6px}
.f.bad input,.f.bad textarea{border-color:var(--danger)}
.f.bad .opts .opt{border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}
.err{color:var(--danger);font-size:13.5px;font-weight:600}
.err:empty{display:none}
.box{border-radius:10px;padding:12px 14px;font-size:14.5px;margin:10px 0}
.box.info{background:var(--info-soft);border-left:4px solid var(--blue)}
.box.gold{background:var(--gold-soft);border-left:4px solid var(--gold)}
.box.danger{background:var(--danger-soft);border-left:4px solid var(--danger)}
.box.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.box p{margin:.3em 0}
details.help{margin-top:6px;font-size:14px}
details.help summary{cursor:pointer;color:var(--blue);font-weight:600}
details.help ul{padding-left:20px;margin:6px 0}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--navy);flex:none}
.actions{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button.btn{font:inherit;font-weight:700;border:none;border-radius:10px;padding:12px 22px;min-height:48px;cursor:pointer;background:var(--primary);color:var(--on-primary)}
button.btn:disabled{opacity:.6;cursor:wait}
button.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--border-2)}
.small{font-size:13px;color:var(--text-3)}
.hp{position:absolute!important;left:-10000px!important;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:24px 4px}
.done .ref{display:inline-block;font:700 20px/1 ui-monospace,Consolas,monospace;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:8px 0 12px;letter-spacing:.04em}
.done svg{width:56px;height:56px;color:var(--ok)}
footer{color:var(--text-3);font-size:12.5px;text-align:center;margin-top:16px}
[hidden]{display:none!important}
@media print{.actions,details.help summary{display:none}body{background:#fff}}
</style>
</head>

  <main class="card" id="main" aria-live="polite">

  </main>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const params = new URLSearchParams(location.search);

/* Même schéma que le serveur (api.php › WEB_FORMS) : le serveur refait tous les contrôles. */
const PAIEMENT = [['cb', 'Carte bancaire physique (insérée ou sans contact)'], ['mobile', 'Téléphone ou montre connectée (Apple Pay, Google Wallet, Samsung Pay…)'], ['badge', 'Badge / carte d’accès interne à l’entreprise'], ['especes', 'Espèces'], ['autre', 'Autre']];
const INCIDENT = [['non_delivre', 'Produit non délivré'], ['sans_gobelet', 'Boisson servie sans gobelet'], ['bloque', 'Distributeur bloqué'], ['double', 'Double débit'], ['monnaie', 'Monnaie non rendue'], ['autre', 'Autre']];
const RB_MODE = [['especes', 'En espèces, à l’accueil ou auprès de votre référent site'], ['compte', 'Sur le compte utilisé pour le paiement'], ['virement', 'Par virement bancaire (RIB à nous envoyer en réponse à l’accusé de réception)'], ['appli', 'Sur votre application mobile Pay4Vend ou Matipay']];

const field = (id, label, o = {}) => `<div class="f${o.full ? ' full' : ''}" data-f="${id}">
  <label class="l" for="${id}">${esc(label)}${o.req ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>
  ${o.hint ? `<div class="hint" id="${id}-h">${esc(o.hint)}</div>` : ''}
  ${o.html}
  <div class="err" id="${id}-e"></div></div>`;
const input = (id, type, attrs = '') => `<input id="${id}" name="${id}" type="${type}" ${attrs}>`;
const radios = (id, opts, other) => `<div class="opts" role="radiogroup" aria-labelledby="${id}-l">${opts.map(([v, l]) => `<label class="opt"><input type="radio" name="${id}" value="${v}"><span>${esc(l)}${v === 'autre' && other ? `<input class="other" id="${other}" name="${other}" type="text" maxlength="60" placeholder="Précisez" aria-label="Précisez">` : ''}</span></label>`).join('')}</div>`;
const radioField = (id, label, opts, req, other) => `<div class="f full" data-f="${id}"><div class="l" id="${id}-l">${esc(label)}${req ? ' <span class="req" aria-hidden="true">*</span>' : ''}</div>${radios(id, opts, other)}<div class="err" id="${id}-e"></div></div>`;

function formHTML(c, pre) {
  const today = new Date(); const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  return `<p class="intro">Vous n’avez pas reçu votre produit ou avez rencontré un incident lors de votre achat : nous vous présentons nos excuses pour la gêne occasionnée.
    Pour procéder au remboursement, nous devons <b>retrouver votre transaction dans les relevés de paiement du distributeur</b>. Complétez ce formulaire (2 minutes) : vous recevrez aussitôt un accusé de réception avec le récapitulatif de votre demande.</p>
  <p class="small">Les champs marqués <span class="req">*</span> sont obligatoires.</p>
  <form id="f" novalidate autocomplete="on">
    <div class="hp" aria-hidden="true"><label>Ne pas remplir <input name="site_web" tabindex="-1" autocomplete="off"></label></div>
    <fieldset><legend>1. Vos coordonnées</legend><div class="grid">
      ${field('nom', 'Nom et prénom', { req: 1, html: input('nom', 'text', `maxlength="80" autocomplete="name" value="${esc(pre.nom || '')}"`) })}
      ${field('site', 'Entreprise / Site', { req: 1, hint: 'Nom du site où se trouve le distributeur', html: input('site', 'text', 'maxlength="120" autocomplete="organization" aria-describedby="site-h"') })}
      ${field('email', 'E-mail', { req: 1, hint: pre.email ? `L’accusé de réception sera envoyé à ${pre.email}, l’adresse à laquelle vous avez reçu ce lien. Modifiez ce champ seulement pour que nous vous répondions à une autre adresse.` : 'L’accusé de réception y sera envoyé', html: input('email', 'email', `maxlength="120" autocomplete="email" inputmode="email" value="${esc(pre.email || '')}" aria-describedby="email-h"`) })}
      ${field('tel', 'Téléphone', { hint: 'Facultatif', html: input('tel', 'tel', 'maxlength="30" autocomplete="tel"') })}
    </div></fieldset>
    <fieldset><legend>2. Le distributeur concerné</legend><div class="grid">
      ${field('matricule', 'Matricule du distributeur', { req: 1, hint: 'Numéro à 6 chiffres sur l’étiquette collée sur la façade du distributeur', html: input('matricule', 'text', 'class="comb" inputmode="numeric" maxlength="8" placeholder="000000" aria-describedby="matricule-h"') })}
      ${field('emplacement', 'Emplacement précis', { req: 1, hint: 'Bâtiment, étage, cafétéria…', html: input('emplacement', 'text', 'maxlength="120" aria-describedby="emplacement-h"') })}
    </div></fieldset>
    <fieldset><legend>3. La transaction</legend><div class="grid">
      ${field('tx_date', 'Date de la transaction', { req: 1, html: input('tx_date', 'date', `max="${iso(today)}"`) })}
      ${field('tx_heure', 'Heure approximative', { req: 1, hint: 'À 15 minutes près', html: input('tx_heure', 'time', 'aria-describedby="tx_heure-h"') })}
      ${field('montant', 'Montant débité', { req: 1, hint: 'Tel qu’il apparaît sur votre relevé', html: `<div class="money">${input('montant', 'text', 'inputmode="decimal" maxlength="10" placeholder="0,00" aria-describedby="montant-h"')}</div>` })}
      ${field('produit', 'Produit sélectionné', { html: input('produit', 'text', 'maxlength="80"') })}
      ${radioField('paiement', 'Moyen de paiement utilisé', PAIEMENT, true, 'paiement_autre')}
    </div></fieldset>
    <fieldset data-sec="carte"><legend>4. Identification de la carte bancaire utilisée</legend><div class="grid">
      ${field('last4', '4 derniers chiffres de la carte', { req: 1, hint: 'Uniquement les 4 derniers chiffres : jamais le numéro complet ni le cryptogramme', html: input('last4', 'text', 'class="comb" inputmode="numeric" maxlength="24" placeholder="0000" autocomplete="off" aria-describedby="last4-h"') })}
      <div class="f full"><details class="help" id="help-mobile"><summary>Vous avez payé avec votre téléphone ou votre montre ?</summary>
        <div class="box info"><p>Les 4 derniers chiffres à indiquer <b>ne sont pas</b> ceux de votre carte physique : votre banque a attribué à votre appareil un numéro de carte qui lui est propre, et c’est lui qui est transmis au distributeur.</p>
        <ul><li><b>iPhone (Apple Pay)</b> : Réglages › Cartes et Apple Pay › carte utilisée › onglet « Informations » : 4 derniers chiffres du « Numéro de compte de l’appareil ».</li>
        <li><b>Apple Watch</b> : app Watch de l’iPhone › Wallet et Apple Pay › carte utilisée (numéro différent de celui de l’iPhone).</li>
        <li><b>Android (Google Wallet)</b> : Google Wallet › carte utilisée › « Détails » : 4 derniers chiffres du « numéro de carte virtuelle ».</li></ul>
        <p>Si ces chiffres n’apparaissent pas, indiquez-le dans la description : vous pourrez nous envoyer une capture d’écran en réponse à l’accusé de réception.</p></div></details></div>
    </div></fieldset>
    <fieldset><legend>5. Description de l’incident</legend><div class="grid">
      ${radioField('incident', 'Nature de l’incident', INCIDENT, true)}
      ${field('description', 'Décrivez brièvement ce qui s’est passé', { full: 1, html: `<textarea id="description" name="description" maxlength="2000"></textarea>` })}
    </div></fieldset>
    <fieldset><legend>6. Modalités de remboursement</legend><div class="grid">
      ${radioField('rb_mode', 'Mode de remboursement souhaité', RB_MODE, true)}
    </div></fieldset>
    <fieldset><legend>7. Attestation</legend>
      <div class="f full" data-f="attestation"><label class="check"><input type="checkbox" id="attestation" name="attestation"><span>Je certifie l’exactitude des informations ci-dessus et n’avoir engagé aucune contestation bancaire pour cette transaction. <span class="req" aria-hidden="true">*</span></span></label><div class="err" id="attestation-e"></div></div>
    </fieldset>
    <div class="box gold small" style="font-size:13.5px">
      <p><b>Délai de réclamation :</b> ${esc(c.delaiReclamation)} jours suivant l’incident. <b>Délai de traitement :</b> réponse sous ${esc(c.delaiTraitement)} jours ouvrés.</p>
      <p><b>Protection des données :</b> les informations recueillies sont traitées par ${esc(c.societe)}, responsable du traitement, uniquement pour traiter votre demande, et conservées ${esc(c.conservation)} mois. Vous disposez d’un droit d’accès, de rectification, d’effacement et d’opposition auprès de ${esc(c.email)}, ainsi que du droit d’introduire une réclamation auprès de la CNIL (cnil.fr).</p>
    </div>
    <div class="box danger" id="formErr" role="alert" hidden></div>
    <div class="actions"><button class="btn" type="submit" id="send">Envoyer ma demande</button><span class="small" id="sending" hidden>Envoi en cours, merci de patienter…</span></div>
  </form>`;
}

/* --- règles (mêmes que le serveur) --- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function values() {
  const f = $('#f'), fd = new FormData(f), v = {};
  for (const k of ['nom', 'site', 'email', 'tel', 'matricule', 'emplacement', 'tx_date', 'tx_heure', 'montant', 'produit', 'paiement', 'paiement_autre', 'last4', 'incident', 'description', 'rb_mode']) v[k] = String(fd.get(k) || '').trim();
  if (!['cb', 'mobile'].includes(v.paiement)) v.last4 = '';     // section masquée : rien envoyé
  if (v.paiement !== 'autre') v.paiement_autre = '';
  v.attestation = $('#attestation').checked;
  return { v, hp: String(fd.get('site_web') || '') };
}
function check(v) {
  const e = {}; const today = new Date(); today.setHours(23, 59, 59, 999);
  for (const k of ['nom', 'site', 'email', 'matricule', 'emplacement', 'tx_date', 'tx_heure', 'montant', 'paiement', 'incident', 'rb_mode']) if (!v[k]) e[k] = 'Champ obligatoire.';
  if (v.email && (!v.email.includes('@') || !EMAIL_RE.test(v.email))) e.email = 'Adresse e-mail invalide : elle doit contenir @ et un domaine (ex. prenom.nom@entreprise.fr).';
  const mat = v.matricule.replace(/\D/g, ''); if (v.matricule && mat.length !== 6) e.matricule = 'Le matricule comporte 6 chiffres.';
  if (v.tx_date) { const d = new Date(v.tx_date + 'T12:00:00'); if (isNaN(d)) e.tx_date = 'Date invalide.'; else if (d > today) e.tx_date = 'La date ne peut pas être dans le futur.'; }
  if (v.montant) { const n = v.montant.replace(/[\s€]/g, '').replace(',', '.'); if (!/^\d{1,4}(\.\d{1,2})?$/.test(n) || +n <= 0) e.montant = 'Montant invalide (ex. 2,50).'; }
  if (v.paiement === 'autre' && !v.paiement_autre) e.paiement = 'Précisez le moyen de paiement.';
  if (['cb', 'mobile'].includes(v.paiement)) { const d = v.last4.replace(/\D/g, ''); if (!d) e.last4 = 'Champ obligatoire pour un paiement par carte, téléphone ou montre.'; else if (d.length !== 4 && d.length < 12) e.last4 = 'Indiquez exactement les 4 derniers chiffres.'; }
  if (v.incident === 'autre' && !v.description) e.description = 'Décrivez brièvement ce qui s’est passé.';
  if (!v.attestation) e.attestation = 'Cette attestation est nécessaire pour traiter votre demande.';
  return e;
}
function showErrors(e) {
  document.querySelectorAll('.f[data-f]').forEach(w => {
    const k = w.dataset.f, m = e[k] || '';
    w.classList.toggle('bad', !!m);
    const el = $('#' + k + '-e'); if (el) el.textContent = m;
    const inp = w.querySelector('input:not([type=radio]),textarea'); if (inp) inp.setAttribute('aria-invalid', m ? 'true' : 'false');
  });
  const first = Object.keys(e)[0];
  if (first) { const w = document.querySelector(`.f[data-f="${first}"]`); if (w) { w.scrollIntoView({ behavior: 'smooth', block: 'center' }); const i = w.querySelector('input,textarea'); if (i) setTimeout(() => i.focus({ preventScroll: true }), 250); } }
}
function syncCard() {
  const p = (document.querySelector('input[name=paiement]:checked') || {}).value || '';
  document.querySelector('[data-sec=carte]').hidden = !!p && !['cb', 'mobile'].includes(p);
  if (p === 'mobile') $('#help-mobile').open = true;
}

async function api(a, body, q = '') {
  try {
    const r = await fetch('api.php?a=' + a + q, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store', credentials: 'omit' } : { cache: 'no-store', credentials: 'omit' });
    let j = null; try { j = await r.json(); } catch (e) { }
    return { status: r.status, ok: r.ok, body: j };
  } catch (e) { return { status: 0, ok: false, body: null }; }
}
function fatal(msg) {
  $('#main').innerHTML = `<div class="box danger" role="alert"><p>${esc(msg)}</p></div>`;
}
function footer(c) {
  $('#foot').textContent = c ? `${c.societe} – ${c.adresse} – ${c.telephone} – ${c.email}` : '';
}

async function start() {
  $('#logo').src = LOGO_D8;
  if (!TOKEN && !GENERIC) { fatal('Lien incomplet : ouvrez le lien reçu par e-mail en entier (il se termine par une longue suite de lettres et de chiffres).'); return; }
  const r = await api('form-info', null, TOKEN ? '&t=' + TOKEN : '&f=' + encodeURIComponent(GENERIC));
  if (!r.ok || !r.body) { fatal(r.body && r.body.error ? r.body.error : 'Le service est momentanément indisponible. Réessayez dans quelques minutes.'); return; }
  INFO = r.body;
  const c = INFO.company || {};
  if (c.logo) $('#logo').src = c.logo;
  $('#title').textContent = INFO.title || 'Demande de remboursement';
  footer(c);
  $('#main').innerHTML = formHTML(c, INFO.prefill || {});
  const f = $('#f');
  f.addEventListener('change', e => { if (e.target.name === 'paiement') syncCard(); });
  f.addEventListener('input', e => {
    if (e.target.id === 'paiement_autre' && e.target.value) { const r2 = document.querySelector('input[name=paiement][value=autre]'); if (r2) { r2.checked = true; syncCard(); } }
    const w = e.target.closest('.f.bad'); if (w) { w.classList.remove('bad'); const el = $('#' + w.dataset.f + '-e'); if (el) el.textContent = ''; }
  });
  $('#last4').addEventListener('input', e => { const d = e.target.value.replace(/\D/g, ''); if (d.length >= 12) { e.target.value = d.slice(-4); showErrors({ last4: 'Numéro de carte complet détecté : seuls les 4 derniers chiffres ont été gardés. Ne communiquez jamais votre numéro complet.' }); } });
  syncCard();
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const { v, hp } = values();
    const errs = check(v);
    $('#formErr').hidden = true;
    if (Object.keys(errs).length) { showErrors(errs); $('#formErr').hidden = false; $('#formErr').textContent = 'Merci de corriger les champs signalés en rouge.'; return; }
    showErrors({});
    $('#send').disabled = true; $('#sending').hidden = false;
    const body = { nonce: INFO.nonce, v, site_web: hp };
    if (TOKEN) body.t = TOKEN; else body.f = GENERIC;
    let res = await api('form-submit', body);
    if (!(res.ok && res.body && res.body.ok) && res.body && res.body.reload && !res.body.fields) {
      // jeton anti-robots expiré (page ouverte depuis longtemps) ou trop récent : nouveau jeton puis nouvel envoi, la saisie est gardée
      const r2 = await api('form-info', null, TOKEN ? '&t=' + TOKEN : '&f=' + encodeURIComponent(GENERIC));
      if (r2.ok && r2.body && r2.body.nonce) { INFO.nonce = body.nonce = r2.body.nonce; await new Promise(ok => setTimeout(ok, 3300)); res = await api('form-submit', body); }
    }
    $('#send').disabled = false; $('#sending').hidden = true;
    if (res.ok && res.body && res.body.ok) return done(res.body, v);
    if (res.body && res.body.fields) { showErrors(res.body.fields); }
    $('#formErr').hidden = false;
    $('#formErr').textContent = (res.body && res.body.error) || 'Envoi impossible pour le moment (connexion interrompue ?). Vos réponses sont conservées sur cette page : réessayez dans un instant.';
    if (res.body && res.body.reload) $('#formErr').innerHTML += ' <button type="button" class="btn ghost" onclick="location.reload()">Recharger</button>';
  });
}
function done(b, v) {
  const ok = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>';
  $('#main').innerHTML = `<div class="done">${ok}<h2 style="margin:8px 0 4px">Demande envoyée</h2>
    <p>Votre demande de remboursement est enregistrée sous la référence :</p><div class="ref">${esc(b.ref)}</div>
    ${b.ar ? `<div class="box ok" style="text-align:left"><p>Un accusé de réception avec le récapitulatif de votre demande vient d’être envoyé à <b>${esc(b.email)}</b>. Pensez à vérifier le dossier des courriers indésirables.</p></div>`
           : `<div class="box info" style="text-align:left"><p>Votre demande nous est bien parvenue. L’accusé de réception n’a pas pu partir immédiatement : notre service vous répondra directement. Notez votre référence.</p></div>`}
    ${b.pan ? '<div class="box danger" style="text-align:left"><p>Un numéro de carte complet avait été saisi : seuls les 4 derniers chiffres ont été conservés. Ne communiquez jamais votre numéro complet ni le cryptogramme.</p></div>' : ''}
    ${v.rb_mode === 'virement' ? '<p class="small">Remboursement par virement : envoyez votre RIB en répondant à l’accusé de réception.</p>' : ''}
    <p class="small">Nous vous répondrons sous ${esc((INFO.company || {}).delaiTraitement || 5)} jours ouvrés. Vous pouvez fermer cette page.</p>
    <div class="actions" style="justify-content:center"><button class="btn ghost" type="button" onclick="window.print()">Imprimer cette confirmation</button></div></div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
start();
</script>
</body>
</html>
