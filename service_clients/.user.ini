; D8 · Service clients — réglages PHP propres à ce dossier (lus par PHP en FastCGI)
; restauration d'une sauvegarde complète
post_max_size = 64M
upload_max_filesize = 64M
memory_limit = 256M
max_execution_time = 120
; aucun message d'erreur PHP dans les réponses (ils restent dans le journal de PHP)
display_errors = Off
log_errors = On
date.timezone = Europe/Paris
