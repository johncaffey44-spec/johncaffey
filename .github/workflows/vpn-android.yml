# Compile l'application Android « VPN Maison » (.apk) à chaque modification.
# Signature : si les secrets VPN_KEYSTORE_BASE64 / VPN_KEYSTORE_PASSWORD / VPN_KEY_ALIAS /
# VPN_KEY_PASSWORD sont définis (Settings > Secrets and variables > Actions), l'APK est signé
# avec votre clé ; sinon il est signé avec une clé de test (installable, mais les mises à
# jour demanderont de désinstaller l'ancienne version).
name: VPN Maison – Android (.apk)

on:
  workflow_dispatch:
  push:
    paths:
      - "vpn-freebox/android/**"
      - ".github/workflows/vpn-android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vpn-freebox/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (optionnelle)
        env:
          KEYSTORE_B64: ${{ secrets.VPN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VPN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Tests + compilation
        env:
          VPN_KEYSTORE_PASSWORD: ${{ secrets.VPN_KEYSTORE_PASSWORD }}
          VPN_KEY_ALIAS: ${{ secrets.VPN_KEY_ALIAS }}
          VPN_KEY_PASSWORD: ${{ secrets.VPN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: VPNMaison-apk
          path: vpn-freebox/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
