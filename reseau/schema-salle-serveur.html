<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Schéma salle serveur D8</title>
<style id="d8-css">
/* Mise en page : en-tête, onglets, puis l’éditeur en deux colonnes (plan + inspecteur) qui passe en une colonne sous 980 px */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#152120; --muted:#566664; --line:#D2DBD9; --line-strong:#A9B8B6;
  --accent:#0A7573; --accent-ink:#FFFFFF; --accent-soft:#D5ECEA;
  --ok:#2C8650; --ok-soft:#DDF1E4; --warn:#A86A12; --warn-soft:#FBEBD2; --crit:#BF2F2F; --crit-soft:#F9E0E0;
  --grid:#DCE4E2; --casing:#FFFFFF; --casing-op:1; --zone:#FBFCFC; --zone-head:#E2EAE8; --zone-line:#C4D0CE;
  --cat-net:#0A7573; --cat-wan:#BF2F2F; --cat-srv:#6A4EC6; --cat-end:#2B69D6; --cat-pwr:#B8620F; --cat-env:#178AA0; --cat-tel:#8A572A;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1413; --surface:#162020; --surface-2:#1B2625; --ink:#E1EAE8; --muted:#92A3A1; --line:#283533; --line-strong:#40504E;
  --accent:#3EC2BE; --accent-ink:#04201F; --accent-soft:#14373A;
  --ok:#5CC488; --ok-soft:#173326; --warn:#E5A94D; --warn-soft:#3A2D15; --crit:#F27373; --crit-soft:#3E1E1E;
  --grid:#18211F; --casing:#B9C7C4; --casing-op:.45; --zone:#121A19; --zone-head:#1C2726; --zone-line:#2E3C3A;
  --cat-net:#3EC2BE; --cat-wan:#F27373; --cat-srv:#A994F2; --cat-end:#6FA0F5; --cat-pwr:#F0A04F; --cat-env:#4CC3D8; --cat-tel:#D2955C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1413; --surface:#162020; --surface-2:#1B2625; --ink:#E1EAE8; --muted:#92A3A1; --line:#283533; --line-strong:#40504E;
  --accent:#3EC2BE; --accent-ink:#04201F; --accent-soft:#14373A;
  --ok:#5CC488; --ok-soft:#173326; --warn:#E5A94D; --warn-soft:#3A2D15; --crit:#F27373; --crit-soft:#3E1E1E;
  --grid:#18211F; --casing:#B9C7C4; --casing-op:.45; --zone:#121A19; --zone-head:#1C2726; --zone-line:#2E3C3A;
  --cat-net:#3EC2BE; --cat-wan:#F27373; --cat-srv:#A994F2; --cat-end:#6FA0F5; --cat-pwr:#F0A04F; --cat-env:#4CC3D8; --cat-tel:#D2955C;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
#root{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:6px 14px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.top h1{font-size:clamp(28px,4vw,40px);letter-spacing:.01em}
.top h1 small{font-family:var(--font-mono);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:10px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.dirty{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:var(--warn-soft)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-soft)}
.chip.ro{color:var(--crit);background:var(--crit-soft)}
.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px;display:grid;gap:2px;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu-list button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px}
.menu-list button:hover{background:var(--surface-2)}
.menu-list small{display:block;color:var(--muted);font-size:12px}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:14px}
.banner b{font-family:var(--font-display);font-size:16px;font-weight:600}
.banner.draft{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.lg-line{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.lg-line svg{flex:none}

.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px 10px;font-family:var(--font-display);font-size:17px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .count{font-family:var(--font-mono);font-size:11px;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.panel{padding-top:16px}

/* éditeur */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:980px){.editor{grid-template-columns:minmax(0,1fr)}}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;border-bottom:0}
.tgroup{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.tgroup button{border:0;background:var(--surface);padding:6px 10px;min-width:34px;line-height:1.2}
.tgroup button+button{border-left:1px solid var(--line)}
.tgroup button.on{background:var(--ink);color:var(--surface)}
.tgroup button:hover:not(.on){background:var(--surface-2)}
.tgroup button[disabled]{opacity:.4;cursor:default}
.tsel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tsel select{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:5px 6px;color:var(--ink);max-width:210px}
.tchk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px;background:var(--c);vertical-align:middle}
.hint{font-size:13px;color:var(--muted);padding:6px 10px;background:var(--surface-2);border:1px solid var(--line);border-top:0;border-bottom:0}
.hint.active{background:var(--accent-soft);color:var(--ink)}
.canvas-wrap{position:relative;height:min(72vh,720px);min-height:380px;border:1px solid var(--line);background:var(--surface-2);overflow:hidden;touch-action:none}
@media (max-width:600px){.canvas-wrap{height:56vh;min-height:300px}}
#board{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;cursor:grab}
#board.panning{cursor:grabbing}
#board.linking{cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r)}
.lchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px}
.lchip .sw{width:20px;height:5px}
.lchip .n{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.lchip.off{opacity:.42;text-decoration:line-through}
.zoomtag{position:absolute;right:10px;bottom:8px;font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 6px;pointer-events:none}

/* SVG */
.gridline{stroke:var(--grid);stroke-width:1}
.gridbg{fill:url(#gridpat)}
.zbox{fill:var(--zone);stroke:var(--zone-line);stroke-width:1.2}
.zhead{fill:var(--zone-head);cursor:move}
.zlabel{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted);pointer-events:none}
.zresize{fill:var(--zone-line);cursor:nwse-resize}
.zone.sel .zbox{stroke:var(--accent);stroke-width:2}
.lhit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.lcase{fill:none;stroke:var(--casing);stroke-opacity:var(--casing-op);stroke-width:7;stroke-linecap:round}
.lcore{fill:none;stroke-width:3.2;stroke-linecap:round}
.link.sel .lcase{stroke:var(--accent);stroke-opacity:.55;stroke-width:11}
.link.sel .lcore{stroke-width:4.2}
.link:hover .lcase{stroke:var(--accent);stroke-opacity:.35}
.plabel{font-family:var(--font-mono);font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--surface-2);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.mpill{fill:var(--surface);stroke:var(--line-strong)}
.mtext{font-family:var(--font-mono);font-size:10px;fill:var(--ink)}
.vmark{fill:var(--warn);}
.vmark-t{font-family:var(--font-display);font-size:11px;font-weight:700;fill:var(--surface)}
.node{cursor:pointer}
.nbox{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.4}
.node.st-suppose .nbox{stroke-dasharray:6 4}
.node.st-verifier .nbox{stroke:var(--warn);stroke-dasharray:2 3;stroke-width:1.8}
.node.sel .nbox{stroke:var(--accent);stroke-width:2.6;stroke-dasharray:none}
.node.src .nbox{stroke:var(--accent);stroke-width:3;stroke-dasharray:none}
.node.linkable:hover .nbox{stroke:var(--accent);stroke-width:2.4}
.ntile{fill-opacity:.15}
.nicon{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nlabel{font-family:var(--font-display);font-size:15px;font-weight:600;fill:var(--ink)}
.nsub{font-family:var(--font-body);font-size:11.5px;fill:var(--muted)}
.nalert{fill:var(--crit)}
.nalert-t{font-family:var(--font-display);font-size:12px;font-weight:700;fill:#fff;pointer-events:none}
.cat-net{fill:var(--cat-net);stroke:var(--cat-net)} .cat-wan{fill:var(--cat-wan);stroke:var(--cat-wan)} .cat-srv{fill:var(--cat-srv);stroke:var(--cat-srv)}
.cat-end{fill:var(--cat-end);stroke:var(--cat-end)} .cat-pwr{fill:var(--cat-pwr);stroke:var(--cat-pwr)} .cat-env{fill:var(--cat-env);stroke:var(--cat-env)} .cat-tel{fill:var(--cat-tel);stroke:var(--cat-tel)}
.ntile.cat-net,.ntile.cat-wan,.ntile.cat-srv,.ntile.cat-end,.ntile.cat-pwr,.ntile.cat-env,.ntile.cat-tel{stroke:none}
.nicon.cat-net,.nicon.cat-wan,.nicon.cat-srv,.nicon.cat-end,.nicon.cat-pwr,.nicon.cat-env,.nicon.cat-tel{fill:none}

/* inspecteur */
.insp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
@media (min-width:981px){.insp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto}}
.insp-head{display:grid;gap:2px}
.kind{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.insp h3{font-size:22px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:7px 9px;color:var(--ink);font-size:14px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{border:0;padding:0;margin:0;display:grid;gap:4px}
.seg legend{font-size:13px;color:var(--muted);padding:0;margin-bottom:4px}
.seg-row{display:flex;flex-wrap:wrap;gap:4px}
.seg-row label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer}
.seg-row input{accent-color:var(--accent);margin:0}
.seg-row label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatches button{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);background:var(--c);padding:0}
.swatches button.on{box-shadow:0 0 0 2px var(--accent)}
.swatches input[type=color]{width:34px;height:28px;padding:0 2px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.sub-h{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.conn{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.conn button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:5px;font-size:13.5px}
.conn button:hover{background:var(--surface-2)}
.conn small{color:var(--muted);margin-left:auto;font-family:var(--font-mono);font-size:10.5px;white-space:nowrap}
.conn .sw{flex:none}
.row-actions{display:flex;flex-wrap:wrap;gap:6px}
.addlink{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.addlink .btn{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface-2)}
.stat b{display:block;font-family:var(--font-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.flag{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:6px;border-radius:6px;font-size:13.5px}
.flag:hover{background:var(--surface-2)}
.flag i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--warn)}
.flag.crit i{background:var(--crit)}
.flag small{display:block;color:var(--muted);font-size:12px}
.help{font-size:13px;color:var(--muted);display:grid;gap:4px;margin:0;padding-left:18px}

/* onglets de lecture */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:22px;margin-bottom:8px}
.card p{margin:0 0 8px;max-width:68ch}
.quote{font-size:18px;line-height:1.45;border-left:3px solid var(--accent);padding-left:14px;margin:6px 0 4px;max-width:60ch}
.quote+small{color:var(--muted);font-family:var(--font-mono);font-size:11.5px}
.timeline{list-style:none;margin:0;padding:0;display:grid}
.tl{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl time{font-family:var(--font-mono);font-size:12.5px;color:var(--accent);padding-top:3px;font-variant-numeric:tabular-nums}
.tl h3{font-size:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tl p{margin:4px 0 0;color:var(--ink);max-width:70ch}
.tl .go{margin-top:6px;border:0;background:none;color:var(--accent);padding:0;font-size:13px;font-weight:600}
.conf{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid}
.conf.sur{color:var(--ok);border-color:currentColor;background:var(--ok-soft)}
.conf.probable{color:var(--accent);border-color:currentColor;background:var(--accent-soft)}
.conf.verifier{color:var(--warn);border-color:currentColor;background:var(--warn-soft)}
.list{margin:0;padding-left:18px;display:grid;gap:8px}
.list li{max-width:68ch}
.progress{height:6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:var(--p)}
.chk-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.chk-top .progress{width:min(360px,100%)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:16px;align-items:start}
.group h2{font-size:20px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.group h2 small{font-family:var(--font-mono);font-size:12px;font-weight:400;color:var(--muted)}
.group .progress{margin:6px 0 4px}
.item{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.item label{cursor:pointer}
.item .t{font-weight:600}
.item .why{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.prio{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.prio.crit{background:var(--crit-soft);color:var(--crit)}
.prio.imp{background:var(--warn-soft);color:var(--warn)}
.prio.bon{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ref{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);margin-left:6px;white-space:nowrap}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-top:0}
td .sw{width:34px;height:7px}
.notes-area{width:100%;min-height:140px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:10px;color:var(--ink);font:inherit;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.toast{animation:toastIn .18s ease-out}@keyframes toastIn{from{transform:translate(-50%,8px);opacity:0}}}

      { id: 'c2', p: 'crit', ref: '1:02', t: 'Contrôler les voyants rouges/orange des serveurs rack', why: 'Souvent un disque en défaut. Vérifie l’état RAID dans l’iLO, l’iDRAC ou l’outil du contrôleur avant qu’un second disque lâche.' },
      { id: 'c3', p: 'crit', ref: '1:28', t: 'Identifier l’équipement au voyant orange (onduleur ?)', why: 'Sur un onduleur, l’orange signale en général un fonctionnement sur batterie, une batterie à changer ou une surcharge.' },
      { id: 'c4', p: 'crit', ref: '0:00', t: 'Surélever le serveur IA et le brancher sur onduleur', why: 'Posé sur la moquette, il aspire poussière et fibres et peut être débranché d’un coup de pied. Branché au mur, une micro-coupure peut corrompre ses données.' },
      { id: 'c5', p: 'imp', ref: '0:56', t: 'Mettre les serveurs sur rails et dégager les câbles posés dessus', why: 'Un serveur empilé chauffe plus et ne peut pas être sorti pour maintenance sans tout débrancher.' },
      { id: 'c6', p: 'imp', ref: '1:16', t: 'Identifier et fixer le câble jaune qui pend du plafond', why: 'Si c’est une fibre, une traction ou un pli trop serré la casse.' },
      { id: 'c7', p: 'imp', ref: '1:22', t: 'Savoir pourquoi il y a une bâche bleue', why: 'Si c’est contre une fuite d’eau, il faut un détecteur de fuite et une vraie réparation.' }
    ] },
    { id: 'g2', title: 'Électricité et climatisation', items: [
      { id: 'c8', p: 'crit', t: 'Onduleur pour tous les équipements actifs, avec arrêt automatique des serveurs', why: 'Mesure l’autonomie réelle, installe l’agent d’arrêt propre (NUT, PowerChute…) et teste les batteries une fois par an.' },
      { id: 'c9', p: 'crit', t: 'Alarme de température et d’humidité', why: 'Une seule clim = point unique de défaillance. Une sonde réseau qui envoie un mail ou un SMS évite de découvrir la panne par l’arrêt des serveurs. Cible : 18–27 °C en entrée d’équipement (recommandation ASHRAE).' },
      { id: 'c10', p: 'imp', t: 'Circuit électrique dédié et repéré au tableau pour les baies', why: 'Note le numéro du disjoncteur sur chaque baie. Si possible, double alimentation des serveurs sur deux sources.' },
      { id: 'c11', p: 'imp', t: 'Mise à la terre des baies', why: 'Liaison équipotentielle des châssis : sécurité des personnes et moins de perturbations.' },
      { id: 'c12', p: 'imp', t: 'Protéger la salle du soleil de la fenêtre', why: 'Film solaire ou occultation : l’apport de chaleur peut dépasser la capacité de la clim l’été.' },
      { id: 'c13', p: 'imp', t: 'Vérifier l’évacuation des condensats de la clim', why: 'Un bac qui déborde au-dessus ou à côté d’une baie, c’est une panne électrique.' },
      { id: 'c14', p: 'bon', t: 'Obturateurs dans les U vides des baies', why: 'Ils empêchent l’air chaud de revenir à l’avant des équipements.' }
    ] },
    { id: 'g3', title: 'Incendie, poussière, accès', items: [
      { id: 'c15', p: 'crit', t: 'Extincteur CO₂ à l’entrée de la salle et détecteur de fumée', why: 'Jamais d’eau ni de poudre sur du matériel informatique sous tension.' },
      { id: 'c16', p: 'imp', t: 'Traiter la moquette', why: 'Électricité statique et poussière. À terme, sol antistatique ; en attendant, dépoussiérage régulier des façades et filtres.' },
      { id: 'c17', p: 'imp', t: 'Porte fermée à clé, baies fermées, liste des personnes autorisées', why: 'Un accès physique à une baie permet de tout débrancher ou de brancher n’importe quoi.' },
      { id: 'c18', p: 'bon', t: 'Détecteur de fuite d’eau sous les baies', why: 'Utile si la salle a déjà connu une fuite ou se trouve sous des canalisations.' }
    ] },
    { id: 'g4', title: 'Câblage et brassage', items: [
      { id: 'c19', p: 'crit', t: 'Faire le relevé des ports avant de modifier quoi que ce soit', why: 'Pour chaque cordon : port du switch ↔ port du panneau ↔ prise murale ↔ bureau ↔ VLAN. Outils : LLDP/CDP, table MAC des switchs, testeur et générateur de tonalité.' },
      { id: 'c20', p: 'imp', t: 'Étiqueter les deux extrémités de chaque cordon', why: 'Un même identifiant aux deux bouts (norme ANSI/TIA-606). Photo de la baie avant et après chaque intervention.' },
      { id: 'c21', p: 'imp', t: 'Passe-câbles 1U entre panneaux et switchs, cordons courts', why: 'Des cordons de 0,3 à 1 m au lieu de boucles de 2–3 m : la baie respire et chaque câble se suit à l’œil.' },
      { id: 'c22', p: 'imp', t: 'Retirer les cordons morts', why: 'Un cordon branché d’un seul côté, ou entre deux ports inutilisés, ne sert qu’à masquer les autres.' },
      { id: 'c23', p: 'imp', t: 'Adopter un code couleur et l’afficher sur la baie', why: 'Voir l’onglet Code couleur. Il ne vaut que s’il est écrit et respecté par tous les intervenants.' },
      { id: 'c24', p: 'imp', t: 'Séparer courants forts et courants faibles', why: 'Cheminements distincts pour l’alimentation 230 V et les câbles réseau.' },
      { id: 'c25', p: 'imp', t: 'Fibre : rayon de courbure et capuchons', why: 'Pas de pli serré, capuchon sur tout connecteur libre, ne jamais regarder un connecteur en face (étiquette laser vue à 0:46).' },
      { id: 'c26', p: 'bon', t: 'Ne plus utiliser de cordons RJ45 jaunes', why: 'Le jaune est la couleur normalisée de la fibre monomode : des RJ45 jaunes à côté prêtent à confusion.' }
    ] },
    { id: 'g5', title: 'Réseau logique', items: [
      { id: 'c27', p: 'crit', t: 'Faire le schéma logique : plan d’adressage, VLAN, passerelles, DHCP, DNS', why: 'La vidéo ne montre que le physique. Sans le logique, ce schéma ne suffit pas pour dépanner.' },
      { id: 'c28', p: 'crit', t: 'Sauvegarder les configurations des switchs, du routeur et du pare-feu', why: 'Une copie après chaque modification, stockée hors des équipements.' },
      { id: 'c29', p: 'imp', t: 'Identifier le propriétaire du routeur modulaire et l’existence d’un pare-feu', why: 'Un routeur d’opérateur ne se reconfigure pas soi-même. Sans pare-feu à toi, tu ne maîtrises pas ce qui entre.' },
      { id: 'c30', p: 'imp', t: 'Segmenter en VLAN', why: 'Serveurs, utilisateurs, téléphonie, Wi-Fi invités, caméras et objets connectés, administration.' },
      { id: 'c31', p: 'imp', t: 'Protection contre les boucles (RSTP, BPDU guard, loop protect)', why: 'Avec autant de cordons, un seul mauvais branchement peut saturer tout le réseau.' },
      { id: 'c32', p: 'imp', t: 'Désactiver les ports inutilisés ou activer 802.1X / port-security', why: 'Une prise murale active dans une salle de réunion est une porte d’entrée.' },
      { id: 'c33', p: 'imp', t: 'Supervision, journaux et heure', why: 'SNMP avec Zabbix, LibreNMS ou PRTG, syslog centralisé, NTP sur tous les équipements.' },
      { id: 'c34', p: 'bon', t: 'Mises à jour des firmwares', why: 'Switchs, routeur, pare-feu, iLO/iDRAC, onduleur.' },
      { id: 'c35', p: 'bon', t: 'Doubler les liens entre cœur et accès (LACP)', why: 'Un cordon arraché ne coupe plus tout un switch.' }
    ] },
    { id: 'g6', title: 'Serveur IA et planning', items: [
      { id: 'c36', p: 'crit', t: 'Sauvegarder le dossier data du planning hors de la machine', why: 'data/backups est sur le même disque : si le disque meurt, tout part. Règle 3-2-1 : 3 copies, 2 supports, 1 hors site ou hors ligne.' },
      { id: 'c37', p: 'crit', t: 'Clarifier « en ligne » et « réseau privé »', why: 'Le planning ne doit pas être exposé sur Internet sans VPN ou reverse proxy HTTPS avec authentification. Vérifie qu’aucune redirection de port ne pointe vers ce PC.' },
      { id: 'c38', p: 'imp', t: 'Passer le planning en HTTPS', why: 'En HTTP, les mots de passe circulent en clair sur le réseau interne (c’est écrit dans MISE-A-JOUR.md).' },
      { id: 'c39', p: 'imp', t: 'Réduire $ALLOWED_NETS dans api.php à tes vrais VLAN', why: 'Aujourd’hui il autorise toutes les plages privées (10/8, 172.16/12, 192.168/16), donc aussi le Wi-Fi invités s’il est sur une de ces plages.' },
      { id: 'c40', p: 'imp', t: 'IP fixe ou réservation DHCP, et un nom DNS', why: 'Par exemple planning.d8.local : les écrans d’atelier ne perdent plus l’adresse après un redémarrage.' },
      { id: 'c41', p: 'imp', t: 'Redémarrage automatique après coupure', why: 'Réglage BIOS « AC power recovery » et services web démarrés au boot, sinon le planning reste éteint après une coupure de nuit.' },
      { id: 'c42', p: 'imp', t: 'Compter la consommation et la chaleur de la carte graphique', why: 'Si c’est un serveur IA avec GPU, il peut tirer 300 à 600 W : à prendre en compte pour l’onduleur et la clim.' },
      { id: 'c43', p: 'bon', t: 'Mises à jour de l’OS et de PHP, antivirus, compte de service à droits minimaux', why: 'Le compte du serveur web ne doit pouvoir écrire que dans le dossier data.' }
    ] },
    { id: 'g7', title: 'Opérateurs et téléphonie', items: [
      { id: 'c44', p: 'crit', t: 'Recenser ce qui passe encore par le cuivre du répartiteur', why: 'Le réseau cuivre ferme progressivement en France d’ici 2030. Alarme, ascenseur, fax, TPE ou GTB peuvent s’arrêter sans prévenir : prévoir leur migration (IP ou 4G).' },

      { id: 'c48', p: 'imp', t: 'Inventaire : modèle, numéro de série, garantie, fin de support', why: 'Indispensable pour un appel au support et pour anticiper les remplacements.' },

      { id: 'c50', p: 'imp', t: 'Procédure d’arrêt et de redémarrage dans l’ordre', why: 'Réseau, puis stockage, puis serveurs, puis applications. Et l’inverse à l’arrêt.' },

  /* ---------- état ---------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const snap = (v) => Math.round(v / SNAP) * SNAP;
  const uid = (p) => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 5);
  const store = {
    get(k, s) { try { const v = (s ? sessionStorage : localStorage).getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(k, v, s) { try { (s ? sessionStorage : localStorage).setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
    del(k, s) { try { (s ? sessionStorage : localStorage).removeItem(k); } catch (e) { /* stockage indisponible */ } }
  };

  function validState(s) {
    return s && Array.isArray(s.nodes) && Array.isArray(s.links) && Array.isArray(s.zones);
  }
  function normalize(s) {
    s.checks = s.checks && typeof s.checks === 'object' ? s.checks : {};
    s.notes = typeof s.notes === 'string' ? s.notes : '';
    s.nodes.forEach((n) => { ['label', 'sub', 'ip', 'notes', 'alert', 'video'].forEach((k) => { if (typeof n[k] !== 'string') n[k] = ''; }); if (!TYPES[n.type]) n.type = 'other'; if (!STATUS[n.status]) n.status = 'suppose'; n.x = +n.x || 0; n.y = +n.y || 0; });
    s.links = s.links.filter((l) => l && l.from !== l.to);
    s.links.forEach((l) => { ['color', 'fromPort', 'toPort', 'label', 'notes'].forEach((k) => { if (typeof l[k] !== 'string') l[k] = ''; }); if (!CABLES[l.cable]) l.cable = 'other'; if (!STATUS[l.status]) l.status = 'suppose'; });
    return s;
  }
  function loadState() {
    try {
      const el = document.getElementById('d8-state');
      const txt = el && el.textContent.trim();
      if (txt && txt !== 'null') { const s = JSON.parse(txt); if (validState(s)) return normalize(s); }
    } catch (e) { /* état illisible : on repart de la reconstitution */ }
    return defaultState();
  }

  let state = loadState();
  let savedJSON = JSON.stringify(state);
  let undoStack = [], redoStack = [];
  const prefs = Object.assign({ tab: 'schema', hidden: [], ports: true, hideDone: false, cable: 'user' }, store.get('d8-schema-ui') || {});
  const stash = store.get('d8-schema-stash', true); store.del('d8-schema-stash', true);
  if (stash && stash.tab) prefs.tab = stash.tab;
  const ui = { sel: stash && stash.sel ? stash.sel : null, mode: 'select', linkFrom: null, view: { x: 0, y: 0, k: 1 }, drag: null, pendingSnap: null };
  const cap = { inViewer: !!(window.claude && window.claude.use), artifact: null, resolved: false, readOnly: false, saving: false };
  let toastTimer = null;

  const byId = (id) => state.nodes.find((n) => n.id === id);
  const linkById = (id) => state.links.find((l) => l.id === id);
  const zoneById = (id) => state.zones.find((z) => z.id === id);
  const cableColor = (l) => l.color || (CABLES[l.cable] || CABLES.other).color;
  const isDirty = () => JSON.stringify(state) !== savedJSON;
  const savePrefs = () => store.set('d8-schema-ui', prefs);

  function snapshot() { return JSON.stringify(state); }
  function pushUndo(snap) { undoStack.push(snap); if (undoStack.length > 80) undoStack.shift(); redoStack = []; }
  function commit(snap) { if (snap !== snapshot()) { pushUndo(snap); changed(); } }
  function changed() {
    store.set('d8-schema-draft', { at: Date.now(), state });
    renderStatus(); renderUndo();
  }
  function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); state = JSON.parse(undoStack.pop()); fixSel(); renderAll(); changed(); }
  function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); state = JSON.parse(redoStack.pop()); fixSel(); renderAll(); changed(); }
  function fixSel() {
    if (!ui.sel) return;
    const ok = ui.sel.kind === 'node' ? byId(ui.sel.id) : ui.sel.kind === 'link' ? linkById(ui.sel.id) : zoneById(ui.sel.id);
    if (!ok) ui.sel = null;
  }

    return `

  }

  /* ---------- dessin du schéma ---------- */
  function sideOf(n, o) {
    const dx = (o.x + W / 2) - (n.x + W / 2), dy = (o.y + H / 2) - (n.y + H / 2);
    if (Math.abs(dx) * H * 1.6 > Math.abs(dy) * W) return dx >= 0 ? 'R' : 'L';
    return dy >= 0 ? 'B' : 'T';
  }
  function portPoint(n, s, off) {
    if (s === 'R') return { x: n.x + W, y: n.y + H / 2 + off };
    if (s === 'L') return { x: n.x, y: n.y + H / 2 + off };
    if (s === 'T') return { x: n.x + W / 2 + off, y: n.y };
    return { x: n.x + W / 2 + off, y: n.y + H };
  }
  function ctrl(p, s, d) {
    if (s === 'R') return { x: p.x + d, y: p.y };
    if (s === 'L') return { x: p.x - d, y: p.y };
    if (s === 'T') return { x: p.x, y: p.y - d };
    return { x: p.x, y: p.y + d };
  }
  function bez(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return { x: u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x,
             y: u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y };
  }
  function visibleLinks() { return state.links.filter((l) => !prefs.hidden.includes(l.cable) && byId(l.from) && byId(l.to)); }
  function geometry(links) {
    const ends = new Map(), geo = {};
    links.forEach((l) => {
      const a = byId(l.from), b = byId(l.to);
      const sa = sideOf(a, b), sb = sideOf(b, a);
      geo[l.id] = { a, b, sa, sb, oa: 0, ob: 0 };
      [[a.id + '|' + sa, 'a', b], [b.id + '|' + sb, 'b', a]].forEach(([k, end, other]) => {
        if (!ends.has(k)) ends.set(k, []);
        ends.get(k).push({ l, end, other });
      });
    });
    ends.forEach((arr, k) => {
      const s = k.split('|')[1], horiz = s === 'L' || s === 'R';
      arr.sort((p, q) => (horiz ? p.other.y - q.other.y : p.other.x - q.other.x) || (p.l.id < q.l.id ? -1 : 1));
      const len = horiz ? H - 14 : W - 24, cnt = arr.length;
      const sp = cnt > 1 ? Math.min(horiz ? 9 : 16, len / (cnt - 1)) : 0;
      arr.forEach((e, i) => { geo[e.l.id][e.end === 'a' ? 'oa' : 'ob'] = (i - (cnt - 1) / 2) * sp; });
    });
    Object.values(geo).forEach((g) => {
      const A = portPoint(g.a, g.sa, g.oa), B = portPoint(g.b, g.sb, g.ob);
      const dist = Math.hypot(B.x - A.x, B.y - A.y), d = clamp(dist / 2.6, 22, 130);
      g.p = [A, ctrl(A, g.sa, d), ctrl(B, g.sb, d), B];
      g.d = `M${A.x.toFixed(1)} ${A.y.toFixed(1)}C${g.p[1].x.toFixed(1)} ${g.p[1].y.toFixed(1)} ${g.p[2].x.toFixed(1)} ${g.p[2].y.toFixed(1)} ${B.x.toFixed(1)} ${B.y.toFixed(1)}`;
    });
    return geo;
  }
  function trunc(s, max) { s = String(s || ''); return s.length > max ? s.slice(0, max - 1) + '…' : s; }

  function zonesMarkup(forExport) {
    return state.zones.map((z) => {
      const sel = !forExport && ui.sel && ui.sel.kind === 'zone' && ui.sel.id === z.id ? ' sel' : '';
      return `<g class="zone${sel}" data-kind="zone" data-id="${esc(z.id)}" transform="translate(${z.x} ${z.y})">
<rect class="zbox" width="${z.w}" height="${z.h}" rx="10"/>
<path class="zhead" data-kind="zonehead" data-id="${esc(z.id)}" d="M0 10a10 10 0 0 1 10-10h${z.w - 20}a10 10 0 0 1 10 10v20H0z"/>
<text class="zlabel" x="12" y="20">${esc(z.label)}</text>
${forExport ? '' : `<rect class="zresize" data-kind="zoneresize" data-id="${esc(z.id)}" x="${z.w - 16}" y="${z.h - 16}" width="14" height="14" rx="3"/>`}
</g>`;

  function linksMarkup(forExport) {
    const links = visibleLinks(), geo = geometry(links);
    return links.map((l) => {

      const dash = st.dash ? ` stroke-dasharray="${st.dash}"` : '';
      let extra = '';
      if (prefs.ports || forExport) {
        const lab = (t, pt, cls) => t ? `<text class="${cls}" x="${pt.x.toFixed(1)}" y="${(pt.y - 5).toFixed(1)}" text-anchor="middle">${esc(trunc(t, 22))}</text>` : '';
        extra += lab(l.fromPort, bez(g.p[0], g.p[1], g.p[2], g.p[3], 0.16), 'plabel');
        extra += lab(l.toPort, bez(g.p[0], g.p[1], g.p[2], g.p[3], 0.84), 'plabel');
        if (l.label) {
          const m = bez(g.p[0], g.p[1], g.p[2], g.p[3], 0.5), t = trunc(l.label, 26), w = t.length * 6.1 + 12;
          extra += `<rect class="mpill" x="${(m.x - w / 2).toFixed(1)}" y="${(m.y - 9).toFixed(1)}" width="${w.toFixed(1)}" height="18" rx="9"/><text class="mtext" x="${m.x.toFixed(1)}" y="${(m.y + 3.5).toFixed(1)}" text-anchor="middle">${esc(t)}</text>`;
        }
      }
      if (l.status === 'verifier' && !(prefs.ports && l.label)) {
        const m = bez(g.p[0], g.p[1], g.p[2], g.p[3], 0.5);
        extra += `<circle class="vmark" cx="${m.x.toFixed(1)}" cy="${m.y.toFixed(1)}" r="7"/><text class="vmark-t" x="${m.x.toFixed(1)}" y="${(m.y + 4).toFixed(1)}" text-anchor="middle">?</text>`;
      }
      const tip = `${(CABLES[l.cable] || CABLES.other).label} · ${byId(l.from).label} → ${byId(l.to).label}`;
      return `<g class="link${sel}" data-kind="link" data-id="${esc(l.id)}"><title>${esc(tip)}</title>
<path class="lhit" d="${g.d}"/><path class="lcase" d="${g.d}"/><path class="lcore" d="${g.d}" stroke="${esc(cableColor(l))}"${dash}${l.cable === 'power' ? ' stroke-width="2.4"' : ''}/>${extra}</g>`;
    }).join('');
  }
  function nodesMarkup(forExport) {
    return state.nodes.map((n) => {
      const t = TYPES[n.type] || TYPES.other;
      const sel = !forExport && ui.sel && ui.sel.kind === 'node' && ui.sel.id === n.id ? ' sel' : '';
      const src = !forExport && ui.linkFrom === n.id ? ' src' : '';
      const lk = !forExport && ui.mode === 'link' ? ' linkable' : '';
      const alert = n.alert ? `<circle class="nalert" cx="${W - 4}" cy="4" r="9"/><text class="nalert-t" x="${W - 4}" y="8.5" text-anchor="middle">!</text>` : '';
      return `<g class="node st-${n.status}${sel}${src}${lk}" data-kind="node" data-id="${esc(n.id)}" transform="translate(${n.x} ${n.y})">
<title>${esc(n.label + (n.sub ? ' — ' + n.sub : '') + (n.alert ? '\n⚠ ' + n.alert : ''))}</title>
<rect class="nbox" width="${W}" height="${H}" rx="7"/>
<rect class="ntile cat-${t.cat}" x="7" y="7" width="38" height="38" rx="5"/>
<path class="nicon cat-${t.cat}" transform="translate(14 14)" d="${ICONS[t.icon] || ICONS.other}"/>
<text class="nlabel" x="53" y="23">${esc(trunc(n.label, 19))}</text>
<text class="nsub" x="53" y="40">${esc(trunc(n.sub || t.label, 23))}</text>${alert}
</g>`;
    }).join('');
  }

  function renderCanvas() {
    $('#layerZones').innerHTML = zonesMarkup(false);
    $('#layerLinks').innerHTML = linksMarkup(false);
    $('#layerNodes').innerHTML = nodesMarkup(false);
    applyView();
  }
  function applyView() {
    const v = ui.view;
    $('#vp').setAttribute('transform', `translate(${v.x.toFixed(1)} ${v.y.toFixed(1)}) scale(${v.k.toFixed(3)})`);
    $('#zoomTag').textContent = Math.round(v.k * 100) + ' %';
  }
  function bounds() {
    const xs = [], ys = [];
    state.zones.forEach((z) => { xs.push(z.x, z.x + z.w); ys.push(z.y, z.y + z.h); });
    state.nodes.forEach((n) => { xs.push(n.x, n.x + W); ys.push(n.y, n.y + H); });
    if (!xs.length) return { x: 0, y: 0, w: 800, h: 500 };
    const x = Math.min(...xs), y = Math.min(...ys);
    return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
  }
  function fit() {
    const r = $('#board').getBoundingClientRect();
    if (!r.width) return;
    const b = bounds(), pad = 24;
    const k = clamp(Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h), 0.2, 1.6);
    ui.view = { k, x: (r.width - b.w * k) / 2 - b.x * k, y: Math.min(pad, (r.height - b.h * k) / 2) - b.y * k };
    applyView();
  }
  function zoomAt(f, sx, sy) {
    const r = $('#board').getBoundingClientRect();
    if (sx == null) { sx = r.width / 2; sy = r.height / 2; }
    const v = ui.view, k = clamp(v.k * f, 0.2, 3);
    const wx = (sx - v.x) / v.k, wy = (sy - v.y) / v.k;
    ui.view = { k, x: sx - wx * k, y: sy - wy * k };
    applyView();
  }
  function toWorld(e) {
    const r = $('#board').getBoundingClientRect(), v = ui.view;
    return { x: (e.clientX - r.left - v.x) / v.k, y: (e.clientY - r.top - v.y) / v.k };
  }
  function viewCenter() {
    const r = $('#board').getBoundingClientRect(), v = ui.view;
    return { x: (r.width / 2 - v.x) / v.k, y: (r.height / 2 - v.y) / v.k };
  }

  /* ---------- interactions sur le plan ---------- */
  function bindBoard() {
    const svg = $('#board');
    svg.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const hit = e.target.closest('[data-kind]');
      const kind = hit ? hit.dataset.kind : 'bg', id = hit ? hit.dataset.id : null;
      const w = toWorld(e);
      const base = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false, snap: snapshot() };
      if (kind === 'node') {
        const n = byId(id);
        ui.drag = Object.assign(base, { kind, id, ox: n.x, oy: n.y, wx: w.x, wy: w.y });
      } else if (kind === 'link') {
        ui.drag = Object.assign(base, { kind, id });
      } else if (kind === 'zonehead') {
        const z = zoneById(id);
        const inside = state.nodes.filter((n) => n.x + W / 2 > z.x && n.x + W / 2 < z.x + z.w && n.y + H / 2 > z.y && n.y + H / 2 < z.y + z.h).map((n) => ({ n, x: n.x, y: n.y }));
        ui.drag = Object.assign(base, { kind, id, ox: z.x, oy: z.y, wx: w.x, wy: w.y, inside });
      } else if (kind === 'zoneresize') {
        const z = zoneById(id);
        ui.drag = Object.assign(base, { kind, id, ow: z.w, oh: z.h, wx: w.x, wy: w.y });
      } else {
        ui.drag = Object.assign(base, { kind: 'pan', vx: ui.view.x, vy: ui.view.y });
        svg.classList.add('panning');
      }
      try { svg.setPointerCapture(e.pointerId); } catch (err) { /* capture indisponible */ }
    });
    svg.addEventListener('pointermove', (e) => {
      const d = ui.drag;
      if (!d || d.pid !== e.pointerId) return;
      const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
      if (!d.moved && Math.hypot(dx, dy) < 4) return;
      d.moved = true;
      const w = toWorld(e);
      if (d.kind === 'pan') { ui.view.x = d.vx + dx; ui.view.y = d.vy + dy; applyView(); return; }
      if (d.kind === 'node' && ui.mode === 'select') {
        const n = byId(d.id); n.x = snap(d.ox + w.x - d.wx); n.y = snap(d.oy + w.y - d.wy);
        $('#layerLinks').innerHTML = linksMarkup(false); $('#layerNodes').innerHTML = nodesMarkup(false);
      } else if (d.kind === 'zonehead') {
        const z = zoneById(d.id), ddx = snap(w.x - d.wx), ddy = snap(w.y - d.wy);
        z.x = d.ox + ddx; z.y = d.oy + ddy;
        d.inside.forEach((it) => { it.n.x = it.x + ddx; it.n.y = it.y + ddy; });
        renderCanvas();
      } else if (d.kind === 'zoneresize') {
        const z = zoneById(d.id); z.w = Math.max(160, snap(d.ow + w.x - d.wx)); z.h = Math.max(80, snap(d.oh + w.y - d.wy));
        $('#layerZones').innerHTML = zonesMarkup(false);
      }
    });
    const end = (e) => {
      const d = ui.drag;
      if (!d || d.pid !== e.pointerId) return;
      ui.drag = null; svg.classList.remove('panning');
      const linkTap = ui.mode === 'link' && d.kind === 'node';
      if (d.moved && !linkTap) { if (d.kind !== 'pan') { commit(d.snap); if (d.kind === 'node') select({ kind: 'node', id: d.id }, true); } return; }
      if (e.type === 'pointercancel') return;
      clickOn(d.kind, d.id);
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('wheel', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      const r = svg.getBoundingClientRect();
      zoomAt(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
  }
  function clickOn(kind, id) {
    if (ui.mode === 'link') {
      if (kind !== 'node') { if (kind === 'pan' || kind === 'bg') setMode('select'); return; }
      if (!ui.linkFrom) { ui.linkFrom = id; renderCanvas(); renderHint(); return; }
      if (ui.linkFrom === id) { ui.linkFrom = null; renderCanvas(); renderHint(); return; }
      addLink(ui.linkFrom, id, prefs.cable);
      return;
    }
    if (kind === 'node' || kind === 'link') select({ kind, id });
    else if (kind === 'zonehead' || kind === 'zoneresize') select({ kind: 'zone', id });
    else select(null);
  }
  function select(sel, keepInspector) {

  function setMode(m) {

  function renderHint() {

    }
  }

  function addLink(from, to, cable) {
    const snap0 = snapshot();
    const l = { id: uid('l'), from, to, cable, color: '', fromPort: '', toPort: '', label: '', status: 'suppose', notes: '' };
    state.links.push(l);
    if (prefs.hidden.includes(cable)) { prefs.hidden = prefs.hidden.filter((c) => c !== cable); savePrefs(); }
    ui.mode = 'select'; ui.linkFrom = null;
    $('#tSelect').classList.add('on'); $('#tLink').classList.remove('on'); $('#board').classList.remove('linking');

  function addNode(type) {

  function removeSelected() {

  }
  function inspectLink(box, l) {

    box.innerHTML = `
<div class="insp-head"><span class="kind">Câble · ${esc(CABLES[l.cable].label)}</span><h3 id="inspTitle">${esc(a.label)} → ${esc(b.label)}</h3></div>

  function selectedObj() {
    const s = ui.sel; if (!s) return null;

  function bindInspector() {
    const box = $('#insp');
    box.addEventListener('focusin', () => { if (ui.pendingSnap == null) ui.pendingSnap = snapshot(); });
    box.addEventListener('focusout', () => { setTimeout(() => { if (!box.contains(document.activeElement)) ui.pendingSnap = null; }, 0); });
    box.addEventListener('input', (e) => {
      const f = e.target.dataset.f, o = selectedObj();
      if (!f || !o) return;
      if (ui.pendingSnap == null) ui.pendingSnap = snapshot();
      let v = e.target.value;
      if ((f === 'from' || f === 'to') && (v === (f === 'from' ? o.to : o.from))) { e.target.value = o[f]; say('Un câble doit relier deux équipements différents.'); return; }
      o[f] = v;
      if (f === 'label' && ui.sel.kind !== 'link' && $('#inspTitle')) $('#inspTitle').textContent = v;
      renderCanvas(); renderStatus();
    });
    box.addEventListener('change', (e) => {
      const f = e.target.dataset.f;
      if (!f) return;
      if (ui.pendingSnap != null) { commit(ui.pendingSnap); ui.pendingSnap = snapshot(); }
      if (['cable', 'color', 'from', 'to', 'type'].includes(f)) { renderLegend(); renderInspector(); }
    });
    box.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const o = selectedObj();
      if (b.dataset.gotoNode) return focusItem('node', b.dataset.gotoNode);
      if (b.dataset.gotoLink) return focusItem('link', b.dataset.gotoLink);
      if (b.dataset.color && o) { const s0 = snapshot(); o.color = b.dataset.color.toLowerCase() === CABLES[o.cable].color.toLowerCase() ? '' : b.dataset.color; commit(s0); renderCanvas(); renderInspector(); return; }
      const act = b.dataset.act; if (!act) return;
      if (act === 'colorreset' && o) { const s0 = snapshot(); o.color = ''; commit(s0); renderCanvas(); renderInspector(); }
      if (act === 'swap' && o) { const s0 = snapshot(); [o.from, o.to] = [o.to, o.from]; [o.fromPort, o.toPort] = [o.toPort, o.fromPort]; commit(s0); renderCanvas(); renderInspector(); }
      if (act === 'del') removeSelected();
      if (act === 'dup' && o) { const s0 = snapshot(); const c = Object.assign({}, o, { id: uid('n'), label: o.label + ' (copie)', x: o.x + 20, y: o.y + 70 }); state.nodes.push(c); commit(s0); select({ kind: 'node', id: c.id }); }
      if (act === 'linkfrom' && o) { setMode('link'); ui.linkFrom = o.id; renderCanvas(); renderHint(); }
      if (act === 'addlink' && o) { const to = $('#f-newto').value, cb = $('#f-newcable').value; if (to) { prefs.cable = cb; savePrefs(); $('#tCable').value = cb; syncCableSwatch(); addLink(o.id, to, cb); } }
    });
  }
  function focusItem(kind, id) {

  /* ---------- onglets, statut, toasts ---------- */
  function setTab(t) {
    prefs.tab = t; savePrefs();
    $$('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    ['schema', 'video', 'checks', 'colors'].forEach((k) => { $('#p-' + k).hidden = k !== t; });
    if (t === 'schema') requestAnimationFrame(() => { if (!ui.fitted) { fit(); ui.fitted = true; } });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  }
  function renderStatus() {
    const chip = $('#saveState'), btn = $('#btnSave'), dirty = isDirty();
    $('#updated').textContent = state.updatedAt ? 'modifié le ' + fmtDate(state.updatedAt) : '';
    chip.className = 'chip';
    if (cap.readOnly) { chip.classList.add('ro'); chip.textContent = 'Lecture seule'; btn.textContent = 'Exporter le JSON'; btn.disabled = false; return; }
    if (cap.saving) { chip.textContent = 'Enregistrement…'; btn.disabled = true; return; }
    if (cap.inViewer && !cap.resolved) { chip.textContent = dirty ? 'Modifié' : 'Connexion…'; btn.disabled = true; btn.textContent = 'Enregistrer'; return; }
    if (cap.artifact) {
      btn.textContent = 'Enregistrer'; btn.disabled = !dirty;
      if (dirty) { chip.classList.add('dirty'); chip.textContent = 'Modifications non enregistrées'; }
      else { chip.classList.add('ok'); chip.textContent = 'Enregistré'; }
      return;
    }
    btn.disabled = false;
    btn.textContent = cap.inViewer ? 'Exporter le JSON' : 'Télécharger le HTML';
    if (dirty) { chip.classList.add('dirty'); chip.textContent = cap.inViewer ? 'Non enregistré ici · exporte' : 'Brouillon local · télécharge le HTML'; }
    else { chip.textContent = cap.inViewer ? 'Enregistrement indisponible ici' : 'Fichier local'; }

  function toast(msg) {
    let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }

  /* ---------- enregistrement ---------- */
  function resetCss() {
    const st = Array.from(document.head ? document.head.querySelectorAll('style') : []).find((s) => s.textContent.indexOf('safe-area-inset') > -1);
    return st ? st.textContent : DEFAULT_RESET;
  }
  function buildDocument(st) {
    const css = document.getElementById('d8-css').textContent;
    const js = document.getElementById('d8-app').textContent;
    const json = JSON.stringify(st).replace(/</g, '\\u003c').replace(/[\u2028\u2029]/g, (c) => '\\u' + c.charCodeAt(0).toString(16));
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetCss() + '</style></head><body>\n' +
      '<title>' + TITLE + '</title>\n<style id="d8-css">' + css + '</style>\n' + FONT_LINK + '\n<div id="root"></div>\n' +
      '<script type="application/json" id="d8-state">' + json + '<\/script>\n<script id="d8-app">' + js + '<\/script>\n\n</body></html>';
  }
  async function save() {
    if (cap.saving) return;
    if (!cap.artifact || cap.readOnly) {
      if (cap.inViewer) return exportAs('json');
      return exportAs('html');
    }
    if (!isDirty()) return;
    const next = JSON.parse(snapshot()); next.updatedAt = new Date().toISOString();
    cap.saving = true; renderStatus();
    store.set('d8-schema-stash', { tab: prefs.tab, sel: ui.sel }, true);
    store.set('d8-schema-draft', { at: Date.now(), state: next });
    const attempt = () => cap.artifact.publish(buildDocument(next));
    try {
      try { await attempt(); }
      catch (e) { if (e && e.code === 'upstream_error') { await new Promise((r) => setTimeout(r, 800 + Math.random() * 900)); await attempt(); } else throw e; }
      state.updatedAt = next.updatedAt; savedJSON = JSON.stringify(state);
      cap.saving = false; renderStatus(); toast('Enregistré. La page se recharge avec la nouvelle version.');
    } catch (e) {
      cap.saving = false;
      const code = e && e.code;
      if (code === 'conflict') toast('Une autre version vient d’être enregistrée : la page se recharge. Tes modifications restent en brouillon.');
      else if (['not_writer', 'not_granted', 'consent_required', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { cap.readOnly = true; toast('Cette vue est en lecture seule : exporte tes modifications en JSON.'); }
      else if (code === 'too_large') toast('Le schéma est trop volumineux pour être enregistré. Exporte-le en JSON.');
      else if (code === 'rate_limited') toast('Trop d’enregistrements rapprochés : réessaie dans un moment.');
      else toast('L’enregistrement a échoué. Tes modifications sont gardées en brouillon sur ce poste.');
      renderStatus();
    }
  }

    return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}">
<style>${EXPORT_CSS}</style><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#F5F8F7"/>
<text class="ttl" x="${b.x}" y="${b.y - top + 10}">Salle serveur D8 · schéma réseau</text>
<text class="sub" x="${b.x}" y="${b.y - top + 30}">${esc(state.updatedAt ? 'Modifié le ' + fmtDate(state.updatedAt) : 'Reconstitution depuis la vidéo du 2 oct. 2026')} · trait plein = vu, tirets = supposé, pointillés = à vérifier</text>

  function svgToPng(svgText) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const s = 2, c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
        const ctx = c.getContext('2d'); ctx.scale(s, s); ctx.drawImage(img, 0, 0);
        c.toBlob((bl) => bl ? resolve(bl) : reject(new Error('png')), 'image/png');
      };
      img.onerror = reject;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
    });
  }
  async function offerFile(filename, data, mime) {
    if (cap.inViewer) {
      let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
      if (!dl) { toast('Le téléchargement n’est pas disponible dans cette vue.'); return; }
      try { const r = await dl.save({ filename, data }); if (r && r.status === 'saved') toast('Fichier enregistré : ' + filename); }
      catch (e) { if (e && e.code !== 'declined') toast('Le fichier n’a pas pu être proposé (' + (e.code || 'erreur') + ').'); }
      return;
    }
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Fichier téléchargé : ' + filename);
  }
  async function exportAs(kind) {
    $('#exportMenu').open = false;
    const day = new Date().toISOString().slice(0, 10);
    try {
      if (kind === 'json') return offerFile(`schema-salle-serveur-${day}.json`, JSON.stringify(state, null, 2), 'application/json');
      if (kind === 'svg') return offerFile(`schema-salle-serveur-${day}.svg`, exportSvg(), 'image/svg+xml');
      if (kind === 'png') return offerFile(`schema-salle-serveur-${day}.png`, await svgToPng(exportSvg()), 'image/png');
      if (kind === 'html') { const s = JSON.parse(snapshot()); s.updatedAt = new Date().toISOString(); return offerFile('schema-salle-serveur.html', buildDocument(s), 'text/html'); }
    } catch (e) { toast('L’export a échoué.'); }
  }
  function importFile(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const s = JSON.parse(r.result);
        if (!validState(s)) throw new Error('format');
        const s0 = snapshot(); state = normalize(s); ui.sel = null; commit(s0); renderAll(); fit();
        toast('Schéma importé. Enregistre pour le garder.');
      } catch (e) { toast('Ce fichier n’est pas un export JSON de ce schéma.'); }
    };
    r.readAsText(file);
  }

  /* ---------- brouillon local ---------- */
  function checkDraft() {
    const d = store.get('d8-schema-draft');
    const box = $('#draftBanner');
    if (!d || !d.state || !validState(d.state) || JSON.stringify(d.state) === savedJSON || JSON.stringify(d.state.nodes) === JSON.stringify(state.nodes) && JSON.stringify(d.state.links) === JSON.stringify(state.links) && JSON.stringify(d.state.zones) === JSON.stringify(state.zones) && JSON.stringify(d.state.checks) === JSON.stringify(state.checks) && d.state.notes === state.notes) { store.del('d8-schema-draft'); box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<b>Brouillon non enregistré</b><span>Des modifications du ${esc(fmtDate(new Date(d.at).toISOString()))} n’ont pas été enregistrées sur ce poste.</span>
<button type="button" class="btn primary" id="draftUse">Reprendre le brouillon</button><button type="button" class="btn" id="draftDrop">Ignorer</button>`;
    $('#draftUse').onclick = () => { const s0 = snapshot(); state = normalize(d.state); commit(s0); box.hidden = true; renderAll(); };
    $('#draftDrop').onclick = () => { store.del('d8-schema-draft'); box.hidden = true; };
  }

  /* ---------- assemblage ---------- */
  function renderAll() { renderCanvas(); renderInspector(); renderLegend(); renderChecks(); renderStatus(); renderUndo(); }
  function bindGlobal() {
    $$('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
    $('#tSelect').onclick = () => setMode('select');
    $('#tLink').onclick = () => setMode(ui.mode === 'link' ? 'select' : 'link');
    $('#tCable').value = prefs.cable; syncCableSwatch();
    $('#tCable').onchange = (e) => { prefs.cable = e.target.value; savePrefs(); syncCableSwatch(); renderHint(); };
    $('#tAdd').onchange = (e) => { if (e.target.value) { addNode(e.target.value); e.target.value = ''; } };
    $('#tZone').onclick = addZone;
    $('#tUndo').onclick = undo; $('#tRedo').onclick = redo;
    $('#tZoomIn').onclick = () => zoomAt(1.2); $('#tZoomOut').onclick = () => zoomAt(1 / 1.2); $('#tFit').onclick = fit;
    $('#tPorts').checked = prefs.ports;
    $('#tPorts').onchange = (e) => { prefs.ports = e.target.checked; savePrefs(); renderCanvas(); };
    $('#legend').addEventListener('click', (e) => {
      const b = e.target.closest('[data-cable]'); if (!b) return;
      const k = b.dataset.cable; prefs.hidden = prefs.hidden.includes(k) ? prefs.hidden.filter((c) => c !== k) : prefs.hidden.concat(k);
      savePrefs(); renderLegend(); renderCanvas();
    });
    $('#btnSave').onclick = save;
    $('#exportMenu').addEventListener('click', (e) => { const b = e.target.closest('[data-export]'); if (b) exportAs(b.dataset.export); });
    $('#btnImport').onclick = () => $('#fileImport').click();
    $('#fileImport').onchange = (e) => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ''; };
    $('#p-video').addEventListener('click', (e) => { const b = e.target.closest('[data-goto-node]'); if (b) focusItem('node', b.dataset.gotoNode); });
    $('#p-checks').addEventListener('change', (e) => {
      if (e.target.id === 'hideDone') { prefs.hideDone = e.target.checked; savePrefs(); renderChecks(); return; }
      const id = e.target.dataset.check; if (!id) return;
      const s0 = snapshot(); if (e.target.checked) state.checks[id] = true; else delete state.checks[id];
      commit(s0); renderChecks();
      const el = $('#chk-' + id); if (el) el.focus();
    });
    let notesSnap = null;
    $('#p-checks').addEventListener('focusin', (e) => { if (e.target.id === 'freeNotes') notesSnap = snapshot(); });
    $('#p-checks').addEventListener('input', (e) => { if (e.target.id === 'freeNotes') { state.notes = e.target.value; renderStatus(); } });
    $('#p-checks').addEventListener('focusout', (e) => { if (e.target.id === 'freeNotes' && notesSnap) { commit(notesSnap); notesSnap = null; } });
    document.addEventListener('keydown', (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
      if (typing) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
      if (prefs.tab !== 'schema') return;
      if (e.key === 'Escape') { if (ui.mode === 'link') setMode('select'); else select(null); }
      if ((e.key === 'Delete' || e.key === 'Backspace') && ui.sel) { e.preventDefault(); removeSelected(); }
      if (e.key.toLowerCase() === 'l' && !e.ctrlKey && !e.metaKey) setMode(ui.mode === 'link' ? 'select' : 'link');
    });
    document.addEventListener('click', (e) => { const m = $('#exportMenu'); if (m.open && !m.contains(e.target)) m.open = false; });
    window.addEventListener('beforeunload', (e) => { if (isDirty() && !cap.saving && !cap.artifact) { e.preventDefault(); e.returnValue = ''; } });
    let rt = null; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (prefs.tab === 'schema') applyView(); }, 120); });
  }
  function initCapabilities() {
    if (!cap.inViewer) { cap.resolved = true; renderStatus(); return; }
    let p; try { p = window.claude.use('artifact'); } catch (e) { p = Promise.resolve(null); }
    Promise.resolve(p).then((a) => { cap.artifact = a || null; }).catch(() => { cap.artifact = null; })
      .then(() => { cap.resolved = true; renderStatus(); });
  }

  function start() {
    document.getElementById('root').innerHTML = shell();
    renderVideo(); renderColors();
    bindBoard(); bindInspector(); bindGlobal();
    renderAll(); renderHint();
    setTab(prefs.tab || 'schema');
    if (prefs.tab !== 'schema') { $('#p-schema').hidden = false; fit(); ui.fitted = true; $('#p-schema').hidden = true; }
    checkDraft();
    initCapabilities();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>

</body></html>
