<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Schéma salle serveur D8</title>
<style id="d8-css">
/* Mise en page : en-tête d’une ligne, onglets, puis le plan qui occupe tout le reste de l’écran ; le panneau de détails glisse par-dessus à droite (en bas sur téléphone) */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#152120; --muted:#566664; --line:#D2DBD9; --line-strong:#A9B8B6;
  --accent:#0A7573; --accent-ink:#FFFFFF; --accent-soft:#D5ECEA; --explain:#0B6F6D;
  --ok:#2C8650; --ok-soft:#DDF1E4; --warn:#A86A12; --warn-soft:#FBEBD2; --crit:#BF2F2F; --crit-soft:#F9E0E0;
  --grid:#DCE4E2; --casing:#FFFFFF; --casing-op:1; --zone:#FBFCFC; --zone-head:#E2EAE8; --zone-line:#C4D0CE;
  --cat-net:#0A7573; --cat-wan:#BF2F2F; --cat-srv:#6A4EC6; --cat-end:#2B69D6; --cat-pwr:#B8620F; --cat-env:#178AA0; --cat-tel:#8A572A;
  --shadow:0 14px 36px rgba(20,40,38,.18);
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1413; --surface:#162020; --surface-2:#1B2625; --ink:#E1EAE8; --muted:#92A3A1; --line:#283533; --line-strong:#40504E;
  --accent:#3EC2BE; --accent-ink:#04201F; --accent-soft:#14373A; --explain:#6FD3CF;
  --ok:#5CC488; --ok-soft:#173326; --warn:#E5A94D; --warn-soft:#3A2D15; --crit:#F27373; --crit-soft:#3E1E1E;
  --grid:#18211F; --casing:#B9C7C4; --casing-op:.45; --zone:#121A19; --zone-head:#1C2726; --zone-line:#2E3C3A;
  --cat-net:#3EC2BE; --cat-wan:#F27373; --cat-srv:#A994F2; --cat-end:#6FA0F5; --cat-pwr:#F0A04F; --cat-env:#4CC3D8; --cat-tel:#D2955C;
  --shadow:0 14px 36px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1413; --surface:#162020; --surface-2:#1B2625; --ink:#E1EAE8; --muted:#92A3A1; --line:#283533; --line-strong:#40504E;
  --accent:#3EC2BE; --accent-ink:#04201F; --accent-soft:#14373A; --explain:#6FD3CF;
  --ok:#5CC488; --ok-soft:#173326; --warn:#E5A94D; --warn-soft:#3A2D15; --crit:#F27373; --crit-soft:#3E1E1E;
  --grid:#18211F; --casing:#B9C7C4; --casing-op:.45; --zone:#121A19; --zone-head:#1C2726; --zone-line:#2E3C3A;
  --cat-net:#3EC2BE; --cat-wan:#F27373; --cat-srv:#A994F2; --cat-end:#6FA0F5; --cat-pwr:#F0A04F; --cat-env:#4CC3D8; --cat-tel:#D2955C;
  --shadow:0 14px 36px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
#root{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:10px 40px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}

/* plein écran : le plan prend toute la hauteur disponible */
html.d8-full,html.d8-full body{height:100%}
@media (min-width:701px) and (min-height:521px){
  html.d8-full body{overflow:hidden}
  html.d8-full #root{height:100%;display:flex;flex-direction:column;max-width:none;padding-block:8px 12px}
  html.d8-full #p-schema{flex:1;min-height:0;display:flex;flex-direction:column}
  html.d8-full .editor{flex:1;min-height:0}
  html.d8-full .canvas-wrap{flex:1;height:auto}
}
#p-schema:fullscreen{background:var(--bg);padding:12px;display:flex;flex-direction:column}
#p-schema:fullscreen .editor{flex:1;min-height:0}
#p-schema:fullscreen .canvas-wrap{flex:1;height:auto}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-block:2px 8px;border-bottom:1px solid var(--line-strong)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;min-width:0}
.top h1{font-size:clamp(24px,2.6vw,32px);letter-spacing:.01em}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 11px;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.soft{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--ink);font-weight:600}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.dirty{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:var(--warn-soft)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-soft)}
.chip.ro{color:var(--crit);background:var(--crit-soft)}
.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px;display:grid;gap:2px;min-width:220px;box-shadow:var(--shadow)}
.menu-list button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px}
.menu-list button:hover{background:var(--surface-2)}
.menu-list small{display:block;color:var(--muted);font-size:12px}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px;padding:8px 12px;border-radius:var(--r);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));font-size:14px}
.banner b{font-family:var(--font-display);font-size:16px;font-weight:600}

.tabs{display:flex;gap:2px;margin-top:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:6px 12px 7px;font-family:var(--font-display);font-size:16.5px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .count{font-family:var(--font-mono);font-size:11px;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.panel{padding-top:10px}

/* éditeur */
.editor{display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;border-bottom:0}
.tright{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-left:auto}
.tgroup{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.tgroup button{border:0;background:var(--surface);padding:5px 10px;min-width:32px;line-height:1.25}
.tgroup button+button{border-left:1px solid var(--line)}
.tgroup button.on{background:var(--ink);color:var(--surface)}
.tgroup button:hover:not(.on){background:var(--surface-2)}
.tgroup button[disabled]{opacity:.4;cursor:default}
.tsel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tsel select,.tadd{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:5px 6px;color:var(--ink);max-width:190px}
.tchk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);white-space:nowrap}
.tchk input{accent-color:var(--accent)}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px;background:var(--c);vertical-align:middle}
.canvas-wrap{position:relative;height:72vh;min-height:340px;border:1px solid var(--line);background:var(--surface-2);overflow:hidden;touch-action:none}
#board{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;cursor:grab}
#board.panning{cursor:grabbing}
#board.linking{cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r)}
.lg-title{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.lchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px 2px 8px;font-size:13px}
.lchip .sw{width:22px;height:5px}
.lchip .n{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.lchip.off{opacity:.42;text-decoration:line-through}
.lg-sep{width:1px;align-self:stretch;background:var(--line);margin-inline:4px}
.lg-line{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:13px;white-space:nowrap}
.lg-line svg{flex:none}
.lg-note{font-size:12.5px;color:var(--muted);margin-left:auto}
.zoomtag{position:absolute;left:10px;bottom:8px;font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 6px;pointer-events:none}
.modehint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 24px);text-align:center}
.modehint kbd{color:var(--surface);border-color:currentColor}

/* aide de lecture */
.guide{position:absolute;left:12px;top:12px;z-index:5;width:min(440px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:10px}
.guide h3{font-size:22px}
.guide ul{margin:0;padding-left:18px;display:grid;gap:7px;font-size:14.5px}
.guide .row{display:flex;flex-wrap:wrap;gap:8px}
.keyline{display:inline-block;vertical-align:middle;margin-inline:2px}

/* SVG */
.gridline{stroke:var(--grid);stroke-width:1}
.gridbg{fill:url(#gridpat)}
.zbox{fill:var(--zone);stroke:var(--zone-line);stroke-width:1.3}
.zhead{fill:var(--zone-head);cursor:move}
.zlabel{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;fill:var(--ink);pointer-events:none}
.zcap{font-family:var(--font-body);font-size:12.5px;fill:var(--muted);pointer-events:none}
.zresize{fill:var(--zone-line);cursor:nwse-resize}
.zone.sel .zbox{stroke:var(--accent);stroke-width:2}
.lhit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}
.lcase{fill:none;stroke:var(--casing);stroke-opacity:var(--casing-op);stroke-width:7.5;stroke-linecap:round}
.lcore{fill:none;stroke-width:3.4;stroke-linecap:round}
.link.sel .lcase{stroke:var(--accent);stroke-opacity:.55;stroke-width:12}
.link.sel .lcore{stroke-width:4.6}
.link:hover .lcase{stroke:var(--accent);stroke-opacity:.35}
.link.dim{opacity:.12}
.link.onpath .lcore{stroke-width:5.2}
.link.onpath .lcase{stroke-width:10}
.lflow{fill:none;stroke:#FFFFFF;stroke-width:2.2;stroke-dasharray:2 13;stroke-linecap:round;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.lflow{animation:flow 1.1s linear infinite}.lflow.rev{animation-direction:reverse}@keyframes flow{to{stroke-dashoffset:-15}}}
.plabel{font-family:var(--font-mono);font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:var(--surface-2);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.mpill{fill:var(--surface);stroke:var(--line-strong)}
.mtext{font-family:var(--font-body);font-size:11.5px;font-weight:500;fill:var(--ink)}
.vmark{fill:var(--warn)}
.vmark-t{font-family:var(--font-display);font-size:12px;font-weight:700;fill:var(--surface)}
.node{cursor:pointer}
.node.dim{opacity:.18}
.nbox{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.node.st-suppose .nbox{stroke-dasharray:7 4}
.node.st-verifier .nbox{stroke:var(--warn);stroke-dasharray:2 3;stroke-width:1.9}
.node.sel .nbox,.node.onpath .nbox{stroke:var(--accent);stroke-width:2.8;stroke-dasharray:none}
.node.src .nbox{stroke:var(--accent);stroke-width:3.2;stroke-dasharray:none}
.node.linkable:hover .nbox{stroke:var(--accent);stroke-width:2.6}
.ntile{fill-opacity:.15}
.nicon{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nlabel{font-family:var(--font-display);font-size:17px;font-weight:600;fill:var(--ink)}
.nsub{font-family:var(--font-body);font-size:12.5px;fill:var(--muted)}
.nexpl{font-family:var(--font-body);font-size:12.5px;font-weight:600;fill:var(--explain)}
.nalert{fill:var(--crit)}
.nalert-t{font-family:var(--font-display);font-size:13px;font-weight:700;fill:#FFFFFF;pointer-events:none}
.stepb{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.stepb-t{font-family:var(--font-display);font-size:14px;font-weight:700;fill:var(--accent-ink);pointer-events:none}
.ntile.cat-net{fill:var(--cat-net)} .ntile.cat-wan{fill:var(--cat-wan)} .ntile.cat-srv{fill:var(--cat-srv)} .ntile.cat-end{fill:var(--cat-end)}
.ntile.cat-pwr{fill:var(--cat-pwr)} .ntile.cat-env{fill:var(--cat-env)} .ntile.cat-tel{fill:var(--cat-tel)}
.nicon.cat-net{stroke:var(--cat-net)} .nicon.cat-wan{stroke:var(--cat-wan)} .nicon.cat-srv{stroke:var(--cat-srv)} .nicon.cat-end{stroke:var(--cat-end)}
.nicon.cat-pwr{stroke:var(--cat-pwr)} .nicon.cat-env{stroke:var(--cat-env)} .nicon.cat-tel{stroke:var(--cat-tel)}
#measure{visibility:hidden}

/* panneau de détails */
.insp{position:absolute;top:10px;right:10px;bottom:10px;z-index:7;width:min(380px,calc(100% - 20px));overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:14px;display:grid;gap:12px;align-content:start;box-shadow:var(--shadow)}
@media (max-width:700px){.insp{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:64%}}
.insp-top{display:flex;align-items:flex-start;gap:10px}
.insp-head{display:grid;gap:2px;min-width:0;flex:1}
.x{flex:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-size:20px;line-height:1}
.x:hover{border-color:var(--ink)}
.kind{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.insp h3{font-size:24px}
.about{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.45}
.about b{font-family:var(--font-display);font-size:15px;letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:2px}
.alertbox{background:var(--crit-soft);color:var(--ink);border-left:3px solid var(--crit);border-radius:6px;padding:8px 10px;font-size:14px}
.pathbox{display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.pathbox .row{display:flex;gap:6px}
.pathbox select{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:6px 8px;color:var(--ink)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:7px 9px;color:var(--ink);font-size:14px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{border:0;padding:0;margin:0;display:grid;gap:4px}
.seg legend{font-size:13px;color:var(--muted);padding:0;margin-bottom:4px}
.seg-row{display:flex;flex-wrap:wrap;gap:4px}
.seg-row label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer}
.seg-row input{accent-color:var(--accent);margin:0}
.seg-row label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);background:var(--c);padding:0}
.swatches button.on{box-shadow:0 0 0 2px var(--accent)}
.swatches input[type=color]{width:36px;height:30px;padding:0 2px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.sub-h{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.conn{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.conn button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:5px;font-size:13.5px}
.conn button:hover{background:var(--surface-2)}
.conn small{color:var(--muted);margin-left:auto;font-family:var(--font-mono);font-size:10.5px;white-space:nowrap}
.conn .sw{flex:none}
.row-actions{display:flex;flex-wrap:wrap;gap:6px}
.addlink{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.addlink select{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:6px;color:var(--ink);min-width:0}
.addlink .btn{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface-2)}
.stat b{display:block;font-family:var(--font-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.flag{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:6px;border-radius:6px;font-size:13.5px}
.flag:hover{background:var(--surface-2)}
.flag i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--warn)}
.flag.crit i{background:var(--crit)}
.flag small{display:block;color:var(--muted);font-size:12px}
.help{font-size:13px;color:var(--muted);margin:0}
.steps{list-style:none;margin:0;padding:0;display:grid}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:700;font-size:15px;display:grid;place-items:center}
.step button{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:15px}
.step button:hover{text-decoration:underline}
.step p{margin:1px 0 0;font-size:13.5px;color:var(--muted)}
.hop{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;font-size:12.5px;color:var(--muted);padding:4px 0}
.hop i{justify-self:center;width:3px;height:100%;min-height:22px;border-radius:2px;background:var(--c)}
.tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px;white-space:nowrap}

/* onglets de lecture */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:22px;margin-bottom:8px}
.card p{margin:0 0 8px;max-width:68ch}
.quote{font-size:18px;line-height:1.45;border-left:3px solid var(--accent);padding-left:14px;margin:6px 0 4px;max-width:60ch}
.quote+small{color:var(--muted);font-family:var(--font-mono);font-size:11.5px}
.timeline{list-style:none;margin:0;padding:0;display:grid}
.tl{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl time{font-family:var(--font-mono);font-size:12.5px;color:var(--accent);padding-top:3px;font-variant-numeric:tabular-nums}
.tl h3{font-size:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tl p{margin:4px 0 0;color:var(--ink);max-width:70ch}
.tl .go{margin-top:6px;border:0;background:none;color:var(--accent);padding:0;font-size:13px;font-weight:600}
.conf{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid}
.conf.sur{color:var(--ok);border-color:currentColor;background:var(--ok-soft)}
.conf.probable{color:var(--accent);border-color:currentColor;background:var(--accent-soft)}
.conf.verifier{color:var(--warn);border-color:currentColor;background:var(--warn-soft)}
.list{margin:0;padding-left:18px;display:grid;gap:8px}
.list li{max-width:68ch}
.progress{height:6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:var(--p)}
.chk-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.chk-top .progress{width:min(360px,100%)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:16px;align-items:start}
.group h2{font-size:20px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.group h2 small{font-family:var(--font-mono);font-size:12px;font-weight:400;color:var(--muted)}
.group .progress{margin:6px 0 4px}
.item{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.item label{cursor:pointer}
.item .t{font-weight:600}
.item .why{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.prio{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.prio.crit{background:var(--crit-soft);color:var(--crit)}
.prio.imp{background:var(--warn-soft);color:var(--warn)}
.prio.bon{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ref{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);margin-left:6px;white-space:nowrap}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-top:0}
td .sw{width:34px;height:7px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.gloss dl{margin:0;display:grid}
.gloss dt{font-family:var(--font-display);font-size:18px;font-weight:600;padding-top:10px;border-top:1px solid var(--line)}
.gloss dt:first-of-type{border-top:0;padding-top:0}
.gloss dd{margin:2px 0 10px;max-width:62ch}
.notes-area{width:100%;min-height:140px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:10px;color:var(--ink);font:inherit;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.toast{animation:toastIn .18s ease-out}@keyframes toastIn{from{transform:translate(-50%,8px);opacity:0}}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

      { id: 'c32', p: 'imp', t: 'Désactiver les ports inutilisés ou activer 802.1X / port-security', why: 'Une prise murale active dans une salle de réunion est une porte d’entrée.' },

      { id: 'c42', p: 'imp', t: 'Compter la consommation et la chaleur de la carte graphique', why: 'Si c’est un serveur IA avec GPU, il peut tirer 300 à 600 W : à prendre en compte pour l’onduleur et la clim.' },
      { id: 'c43', p: 'bon', t: 'Mises à jour de l’OS et de PHP, antivirus, compte de service à droits minimaux', why: 'Le compte du serveur web ne doit pouvoir écrire que dans le dossier data.' }

    { id: 'g7', title: 'Opérateurs et téléphonie', items: [
      { id: 'c44', p: 'crit', t: 'Recenser ce qui passe encore par le cuivre du répartiteur', why: 'Le réseau cuivre ferme progressivement en France d’ici 2030. Alarme, ascenseur, fax, TPE ou GTB peuvent s’arrêter sans prévenir : prévoir leur migration (IP ou 4G).' },

  const fitCache = new Map();

  /* ---------- géométrie des câbles ---------- */
  function center(n) { const h = nh(); return { x: n.x + W / 2, y: n.y + h / 2 }; }
  function blocked(a, b, axis) {
    const h = nh(), ca = center(a), cb = center(b);
    return state.nodes.some((n) => {
      if (n === a || n === b) return false;
      const c = center(n);
      if (axis === 'v') return Math.abs(c.x - ca.x) < W * 0.75 && c.y > Math.min(ca.y, cb.y) + 2 && c.y < Math.max(ca.y, cb.y) - 2;
      return Math.abs(c.y - ca.y) < h && c.x > Math.min(ca.x, cb.x) + 2 && c.x < Math.max(ca.x, cb.x) - 2;
    });
  }
  function sidesFor(a, b) {
    const h = nh(), ca = center(a), cb = center(b), dx = cb.x - ca.x, dy = cb.y - ca.y;
    if (Math.abs(dx) < W * 0.75) {
      if (Math.abs(dy) < h) return dx >= 0 ? ['R', 'L'] : ['L', 'R'];
      if (blocked(a, b, 'v')) return ['R', 'R'];
      return dy > 0 ? ['B', 'T'] : ['T', 'B'];
    }
    if (Math.abs(dy) < h * 0.75 && blocked(a, b, 'h')) return ['B', 'B'];
    return dx > 0 ? ['R', 'L'] : ['L', 'R'];
  }
  function portPoint(n, s, off) {
    const h = nh();
    if (s === 'R') return { x: n.x + W, y: n.y + h / 2 + off };
    if (s === 'L') return { x: n.x, y: n.y + h / 2 + off };
    if (s === 'T') return { x: n.x + W / 2 + off, y: n.y };
    return { x: n.x + W / 2 + off, y: n.y + h };
  }
  function ctrl(p, s, d) {
    if (s === 'R') return { x: p.x + d, y: p.y };
    if (s === 'L') return { x: p.x - d, y: p.y };
    if (s === 'T') return { x: p.x, y: p.y - d };
    return { x: p.x, y: p.y + d };
  }
  function bez(p, t) {
    const u = 1 - t;
    return { x: u * u * u * p[0].x + 3 * u * u * t * p[1].x + 3 * u * t * t * p[2].x + t * t * t * p[3].x,

  }
  function shownLinks(forExport) {
    const onPath = ui.path && !forExport ? new Set(ui.path.links) : null;

  function geometry(links) {
    const h = nh(), ends = new Map(), geo = {};
    links.forEach((l) => {
      const a = byId(l.from), b = byId(l.to), [sa, sb] = sidesFor(a, b);
      geo[l.id] = { a, b, sa, sb, oa: 0, ob: 0 };
      [[a.id + '|' + sa, 'a', b], [b.id + '|' + sb, 'b', a]].forEach(([k, end, other]) => {
        if (!ends.has(k)) ends.set(k, []);
        ends.get(k).push({ l, end, other });
      });
    });
    ends.forEach((arr, k) => {
      const s = k.split('|')[1], horiz = s === 'L' || s === 'R';
      arr.sort((p, q) => (horiz ? p.other.y - q.other.y : p.other.x - q.other.x) || (p.l.id < q.l.id ? -1 : 1));
      const len = horiz ? h - 18 : W - 40, cnt = arr.length;
      const sp = cnt > 1 ? Math.min(horiz ? 10 : 18, len / (cnt - 1)) : 0;
      arr.forEach((e, i) => { geo[e.l.id][e.end === 'a' ? 'oa' : 'ob'] = (i - (cnt - 1) / 2) * sp; });
    });
    Object.values(geo).forEach((g) => {
      const A = portPoint(g.a, g.sa, g.oa), B = portPoint(g.b, g.sb, g.ob);
      let d;
      if (g.sa === g.sb) d = (g.sa === 'R' || g.sa === 'L') ? 34 + Math.min(60, Math.abs(B.y - A.y) * 0.12) : 26 + Math.min(50, Math.abs(B.x - A.x) * 0.08);
      else d = clamp(Math.abs((g.sa === 'R' || g.sa === 'L') ? B.x - A.x : B.y - A.y) * 0.5, 18, 160);
      g.p = [A, ctrl(A, g.sa, d), ctrl(B, g.sb, d), B];
      const f = (v) => v.toFixed(1);
      g.d = `M${f(A.x)} ${f(A.y)}C${f(g.p[1].x)} ${f(g.p[1].y)} ${f(g.p[2].x)} ${f(g.p[2].y)} ${f(B.x)} ${f(B.y)}`;
    });
    return geo;
  }

  /* ---------- dessin ---------- */
  function zonesMarkup(forExport) {

<rect class="zbox" width="${z.w}" height="${z.h}" rx="12"/>
<path class="zhead" data-kind="zonehead" data-id="${esc(z.id)}" d="M0 12a12 12 0 0 1 12-12h${Math.max(0, z.w - 24)}a12 12 0 0 1 12 12v40H0z"/>

    }).join('');

  function freeSpot(g, ts, wpx, hpx, rects) {
    for (const t of ts) {
      const m = bez(g.p, t);
      const box = { x: m.x - wpx / 2, y: m.y - hpx / 2, w: wpx, h: hpx };
      if (!rects.some((r) => box.x < r.x + r.w && box.x + box.w > r.x && box.y < r.y + r.h && box.y + box.h > r.y)) return m;

  function linksMarkup(forExport) {

      const g = geo[l.id], st = STATUS[l.status] || STATUS.suppose;

      let extra = '';

        extra += lab(l.fromPort, [0.16, 0.24, 0.32, 0.4]) + lab(l.toPort, [0.84, 0.76, 0.68, 0.6]);
        if (l.label) {
          const f = fitText(l.label, 'mtext', 170), wpx = f.w + 18, m = freeSpot(g, [0.5, 0.4, 0.6, 0.3, 0.7, 0.22, 0.78], wpx, 20, rects);
          if (m) extra += `<rect class="mpill" x="${(m.x - wpx / 2).toFixed(1)}" y="${(m.y - 10).toFixed(1)}" width="${wpx.toFixed(1)}" height="20" rx="10"/>${svgText(l.label, 'mtext', m.x.toFixed(1), (m.y + 4).toFixed(1), 170, ' text-anchor="middle"')}`;

      if (l.status === 'verifier' && !(path && pi < 0) && !extra.includes('class="mpill"')) {
        const m = freeSpot(g, [0.5, 0.4, 0.6, 0.3, 0.7], 18, 18, rects) || bez(g.p, 0.5);
        extra += `<circle class="vmark" cx="${m.x.toFixed(1)}" cy="${m.y.toFixed(1)}" r="8"/><text class="vmark-t" x="${m.x.toFixed(1)}" y="${(m.y + 4.2).toFixed(1)}" text-anchor="middle">?</text>`;

      const tip = `${(CABLES[l.cable] || CABLES.other).label} · ${byId(l.from).label} → ${byId(l.to).label} · ${st.label}`;
      return `<g class="link${sel}${cls}" data-kind="link" data-id="${esc(l.id)}"><title>${esc(tip)}</title>
<path class="lhit" d="${g.d}"/><path class="lcase" d="${g.d}"/><path class="lcore" d="${g.d}" stroke="${esc(cableColor(l))}"${dash}${l.cable === 'power' && pi < 0 ? ' stroke-width="2.6"' : ''}/>${flow}${extra}</g>`;
    }).join('');
  }
  function nodesMarkup(forExport) {

      const alert = n.alert ? `<circle class="nalert" cx="${W - 4}" cy="4" r="10"/><text class="nalert-t" x="${W - 4}" y="8.6" text-anchor="middle">!</text>` : '';

<title>${esc(n.label + ' — ' + explainOf(n) + (n.alert ? '\n⚠ ' + n.alert : ''))}</title>
<rect class="nbox" width="${W}" height="${h}" rx="9"/>
<rect class="ntile cat-${t.cat}" x="10" y="${tileY}" width="40" height="40" rx="7"/>
<path class="nicon cat-${t.cat}" transform="translate(18 ${tileY + 8})" d="${ICONS[t.icon] || ICONS.other}"/>

  }

  function renderCanvas() {
    $('#layerZones').innerHTML = zonesMarkup(false);

    $('#layerNodes').innerHTML = nodesMarkup(false);
    applyView();
  }
  function applyView() {

    $('#zoomTag').textContent = Math.round(v.k * 100) + ' %';
  }
  function bounds() {
    const h = nh(), xs = [], ys = [];
    state.zones.forEach((z) => { xs.push(z.x, z.x + z.w); ys.push(z.y, z.y + z.h); });
    state.nodes.forEach((n) => { xs.push(n.x, n.x + W); ys.push(n.y, n.y + h); });
    if (!xs.length) return { x: 0, y: 0, w: 800, h: 500 };
    const x = Math.min(...xs), y = Math.min(...ys);
    return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
  }
  function fit() {
    const r = $('#board').getBoundingClientRect();
    if (r.width < 60 || r.height < 60) return;
    const b = bounds(), pad = 16;
    const k = clamp(Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h), 0.2, 1.8);
    ui.view = { k, x: (r.width - b.w * k) / 2 - b.x * k, y: Math.min(pad, (r.height - b.h * k) / 2) - b.y * k };
    ui.userView = false;
    applyView();
  }
  function fitBounds(b) {
    const r = $('#board').getBoundingClientRect(), pad = 28;
    const side = r.width > 700, insetR = side ? Math.min(400, r.width * 0.5) + 10 : 0, insetB = side ? 0 : r.height * 0.64;
    const aw = r.width - insetR - pad * 2, ah = r.height - insetB - pad * 2;
    if (aw < 80 || ah < 80) return;
    const k = clamp(Math.min(aw / b.w, ah / b.h), 0.2, 1.2);
    ui.view = { k, x: pad + (aw - b.w * k) / 2 - b.x * k, y: pad + (ah - b.h * k) / 2 - b.y * k };
    ui.userView = true;
    applyView();
  }
  function zoomAt(f, sx, sy) {
    const r = $('#board').getBoundingClientRect();
    if (sx == null) { sx = r.width / 2; sy = r.height / 2; }
    const v = ui.view, k = clamp(v.k * f, 0.2, 3);
    const wx = (sx - v.x) / v.k, wy = (sy - v.y) / v.k;
    ui.view = { k, x: sx - wx * k, y: sy - wy * k };
    ui.userView = true;
    applyView();
  }
  function toWorld(e) {
    const r = $('#board').getBoundingClientRect(), v = ui.view;

  }
  function viewCenter() {
    const r = $('#board').getBoundingClientRect(), v = ui.view;

  }
  function reveal(n) {
    const r = $('#board').getBoundingClientRect(), v = ui.view, h = nh();
    const sx = n.x * v.k + v.x, sy = n.y * v.k + v.y;
    const rightLimit = r.width - (ui.sel || ui.path || ui.panel ? Math.min(400, r.width * 0.5) : 0);
    if (sx < 0 || sy < 0 || sx + W * v.k > rightLimit || sy + h * v.k > r.height) {

  /* ---------- trajets ---------- */
  function computePath(fromId, toId) {
    const dist = {}, prev = {}, done = new Set(), adj = {};
    state.nodes.forEach((n) => { dist[n.id] = Infinity; adj[n.id] = []; });
    if (!(fromId in dist) || !(toId in dist)) return null;
    state.links.forEach((l) => {
      if (l.cable === 'power' || !adj[l.from] || !adj[l.to]) return;
      const w = 1 + (l.status === 'suppose' ? 0.2 : l.status === 'verifier' ? 0.5 : 0);
      adj[l.from].push([l.to, l, w]); adj[l.to].push([l.from, l, w]);
    });
    dist[fromId] = 0;
    for (;;) {
      let u = null, best = Infinity;
      Object.keys(dist).forEach((id) => { if (!done.has(id) && dist[id] < best) { best = dist[id]; u = id; } });
      if (u === null || u === toId) break;
      done.add(u);
      adj[u].forEach(([v, l, w]) => { if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = { u, l }; } });
    }
    if (dist[toId] === Infinity) return null;
    const nodes = [toId], links = [];
    let c = toId;
    while (c !== fromId) { const p = prev[c]; links.unshift(p.l.id); nodes.unshift(p.u); c = p.u; }
    return { from: fromId, to: toId, nodes, links };
  }
  function showPath(fromId, toId) {
    const p = computePath(fromId, toId);
    if (!p) { toast('Aucun câble ne relie ces deux équipements sur le schéma.'); return; }
    if (!ui.path) ui.autoBefore = !ui.userView;
    ui.path = p; ui.sel = null; ui.panel = null;
    if (ui.mode === 'link') setMode('select');
    hideGuide(); renderCanvas(); renderInspector();
    const ns = p.nodes.map(byId), hh = nh();
    const x0 = Math.min(...ns.map((n) => n.x)), y0 = Math.min(...ns.map((n) => n.y));
    fitBounds({ x: x0 - 20, y: y0 - 20, w: Math.max(...ns.map((n) => n.x + W)) - x0 + 40, h: Math.max(...ns.map((n) => n.y + hh)) - y0 + 40 });
    say(`Trajet en ${p.nodes.length} étapes affiché.`);
  }
  function demoPath() {
    const from = state.nodes.find((n) => n.type === 'users') || state.nodes.find((n) => n.type === 'tower');
    const to = state.nodes.find((n) => n.type === 'internet');
    if (!from || !to) { toast('Il faut un équipement « Postes utilisateurs » et un « Internet » sur le schéma.'); return; }
    showPath(from.id, to.id);
  }

  /* ---------- interactions sur le plan ---------- */
  function bindBoard() {
    const svg = $('#board');
    svg.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const hit = e.target.closest('[data-kind]');
      const kind = hit ? hit.dataset.kind : 'bg', id = hit ? hit.dataset.id : null;
      const w = toWorld(e);
      const base = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false, snap: snapshot() };
      if (kind === 'node') {
        const n = byId(id);
        ui.drag = Object.assign(base, { kind, id, ox: n.x, oy: n.y, wx: w.x, wy: w.y });
      } else if (kind === 'link') {
        ui.drag = Object.assign(base, { kind, id });
      } else if (kind === 'zonehead') {
        const z = zoneById(id), h = nh();
        const inside = state.nodes.filter((n) => n.x + W / 2 > z.x && n.x + W / 2 < z.x + z.w && n.y + h / 2 > z.y && n.y + h / 2 < z.y + z.h).map((n) => ({ n, x: n.x, y: n.y }));
        ui.drag = Object.assign(base, { kind, id, ox: z.x, oy: z.y, wx: w.x, wy: w.y, inside });
      } else if (kind === 'zoneresize') {
        const z = zoneById(id);
        ui.drag = Object.assign(base, { kind, id, ow: z.w, oh: z.h, wx: w.x, wy: w.y });
      } else {
        ui.drag = Object.assign(base, { kind: 'pan', vx: ui.view.x, vy: ui.view.y });
        svg.classList.add('panning');
      }
      try { svg.setPointerCapture(e.pointerId); } catch (err) { /* capture indisponible */ }
    });
    svg.addEventListener('pointermove', (e) => {
      const d = ui.drag;
      if (!d || d.pid !== e.pointerId) return;
      const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
      if (!d.moved && Math.hypot(dx, dy) < 4) return;
      d.moved = true;
      const w = toWorld(e);
      if (d.kind === 'pan') { ui.view.x = d.vx + dx; ui.view.y = d.vy + dy; ui.userView = true; applyView(); return; }
      if (d.kind === 'node' && ui.mode === 'select') {
        const n = byId(d.id); n.x = snap(d.ox + w.x - d.wx); n.y = snap(d.oy + w.y - d.wy);
        $('#layerLinks').innerHTML = linksMarkup(false); $('#layerNodes').innerHTML = nodesMarkup(false);
      } else if (d.kind === 'zonehead') {
        const z = zoneById(d.id), ddx = snap(w.x - d.wx), ddy = snap(w.y - d.wy);
        z.x = d.ox + ddx; z.y = d.oy + ddy;
        d.inside.forEach((it) => { it.n.x = it.x + ddx; it.n.y = it.y + ddy; });
        renderCanvas();
      } else if (d.kind === 'zoneresize') {
        const z = zoneById(d.id); z.w = Math.max(200, snap(d.ow + w.x - d.wx)); z.h = Math.max(100, snap(d.oh + w.y - d.wy));
        $('#layerZones').innerHTML = zonesMarkup(false);
      }
    });
    const end = (e) => {
      const d = ui.drag;
      if (!d || d.pid !== e.pointerId) return;
      ui.drag = null; svg.classList.remove('panning');
      const linkTap = ui.mode === 'link' && d.kind === 'node';
      if (d.moved && !linkTap) { if (d.kind !== 'pan') { commit(d.snap); if (d.kind === 'node') select({ kind: 'node', id: d.id }, true); } return; }
      if (e.type === 'pointercancel') return;
      clickOn(d.kind, d.id);
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('wheel', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      const r = svg.getBoundingClientRect();
      zoomAt(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
  }
  function clickOn(kind, id) {

      if (!ui.linkFrom) { ui.linkFrom = id; renderCanvas(); renderModeHint(); return; }
      if (ui.linkFrom === id) { ui.linkFrom = null; renderCanvas(); renderModeHint(); return; }
      addLink(ui.linkFrom, id, prefs.cable);
      return;
    }
    if (ui.guide) hideGuide();
    if (kind === 'node' || kind === 'link') select({ kind, id });
    else if (kind === 'zonehead' || kind === 'zoneresize') select({ kind: 'zone', id });

  }
  function select(sel, keepInspector) {

  function renderModeHint() {

  function hideGuide() { ui.guide = false; prefs.guideSeen = true; savePrefs(); renderGuide(); }

  function addLink(from, to, cable) {
    const snap0 = snapshot();
    const l = { id: uid('l'), from, to, cable, color: '', fromPort: '', toPort: '', label: '', status: 'suppose', notes: '' };
    state.links.push(l);

  function addNode(type) {

    const n = { id: uid('n'), type, label: t.label, sub: '', explain: '', x: snap(c.x - W / 2), y: snap(c.y - nh() / 2), status: 'suppose', video: '', ip: '', notes: '', alert: '' };

  function addZone() {

  function removeSelected() {
    if (!ui.sel) return;

  /* ---------- panneau de détails ---------- */
  const closeBtn = '<button type="button" class="x" data-act="close" aria-label="Fermer le panneau">×</button>';
  function statusRadios(cur, name) {
    return `<fieldset class="seg"><legend>Statut</legend><div class="seg-row">${Object.entries(STATUS).map(([k, s]) =>
      `<label><input type="radio" name="${name}" id="${name}-${k}" data-f="status" value="${k}"${cur === k ? ' checked' : ''}>${esc(s.label)}</label>`).join('')}</div></fieldset>`;
  }
  function renderInspector() {
    const box = $('#insp');
    let mode = null;
    if (ui.path) mode = 'path';
    else if (ui.sel && ui.sel.kind === 'node' && byId(ui.sel.id)) mode = 'node';
    else if (ui.sel && ui.sel.kind === 'link' && linkById(ui.sel.id)) mode = 'link';
    else if (ui.sel && ui.sel.kind === 'zone' && zoneById(ui.sel.id)) mode = 'zone';
    else if (ui.panel === 'overview') mode = 'overview';
    box.hidden = !mode;
    $('#tOverview').classList.toggle('on', mode === 'overview');
    if (!mode) { box.innerHTML = ''; return; }
    if (mode === 'path') return inspectPath(box);
    if (mode === 'node') return inspectNode(box, byId(ui.sel.id));
    if (mode === 'link') return inspectLink(box, linkById(ui.sel.id));
    if (mode === 'zone') return inspectZone(box, zoneById(ui.sel.id));
    inspectOverview(box);
  }
  function inspectPath(box) {
    const p = ui.path, a = byId(p.from), b = byId(p.to);
    let html = '';
    p.nodes.forEach((id, i) => {
      const n = byId(id);
      html += `<li class="step"><span class="num">${i + 1}</span><div><button type="button" data-step="${esc(id)}">${esc(n.label)}</button>${n.status === 'verifier' ? '<span class="tag">à vérifier</span>' : ''}<p>${esc(explainOf(n))}</p></div></li>`;
      if (i < p.links.length) {
        const l = linkById(p.links[i]);
        html += `<li class="hop"><i style="--c:${esc(cableColor(l))}"></i><span>câble ${esc(CABLES[l.cable].label.toLowerCase())} · ${esc(STATUS[l.status].label.toLowerCase())}</span></li>`;
      }
    });
    const unsure = p.links.some((id) => linkById(id).status !== 'observe');
    box.innerHTML = `
<div class="insp-top"><div class="insp-head"><span class="kind">Trajet des données · ${p.nodes.length} étapes</span><h3>${esc(a.label)} → ${esc(b.label)}</h3></div>${closeBtn}</div>

  function selectedObj() {
    const s = ui.sel; if (!s) return null;
    return s.kind === 'node' ? byId(s.id) : s.kind === 'link' ? linkById(s.id) : zoneById(s.id);
  }
  function bindInspector() {
    const box = $('#insp');
    box.addEventListener('pointerdown', (e) => e.stopPropagation());
    box.addEventListener('focusin', () => { if (ui.pendingSnap == null) ui.pendingSnap = snapshot(); });
    box.addEventListener('focusout', () => { setTimeout(() => { if (!box.contains(document.activeElement)) ui.pendingSnap = null; }, 0); });
    box.addEventListener('input', (e) => {
      const f = e.target.dataset.f, o = selectedObj();
      if (!f || !o) return;
      if (ui.pendingSnap == null) ui.pendingSnap = snapshot();
      const v = e.target.value;
      if ((f === 'from' || f === 'to') && (v === (f === 'from' ? o.to : o.from))) { e.target.value = o[f]; say('Un câble doit relier deux équipements différents.'); return; }
      o[f] = v;
      if (f === 'label' && ui.sel.kind !== 'link' && $('#inspTitle')) $('#inspTitle').textContent = v;
      renderCanvas(); renderStatus();
    });
    box.addEventListener('change', (e) => {
      const f = e.target.dataset.f;
      if (!f) return;
      if (ui.pendingSnap != null) { commit(ui.pendingSnap); ui.pendingSnap = snapshot(); }
      if (['cable', 'color', 'from', 'to', 'type', 'status'].includes(f)) { renderLegend(); renderInspector(); }
    });
    box.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const o = selectedObj();
      if (b.dataset.gotoNode) return focusItem('node', b.dataset.gotoNode);
      if (b.dataset.gotoLink) return focusItem('link', b.dataset.gotoLink);
      if (b.dataset.step) { const n = byId(b.dataset.step); if (n) reveal(n); return; }
      if (b.dataset.color && o) { const s0 = snapshot(); o.color = b.dataset.color.toLowerCase() === CABLES[o.cable].color.toLowerCase() ? '' : b.dataset.color; commit(s0); renderCanvas(); renderInspector(); return; }
      const act = b.dataset.act; if (!act) return;
      if (act === 'close') return closeDrawer();
      if (act === 'demo') return demoPath();
      if (act === 'path' && o) return showPath(o.id, $('#f-pathto').value);
      if (act === 'colorreset' && o) { const s0 = snapshot(); o.color = ''; commit(s0); renderCanvas(); renderInspector(); }
      if (act === 'swap' && o) { const s0 = snapshot(); [o.from, o.to] = [o.to, o.from]; [o.fromPort, o.toPort] = [o.toPort, o.fromPort]; commit(s0); renderCanvas(); renderInspector(); }
      if (act === 'del') removeSelected();
      if (act === 'dup' && o) { const s0 = snapshot(); const c = Object.assign({}, o, { id: uid('n'), label: o.label + ' (copie)', x: o.x + 20, y: o.y + nh() + 20 }); state.nodes.push(c); commit(s0); select({ kind: 'node', id: c.id }); }
      if (act === 'linkfrom' && o) { setMode('link'); ui.linkFrom = o.id; renderCanvas(); renderModeHint(); }
      if (act === 'addlink' && o) { const to = $('#f-newto').value, cb = $('#f-newcable').value; if (to) { prefs.cable = cb; savePrefs(); $('#tCable').value = cb; syncCableSwatch(); addLink(o.id, to, cb); } }
    });
  }
  function focusItem(kind, id) {
    setTab('schema');
    if (kind === 'link') { const l = linkById(id); if (l && prefs.hidden.includes(l.cable)) { prefs.hidden = prefs.hidden.filter((c) => c !== l.cable); savePrefs(); renderLegend(); } }
    select({ kind, id });
    const n = kind === 'node' ? byId(id) : null;
    if (n) requestAnimationFrame(() => reveal(n));
  }

    document.documentElement.classList.toggle('d8-full', t === 'schema');
    $$('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    ['schema', 'video', 'checks', 'colors', 'gloss'].forEach((k) => { $('#p-' + k).hidden = k !== t; });
    if (t === 'schema') requestAnimationFrame(() => { fitCache.clear(); renderCanvas(); if (!ui.userView) fit(); });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  }
  function renderStatus() {
    const chip = $('#saveState'), btn = $('#btnSave'), dirty = isDirty();
    $('#updated').textContent = 'Schéma réseau · ' + (state.updatedAt ? 'modifié le ' + fmtDate(state.updatedAt) : 'd’après la vidéo du 2 oct. 2026');
    chip.className = 'chip';
    if (cap.readOnly) { chip.classList.add('ro'); chip.textContent = 'Lecture seule'; btn.textContent = 'Exporter le JSON'; btn.disabled = false; return; }
    if (cap.saving) { chip.textContent = 'Enregistrement…'; btn.disabled = true; return; }
    if (cap.inViewer && !cap.resolved) { chip.textContent = dirty ? 'Modifié' : 'Connexion…'; btn.disabled = true; btn.textContent = 'Enregistrer'; return; }
    if (cap.artifact) {
      btn.textContent = 'Enregistrer'; btn.disabled = !dirty;
      if (dirty) { chip.classList.add('dirty'); chip.textContent = 'Modifications non enregistrées'; }
      else { chip.classList.add('ok'); chip.textContent = 'Enregistré'; }
      return;
    }
    btn.disabled = false;
    btn.textContent = cap.inViewer ? 'Exporter le JSON' : 'Télécharger le HTML';
    if (dirty) { chip.classList.add('dirty'); chip.textContent = cap.inViewer ? 'Non enregistré ici · exporte' : 'Brouillon local · télécharge le HTML'; }
    else { chip.textContent = cap.inViewer ? 'Enregistrement indisponible ici' : 'Fichier local'; }
  }
  function renderUndo() { $('#tUndo').disabled = !undoStack.length; $('#tRedo').disabled = !redoStack.length; }
  function toast(msg) {
    let t = $('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); }
    (document.fullscreenElement || document.body).appendChild(t);
    t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3600);
  }
  function say(msg) { $('#live').textContent = msg; }

  /* ---------- enregistrement ---------- */
  function resetCss() {
    const st = Array.from(document.head ? document.head.querySelectorAll('style') : []).find((s) => s.textContent.indexOf('safe-area-inset') > -1);
    return st ? st.textContent : DEFAULT_RESET;
  }
  function buildDocument(st) {
    const css = document.getElementById('d8-css').textContent;
    const js = document.getElementById('d8-app').textContent;
    const json = JSON.stringify(st).replace(/</g, '\\u003c').replace(/[\u2028\u2029]/g, (c) => '\\u' + c.charCodeAt(0).toString(16));
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetCss() + '</style></head><body>\n' +
      '<title>' + TITLE + '</title>\n<style id="d8-css">' + css + '</style>\n' + FONT_LINK + '\n<div id="root"></div>\n' +
      '<script type="application/json" id="d8-state">' + json + '<\/script>\n<script id="d8-app">' + js + '<\/script>\n\n</body></html>';
  }
  async function save() {
    if (cap.saving) return;
    if (!cap.artifact || cap.readOnly) {
      if (cap.inViewer) return exportAs('json');
      return exportAs('html');
    }
    if (!isDirty()) return;
    const next = JSON.parse(snapshot()); next.updatedAt = new Date().toISOString();
    cap.saving = true; renderStatus();
    store.set('d8-schema-stash', { tab: prefs.tab, sel: ui.sel }, true);
    store.set(DRAFT_KEY, { at: Date.now(), state: next });
    const attempt = () => cap.artifact.publish(buildDocument(next));
    try {
      try { await attempt(); }
      catch (e) { if (e && e.code === 'upstream_error') { await new Promise((r) => setTimeout(r, 800 + Math.random() * 900)); await attempt(); } else throw e; }
      state.updatedAt = next.updatedAt; savedJSON = JSON.stringify(state);
      cap.saving = false; renderStatus(); toast('Enregistré. La page se recharge avec la nouvelle version.');
    } catch (e) {
      cap.saving = false;
      const code = e && e.code;
      if (code === 'conflict') toast('Une autre version vient d’être enregistrée : la page se recharge. Tes modifications restent en brouillon.');
      else if (['not_writer', 'not_granted', 'consent_required', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { cap.readOnly = true; toast('Cette vue est en lecture seule : exporte tes modifications en JSON.'); }
      else if (code === 'too_large') toast('Le schéma est trop volumineux pour être enregistré. Exporte-le en JSON.');
      else if (code === 'rate_limited') toast('Trop d’enregistrements rapprochés : réessaie dans un moment.');
      else toast('L’enregistrement a échoué. Tes modifications sont gardées en brouillon sur ce poste.');
      renderStatus();
    }
  }

  /* ---------- export / import ---------- */
  const EXPORT_CSS = `.zbox{fill:#FBFCFC;stroke:#C4D0CE;stroke-width:1.3}.zhead{fill:#E2EAE8}.zlabel{font:600 16px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.05em;text-transform:uppercase;fill:#152120}.zcap{font:12.5px "Barlow",Arial,sans-serif;fill:#566664}
.lhit{fill:none;stroke:none}.lcase{fill:none;stroke:#fff;stroke-width:7.5;stroke-linecap:round}.lcore{fill:none;stroke-width:3.4;stroke-linecap:round}
.plabel{font:10.5px "IBM Plex Mono",Consolas,monospace;fill:#152120;paint-order:stroke;stroke:#fff;stroke-width:3.5px}.mpill{fill:#fff;stroke:#A9B8B6}.mtext{font:500 11.5px "Barlow",Arial,sans-serif;fill:#152120}
.vmark{fill:#A86A12}.vmark-t{font:700 12px "Barlow Condensed",sans-serif;fill:#fff}
.nbox{fill:#fff;stroke:#A9B8B6;stroke-width:1.5}.st-suppose .nbox{stroke-dasharray:7 4}.st-verifier .nbox{stroke:#A86A12;stroke-dasharray:2 3;stroke-width:1.9}
.ntile{fill-opacity:.15;stroke:none}.nicon{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nlabel{font:600 17px "Barlow Condensed","Arial Narrow",sans-serif;fill:#152120}.nsub{font:12.5px "Barlow",Arial,sans-serif;fill:#566664}.nexpl{font:600 12.5px "Barlow",Arial,sans-serif;fill:#0B6F6D}
.nalert{fill:#BF2F2F}.nalert-t{font:700 13px "Barlow Condensed",sans-serif;fill:#fff}
.ntile.cat-net{fill:#0A7573}.ntile.cat-wan{fill:#BF2F2F}.ntile.cat-srv{fill:#6A4EC6}.ntile.cat-end{fill:#2B69D6}.ntile.cat-pwr{fill:#B8620F}.ntile.cat-env{fill:#178AA0}.ntile.cat-tel{fill:#8A572A}
.nicon.cat-net{stroke:#0A7573}.nicon.cat-wan{stroke:#BF2F2F}.nicon.cat-srv{stroke:#6A4EC6}.nicon.cat-end{stroke:#2B69D6}.nicon.cat-pwr{stroke:#B8620F}.nicon.cat-env{stroke:#178AA0}.nicon.cat-tel{stroke:#8A572A}
.ttl{font:600 28px "Barlow Condensed","Arial Narrow",sans-serif;fill:#152120}.sub{font:12.5px "IBM Plex Mono",Consolas,monospace;fill:#566664}`;
  function exportSvg() {
    const b = bounds(), pad = 30, top = 84;
    const x = b.x - pad, y = b.y - pad - top, w = b.w + pad * 2, h = b.h + pad * 2 + top;
    const used = Object.entries(CABLES).filter(([k]) => state.links.some((l) => l.cable === k));
    const legend = used.map(([k, c], i) =>
      `<g transform="translate(${b.x + (i % 6) * 230} ${b.y - top + 52 + Math.floor(i / 6) * 18})"><line x1="0" y1="-4" x2="24" y2="-4" stroke="${c.color}" stroke-width="4" stroke-linecap="round"/><text class="sub" x="30" y="0">${esc(c.label)}</text></g>`).join('');
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}">
<style>${EXPORT_CSS}</style><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#F5F8F7"/>
<text class="ttl" x="${b.x}" y="${b.y - top + 10}">Salle serveur D8 · schéma réseau</text>
<text class="sub" x="${b.x}" y="${b.y - top + 30}">${esc(state.updatedAt ? 'Modifié le ' + fmtDate(state.updatedAt) : 'Reconstitution d’après la vidéo du 2 oct. 2026')} · trait plein = vu, tirets = supposé, pointillés = à vérifier</text>
${legend}
<g>${zonesMarkup(true)}</g><g>${linksMarkup(true)}</g><g>${nodesMarkup(true)}</g></svg>`;
  }
  function svgToPng(svgText) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const s = 2, c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
        const ctx = c.getContext('2d'); ctx.scale(s, s); ctx.drawImage(img, 0, 0);
        c.toBlob((bl) => bl ? resolve(bl) : reject(new Error('png')), 'image/png');
      };
      img.onerror = reject;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
    });
  }
  async function offerFile(filename, data, mime) {
    if (cap.inViewer) {
      let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
      if (!dl) { toast('Le téléchargement n’est pas disponible dans cette vue.'); return; }
      try { const r = await dl.save({ filename, data }); if (r && r.status === 'saved') toast('Fichier enregistré : ' + filename); }
      catch (e) { if (e && e.code !== 'declined') toast('Le fichier n’a pas pu être proposé (' + (e.code || 'erreur') + ').'); }
      return;
    }
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Fichier téléchargé : ' + filename);
  }
  async function exportAs(kind) {
    $('#exportMenu').open = false;
    const day = new Date().toISOString().slice(0, 10);
    try {
      if (kind === 'json') return offerFile(`schema-salle-serveur-${day}.json`, JSON.stringify(state, null, 2), 'application/json');
      if (kind === 'svg') return offerFile(`schema-salle-serveur-${day}.svg`, exportSvg(), 'image/svg+xml');
      if (kind === 'png') return offerFile(`schema-salle-serveur-${day}.png`, await svgToPng(exportSvg()), 'image/png');
      if (kind === 'html') { const s = JSON.parse(snapshot()); s.updatedAt = new Date().toISOString(); return offerFile('schema-salle-serveur.html', buildDocument(s), 'text/html'); }
    } catch (e) { toast('L’export a échoué.'); }
  }
  function importFile(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const s = JSON.parse(r.result);
        if (!validState(s)) throw new Error('format');
        const s0 = snapshot(); state = normalize(s); ui.sel = null; ui.path = null; commit(s0); renderAll(); fit();
        toast('Schéma importé. Enregistre pour le garder.');
      } catch (e) { toast('Ce fichier n’est pas un export JSON de ce schéma.'); }
    };
    r.readAsText(file);
  }

  /* ---------- brouillon local ---------- */
  function sameContent(a, b) {
    return ['nodes', 'links', 'zones', 'checks', 'notes'].every((k) => JSON.stringify(a[k]) === JSON.stringify(b[k]));
  }
  function checkDraft() {
    const d = store.get(DRAFT_KEY), box = $('#draftBanner');
    if (!d || !d.state || !validState(d.state) || sameContent(d.state, state)) { store.del(DRAFT_KEY); box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<b>Brouillon non enregistré</b><span>Des modifications du ${esc(fmtDate(new Date(d.at).toISOString()))} n’ont pas été enregistrées sur ce poste.</span>
<button type="button" class="btn primary" id="draftUse">Reprendre le brouillon</button><button type="button" class="btn" id="draftDrop">Ignorer</button>`;
    $('#draftUse').onclick = () => { const s0 = snapshot(); state = normalize(d.state); commit(s0); box.hidden = true; renderAll(); fit(); };
    $('#draftDrop').onclick = () => { store.del(DRAFT_KEY); box.hidden = true; };
  }

  /* ---------- assemblage ---------- */
  function renderAll() { renderCanvas(); renderInspector(); renderLegend(); renderChecks(); renderStatus(); renderUndo(); renderGuide(); }
  function bindGlobal() {
    $$('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
    $('#tSelect').onclick = () => setMode('select');
    $('#tLink').onclick = () => setMode(ui.mode === 'link' ? 'select' : 'link');
    $('#tCable').value = prefs.cable; syncCableSwatch();
    $('#tCable').onchange = (e) => { prefs.cable = e.target.value; savePrefs(); syncCableSwatch(); renderModeHint(); };
    $('#tAdd').onchange = (e) => { if (e.target.value) { addNode(e.target.value); e.target.value = ''; } };
    $('#tZone').onclick = addZone;
    $('#tUndo').onclick = undo; $('#tRedo').onclick = redo;
    $('#tZoomIn').onclick = () => zoomAt(1.2); $('#tZoomOut').onclick = () => zoomAt(1 / 1.2); $('#tFit').onclick = fit;
    $('#tPorts').checked = prefs.ports;
    $('#tPorts').onchange = (e) => { prefs.ports = e.target.checked; savePrefs(); renderCanvas(); };
    $('#tExplain').checked = prefs.explain;
    $('#tExplain').onchange = (e) => { prefs.explain = e.target.checked; savePrefs(); renderCanvas(); if (!ui.userView) fit(); };
    $('#tDemo').onclick = demoPath;
    $('#tOverview').onclick = () => { if (ui.panel === 'overview') closeDrawer(); else { ui.sel = null; ui.path = null; ui.panel = 'overview'; renderCanvas(); renderInspector(); } };
    $('#tHelp').onclick = () => { ui.guide = !ui.guide; renderGuide(); };
    $('#guide').addEventListener('pointerdown', (e) => e.stopPropagation());
    $('#guide').addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      hideGuide();
      if (b.dataset.act === 'demo') demoPath();
    });
    const full = $('#tFull'), ps = $('#p-schema');
    if (document.fullscreenEnabled && ps.requestFullscreen) {
      full.hidden = false;
      full.onclick = () => {
        if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
        ps.requestFullscreen().catch(() => toast('Le plein écran n’est pas disponible ici.'));
      };
      document.addEventListener('fullscreenchange', () => {
        full.textContent = document.fullscreenElement ? 'Quitter le plein écran' : 'Plein écran';
        full.classList.toggle('on', !!document.fullscreenElement);
      });
    }
    $('#legend').addEventListener('click', (e) => {
      const b = e.target.closest('[data-cable]'); if (!b) return;
      const k = b.dataset.cable; prefs.hidden = prefs.hidden.includes(k) ? prefs.hidden.filter((c) => c !== k) : prefs.hidden.concat(k);
      savePrefs(); renderLegend(); renderCanvas();
    });
    $('#btnSave').onclick = save;
    $('#exportMenu').addEventListener('click', (e) => { const b = e.target.closest('[data-export]'); if (b) exportAs(b.dataset.export); });
    $('#btnImport').onclick = () => $('#fileImport').click();
    $('#fileImport').onchange = (e) => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ''; };
    $('#p-video').addEventListener('click', (e) => { const b = e.target.closest('[data-goto-node]'); if (b) focusItem('node', b.dataset.gotoNode); });
    $('#p-checks').addEventListener('change', (e) => {
      if (e.target.id === 'hideDone') { prefs.hideDone = e.target.checked; savePrefs(); renderChecks(); return; }
      const id = e.target.dataset.check; if (!id) return;
      const s0 = snapshot(); if (e.target.checked) state.checks[id] = true; else delete state.checks[id];
      commit(s0); renderChecks();
      const el = $('#chk-' + id); if (el) el.focus();
    });
    let notesSnap = null;
    $('#p-checks').addEventListener('focusin', (e) => { if (e.target.id === 'freeNotes') notesSnap = snapshot(); });
    $('#p-checks').addEventListener('input', (e) => { if (e.target.id === 'freeNotes') { state.notes = e.target.value; renderStatus(); } });
    $('#p-checks').addEventListener('focusout', (e) => { if (e.target.id === 'freeNotes' && notesSnap) { commit(notesSnap); notesSnap = null; } });
    document.addEventListener('keydown', (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
      if (typing) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
      if (prefs.tab !== 'schema') return;
      if (e.key === 'Escape') { if (ui.mode === 'link') setMode('select'); else if (ui.sel || ui.path || ui.panel) closeDrawer(); else if (ui.guide) hideGuide(); }
      if ((e.key === 'Delete' || e.key === 'Backspace') && ui.sel) { e.preventDefault(); removeSelected(); }
      if (e.key.toLowerCase() === 'l' && !e.ctrlKey && !e.metaKey && !e.altKey) setMode(ui.mode === 'link' ? 'select' : 'link');
    });
    document.addEventListener('click', (e) => { const m = $('#exportMenu'); if (m.open && !m.contains(e.target)) m.open = false; });
    window.addEventListener('beforeunload', (e) => { if (isDirty() && !cap.saving && !cap.artifact) { e.preventDefault(); e.returnValue = ''; } });
    const onResize = () => { if (prefs.tab !== 'schema') return; if (!ui.userView) fit(); else applyView(); };
    if (window.ResizeObserver) new ResizeObserver(onResize).observe($('#canvasWrap'));
    else window.addEventListener('resize', onResize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitCache.clear(); if (prefs.tab === 'schema') renderCanvas(); });
  }
  function initCapabilities() {
    if (!cap.inViewer) { cap.resolved = true; renderStatus(); return; }
    let p; try { p = window.claude.use('artifact'); } catch (e) { p = Promise.resolve(null); }
    Promise.resolve(p).then((a) => { cap.artifact = a || null; }).catch(() => { cap.artifact = null; })
      .then(() => { cap.resolved = true; renderStatus(); });
  }

  function start() {
    document.getElementById('root').innerHTML = shell();
    renderVideo(); renderColors(); renderGloss();
    bindBoard(); bindInspector(); bindGlobal();
    setTab(prefs.tab || 'schema');
    renderAll();
    checkDraft();
    initCapabilities();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>

</body></html>
