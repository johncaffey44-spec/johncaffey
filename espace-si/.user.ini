; D8 · Espace SI — réglages PHP propres à ce dossier.
; Lus par PHP en FastCGI / PHP-FPM (cas d'IIS et des NAS). Sans effet avec mod_php (Apache) : rien d'indispensable ici.
; Les fichiers joints sont envoyés par morceaux de 4 Mo : aucun réglage de taille n'est obligatoire.
post_max_size = 16M
upload_max_filesize = 16M
max_execution_time = 120
memory_limit = 256M
default_charset = "UTF-8"
date.timezone = "Europe/Paris"
