  'task-done': el => { const t = D.get('tasks', el.dataset.id); if (t) Tasks.toggle(t); }
});

/* ------------------------------ messagerie ------------------------------ */
const Chat = {
  cur: null, drafts: {}, pend: [], replyTo: null, editing: null, lastTyping: 0, openAt: {}, infoOn: false, filter: '', idx: null, lastSnd: 0, readBusy: 0, chSearch: '',
  all() { return D.all('messages'); },
  index() {
    if (this.idx) return this.idx;
    const m = new Map();
    for (const x of D.all('messages')) { const l = m.get(x.ch); l ? l.push(x) : m.set(x.ch, [x]); }
    for (const l of m.values()) l.sort((a, b) => (a.at || '').localeCompare(b.at || ''));
    return this.idx = m;
  },
  msgs(ch) { return this.index().get(ch) || []; },
  channels() {
    return D.all('channels').filter(c => canSee('channels', c, cx())).sort((a, b) => {
      const o = c => c.id === 'ch_general' ? 0 : c.kind === 'public' ? 1 : 2;
      return o(a) - o(b) || this.label(a).localeCompare(this.label(b), 'fr');
    });
  },
  others(ch) { return arr(ch.members).filter(u => u !== D.me); },
  label(ch) {
    if (!ch) return '';
    if (ch.kind === 'public') return ch.name;
    if (ch.name) return ch.name;
    const o = this.others(ch);
    return o.length ? o.map(u => o.length > 1 ? fname(u) : uname(u)).join(', ') : uname(D.me) + ' (moi)';
  },
  readAt(ch) { const r = D.get('reads', 'r_' + D.me); return obj(r && r.ch)[ch] || ''; },
  muted(ch) { return !!obj(prefs().muted)[ch]; },
  unread(ch) { const r = this.readAt(ch); let n = 0; for (const m of this.msgs(ch)) if (m.from !== D.me && (m.at || '') > r) n++; return n; },
  mentioned(ch) { const r = this.readAt(ch); return this.msgs(ch).some(m => m.from !== D.me && (m.at || '') > r && (arr(m.mentions).includes(D.me) || arr(m.mentions).includes('*'))); },
  unreadTotal() { return this.channels().reduce((s, c) => s + (this.muted(c.id) && !this.mentioned(c.id) ? 0 : this.unread(c.id)), 0); },
  mentionTotal() { return this.channels().filter(c => (c.kind !== 'public' && this.unread(c.id)) || this.mentioned(c.id)).length; },
  markRead(ch = this.cur) {
    if (!ch || route().seg[0] !== 'chat' || document.hidden) return;
    const l = this.msgs(ch), last = l[l.length - 1];
    if (!last || (last.at || '') <= this.readAt(ch) || last._pending) return;
    clearTimeout(this.readBusy);
    this.readBusy = setTimeout(() => save('reads', 'r_' + D.me, { map: { ch: { [ch]: last.at } } }), 400);
  },
  onNew(m) {
    if (m.from === D.me || m.kind === 'call') return;
    const ch = D.get('channels', m.ch); if (!ch) return;
    if (Date.now() - (toDate(m.at) || 0) > 15 * 60000) return;
    const mention = arr(m.mentions).includes(D.me) || arr(m.mentions).includes('*'), direct = ch.kind !== 'public';
    const viewing = route().seg[0] === 'chat' && this.cur === m.ch && !document.hidden && document.hasFocus();
    if (viewing) { this.markRead(); return; }
    if (this.muted(m.ch) && !mention) return;
    if (Date.now() - this.lastSnd > 1500) { this.lastSnd = Date.now(); Snd.play(mention || direct ? 'mention' : 'message'); }
    const txt = plain(m.text) || (arr(m.files).length ? '📎 ' + arr(m.files).map(f => f.name).join(', ') : '');
    if (route().seg[0] !== 'chat' || mention || direct)
      toast(txt.slice(0, 140), mention ? 'warn' : 'info', null, 7000, { sub: `${fname(m.from)}${direct ? '' : ' · #' + ch.name}${mention ? ' · vous mentionne' : ''}`, icon: av(m.from, 'sm'), onclick: () => go('#/chat/' + m.ch) });
    Notif.show(`${fname(m.from)}${direct ? '' : ' · #' + ch.name}`, txt, '#/chat/' + m.ch, 'ch-' + m.ch);
  },
  dmId(ids) { return 'dm_' + [...new Set(ids)].sort().join('_').replace(/[^A-Za-z0-9_-]/g, ''); },
  async dm(uid) {
    if (uid === D.me) { go('#/chat'); return; }
    const id = this.dmId([D.me, uid]);
    if (!D.get('channels', id)) await save('channels', id, { set: { kind: 'dm', members: [D.me, uid].sort() } });
    go('#/chat/' + id);
  },
  newDM() {
    editForm({
      title: 'Nouvelle conversation', size: 'sm', okLabel: 'Ouvrir',
      fields: [{ k: 'users', l: 'Avec', t: 'users', req: true, help: 'Une personne : message direct. Plusieurs : conversation de groupe privée.' }],
      value: { users: [] },
      onSave: async v => {
        const u = v.users.filter(x => x !== D.me);
        if (!u.length) return false;
        if (u.length === 1) return this.dm(u[0]);
        const id = u.length < 4 ? this.dmId([D.me, ...u]) : uid('grp');
        if (!D.get('channels', id)) await save('channels', id, { set: { kind: 'groupe', members: [D.me, ...u].sort() } });
        go('#/chat/' + id);
      }
    });
  },
  editChannel(id) {
    const c = id ? D.get('channels', id) : null;
    editForm({
      title: c ? 'Modifier le canal' : 'Nouveau canal', size: 'sm',
      fields: [{ k: 'name', l: 'Nom', req: true, ph: 'ex. Réseau, Déploiements…' }, { k: 'topic', l: 'Sujet', ph: 'À quoi sert ce canal ?' },
        ...(c ? [] : [{ k: 'priv', t: 'switch', lbl: 'Canal privé (seulement les membres choisis)' }, { k: 'members', l: 'Membres', t: 'users', show: v => v.priv }])],
      value: c ? { name: c.name, topic: c.topic } : { members: [D.me] },
      onDelete: c && c.id !== 'ch_general' && (c.createdBy === D.me || isAdmin()) ? () => { remove('channels', c.id, 'Canal ' + c.name); go('#/chat'); } : null,
      delAsk: 'Supprimer ce canal et masquer ses messages ?',
      onSave: async v => {
        const nid = c ? c.id : uid('ch');
        const set = { name: v.name, topic: v.topic };
        if (!c) { set.kind = v.priv ? 'groupe' : 'public'; if (v.priv) set.members = [...new Set([D.me, ...v.members])]; }
        await save('channels', nid, { set }, 'Canal ' + v.name);
        go('#/chat/' + nid);
      }
    });
  },
  async searchAll(q) {
    const m = modal({ title: `Messages contenant « ${q} »`, size: 'lg', body: '<div class="empty">Recherche…</div>' });
    let r; try { r = await B.search(q); } catch (e) { $('.mb', m.el).innerHTML = `<div class="bnr danger">${esc(e.message)}</div>`; return; }
    const hits = arr(r.hits);
    $('.mb', m.el).innerHTML = hits.length ? `<div class="list">${hits.map(h => { const ch = D.get('channels', h.ch); return `<a class="li" data-h="${h.id}">${av(h.from, 'sm')}<span class="main"><span class="t1">${esc(fname(h.from))} <span class="mut" style="font-weight:500">· ${esc(ch ? (ch.kind === 'public' ? '#' : '') + this.label(ch) : '')} · ${esc(ago(h.at))}</span></span><span class="t2" style="white-space:normal">${esc(plain(h.text).slice(0, 240))}</span></span></a>`; }).join('')}</div>` : empty('Aucun message trouvé');
    $('.mb', m.el).onclick = e => {
      const a = e.target.closest('[data-h]'); if (!a) return;
      const h = hits.find(x => x.id === a.dataset.h);
      if (!D.raw('messages', h.id)) { D.cols.messages.set(h.id, h); this.idx = null; }
      m.close(); go(`#/chat/${h.ch}?m=${h.id}`);
    };
  },
  /* --- pièces jointes en attente d'envoi --- */
  async addFiles(files) {
    for (let f of files) {
      if (!f) continue;
      if (f.type === 'image/png' && /^image\.png$/i.test(f.name || '')) f = new File([f], `capture-${today()}-${fmtT(new Date()).replace(':', 'h')}.png`, { type: 'image/png' });
      const p = { key: rnd(8), name: f.name, size: f.size, prog: 0, meta: null, err: '', thumb: /^image\//.test(f.type) ? URL.createObjectURL(f) : '' };
      this.pend.push(p); this.drawPend();
      p.promise = (async () => {
        try {
          const s = await shrinkImage(f);
          p.meta = await B.upload(s.file, x => { p.prog = x; this.drawPend(); }, s.w ? { w: s.w, h: s.h } : {});
          if (s.file !== f) { p.name = s.file.name; p.size = s.file.size; }
        } catch (e) { p.err = e.message; toast(e.message, 'danger'); }
        this.drawPend();
      })();
    }
  },
  drawPend() {
    const el = $('#pend'); if (!el) return;
    el.classList.toggle('hide', !this.pend.length);
    el.innerHTML = this.pend.map(p => `<div class="pf" title="${esc(p.name)}">${p.thumb ? `<img src="${p.thumb}" alt="">` : ic('file')}<span class="trunc" style="max-width:120px">${esc(p.name)}</span>
      ${p.err ? `<span class="danger-t">${ic('warn', 'sm')}</span>` : p.meta ? `<span class="ok-t">${ic('check', 'sm')}</span>` : `<span class="bar"><i style="width:${Math.round(p.prog * 100)}%"></i></span>`}
      <button class="ibtn" style="width:22px;height:22px" data-unpend="${p.key}">${ic('x', 'sm')}</button></div>`).join('');
  },
  async send() {
    const ta = $('#ta'); if (!ta) return;
    const text = ta.value.trim(), ch = this.cur;
    if (this.editing) {
      const id = this.editing; this.editing = null;
      if (text) save('messages', id, { set: { text, mentions: mentionsIn(text) } });
      ta.value = ''; this.drawReply(); this.autosize(); return;
    }
    if (this.pend.some(p => !p.meta && !p.err)) { toast('Envoi des fichiers en cours…', 'info', null, 2000); await Promise.all(this.pend.map(p => p.promise)); }
    const files = this.pend.filter(p => p.meta).map(p => p.meta);
    if (!text && !files.length) return;
    const set = { ch, text, files, mentions: mentionsIn(text) };
    if (this.replyTo) set.replyTo = this.replyTo;
    this.pend.forEach(p => p.thumb && URL.revokeObjectURL(p.thumb));
    this.pend = []; this.replyTo = null; ta.value = ''; delete this.drafts[ch];
    this.drawPend(); this.drawReply(); this.autosize();
    this.stick = true;
    const id = msgId();
    await save('messages', id, { set });
    this.markRead();
  },
  autosize() { const ta = $('#ta'); if (!ta) return; ta.style.height = 'auto'; ta.style.height = Math.min(220, ta.scrollHeight) + 'px'; },
  drawReply() {
    const el = $('#replying'); if (!el) return;
    const id = this.editing || this.replyTo, m = id && D.get('messages', id);
    el.classList.toggle('hide', !m);
    el.innerHTML = m ? `${ic(this.editing ? 'edit' : 'reply', 'sm')}<span class="trunc" style="flex:1">${this.editing ? 'Modification du message' : 'Réponse à <b>' + esc(fname(m.from)) + '</b> : ' + esc(plain(m.text).slice(0, 90))}</span><button class="ibtn" style="width:22px;height:22px" data-act="chat-unreply">${ic('x', 'sm')}</button>` : '';
  },
  /* --- affichage --- */
  sideHtml() {
    const f = norm(this.filter), chs = this.channels().filter(c => !f || norm(this.label(c)).includes(f));
    const item = c => {
      const n = this.unread(c.id), mu = this.muted(c.id), o = this.others(c);
      const icon = c.kind === 'public' ? `<span class="hash">${ic(c.projectId ? 'layers' : c.id === 'ch_urgences' ? 'flame' : 'hash')}</span>` : o.length === 1 ? av(o[0], 'sm', true) : `<span class="hash">${ic('users')}</span>`;
      return `<a class="ch-i ${c.id === this.cur ? 'on' : ''} ${n && !mu ? 'unread' : ''}" href="#/chat/${c.id}">${icon}<span class="trunc">${esc(this.label(c))}</span>
        ${n ? `<span class="nb ${mu && !this.mentioned(c.id) ? 'soft' : ''}">${n}</span>` : mu ? `<span class="mute">${ic('volumex', 'sm')}</span>` : ''}</a>`;
    };
    const pub = chs.filter(c => c.kind === 'public' && !c.projectId), proj = chs.filter(c => c.kind === 'public' && c.projectId), priv = chs.filter(c => c.kind !== 'public');
    const others = D.users().filter(u => u.id !== D.me && !D.get('channels', this.dmId([D.me, u.id])) && (!f || norm(u.firstName + ' ' + u.lastName).includes(f)));
    return `<div class="ch-g">Canaux<button class="ibtn" data-act="chat-newch" title="Nouveau canal">${ic('plus', 'sm')}</button></div>${pub.map(item).join('')}
      ${proj.length ? `<div class="ch-g">Projets</div>${proj.map(item).join('')}` : ''}
      <div class="ch-g">Messages directs<button class="ibtn" data-act="chat-newdm" title="Nouvelle conversation">${ic('plus', 'sm')}</button></div>${priv.map(item).join('')}
      ${others.map(u => `<a class="ch-i" data-act="dm" data-u="${u.id}">${av(u.id, 'sm', true)}<span class="trunc">${esc(u.firstName)} ${esc(u.lastName)}</span></a>`).join('')}`;
  },
  headHtml(c) {
    const o = this.others(c), p = o.length === 1 ? pres(o[0]) : null;
    const sub = c.kind === 'public' ? esc(c.topic || 'Canal de l’équipe') : o.length === 1 ? (p.online ? esc(PRES[statusOf(o[0])][0]) + (p.tx ? ' · ' + esc(p.tx) : '') : 'Hors ligne' + (statusOf(o[0]) === 'absent' ? ' · ' + esc(absLabelToday(o[0])) : '')) : o.map(fname).join(', ');
    return `<button class="ibtn" data-act="chat-list" id="ch-back" title="Conversations">${ic('left')}</button>
      ${c.kind === 'public' ? `<span class="sq" style="${cvar('#1487c9')}">${ic(c.projectId ? 'layers' : c.id === 'ch_urgences' ? 'flame' : 'hash')}</span>` : o.length === 1 ? av(o[0], 'md', true) : `<span class="sq" style="${cvar('#8a4fc7')}">${ic('users')}</span>`}
      <div style="min-width:0;flex:1"><h2 class="trunc">${esc(this.label(c))}${this.muted(c.id) ? ' ' + ic('volumex', 'sm') : ''}</h2><p class="trunc">${sub}</p></div>
      <input class="in" style="width:170px;padding:5px 9px" placeholder="Filtrer…" id="ch-search" data-live="1" value="${esc(this.chSearch)}">
      <button class="ibtn" data-act="call-audio" title="Appel audio">${ic('phone')}</button>
      <button class="ibtn" data-act="call-video" title="Appel vidéo">${ic('video')}</button>
      <button class="ibtn ${this.infoOn ? 'on' : ''}" data-act="chat-info" title="Détails, fichiers, épinglés">${ic('info')}</button>`;
  },
  msgHtml(m, prev, c) {
    const t = toDate(m.at) || new Date(), cont = prev && prev.from === m.from && !prev.kind && !m.kind && (t - toDate(prev.at)) < 5 * 60000 && ymd(t) === ymd(toDate(prev.at)) && !m.replyTo;
    const re = {}; for (const k of Object.keys(obj(m.reactions))) { const [e, u] = k.split('|'); (re[e] = re[e] || []).push(u); }
    const rq = m.replyTo && D.get('messages', m.replyTo);
    const pinned = arr(c.pins).includes(m.id);
    const files = arr(m.files).map(fileHtml).join('');
    if (m.kind === 'call' || m.kind === 'sys') return `<div class="msg sys first" id="m-${m.id}"><div class="gut"><span class="sq" style="${cvar('#5a6a7d')};width:30px;height:30px">${ic(m.kind === 'call' ? 'video' : 'info')}</span></div><div class="bd"><div class="hdr"><b>${esc(fname(m.from))}</b><time>${fmtT(t)}</time></div>${md(m.text)}</div></div>`;
    return `<div class="msg ${cont ? 'cont' : 'first'} ${m._pending ? 'pending' : ''}" id="m-${m.id}" data-mid="${m.id}">
      <div class="gut">${cont ? fmtT(t) : av(m.from, 'md')}</div><div class="bd">
      ${cont ? '' : `<div class="hdr"><b>${esc(uname(m.from))}</b><time title="${esc(fmtD(ymd(t), 'long'))} à ${fmtT(t)}">${fmtT(t)}</time>${pinned ? `<span class="mut">${ic('pushpin', 'sm')}</span>` : ''}</div>`}
      ${rq ? `<div class="quote" data-goto="${rq.id}"><b>${esc(fname(rq.from))}</b> ${esc(plain(rq.text).slice(0, 120) || '📎 pièce jointe')}</div>` : m.replyTo ? '<div class="quote">Message d’origine indisponible</div>' : ''}
      ${m.text ? md(m.text) : ''}${m.edited ? '<span class="edited">(modifié)</span>' : ''}
      ${files ? `<div class="atts">${files}</div>` : ''}
      ${Object.keys(re).length ? `<div class="reacts">${Object.entries(re).map(([e, us]) => `<button class="react ${us.includes(D.me) ? 'mine' : ''}" data-react="${esc(e)}" title="${esc(us.map(fname).join(', '))}">${esc(e)} <b>${us.length}</b></button>`).join('')}</div>` : ''}
      </div><div class="acts">${EMOJI_QUICK.slice(0, 3).map(e => `<button class="ibtn" data-react="${e}" title="Réagir">${e}</button>`).join('')}
        <button class="ibtn" data-mact="emoji" title="Autre réaction">${ic('smile')}</button><button class="ibtn" data-mact="reply" title="Répondre">${ic('reply')}</button><button class="ibtn" data-mact="more" title="Plus d’actions">${ic('dots')}</button></div></div>`;
  },
  listHtml(c) {
    let l = this.msgs(c.id);
    const q = norm(this.chSearch);
    if (q) l = l.filter(m => norm(m.text + ' ' + arr(m.files).map(f => f.name).join(' ') + ' ' + fname(m.from)).includes(q));
    const openAt = this.openAt[c.id] || '';
    let html = '', prev = null, day = '', sepDone = false;
    const minLoaded = D.loadedMonths.length ? D.loadedMonths[D.loadedMonths.length - 1] : '';
    const o = D.older[c.id] || {}, before = o.before || minLoaded;
    if (B.mode === 'remote' && !o.done && D.months.some(mo => mo < before)) html += `<div style="text-align:center;padding:8px"><button class="btn sm" data-act="chat-older">${ic('up')} Afficher les messages plus anciens</button></div>`;
    if (!l.length) html += `<div class="empty"><b>${q ? 'Aucun message trouvé' : 'Aucun message pour l’instant'}</b>${q ? '' : 'Écrivez le premier message ci-dessous. Vous pouvez joindre des photos, vidéos et fichiers (glisser-déposer ou Ctrl+V).'}</div>`;
    for (const m of l) {
      const d = ymd(toDate(m.at) || new Date());
      if (d !== day) { day = d; prev = null; html += `<div class="day-sep">${d === today() ? 'Aujourd’hui' : d === addD(today(), -1) ? 'Hier' : esc(fmtD(d, 'long'))}</div>`; }
      if (!sepDone && openAt && m.from !== D.me && (m.at || '') > openAt && !q) { sepDone = true; prev = null; html += `<div class="new-sep" id="new-sep">Nouveaux messages</div>`; }
      html += this.msgHtml(m, prev, c); prev = m;
    }
    const last = l[l.length - 1];
    if (last && last.from === D.me && !q) {
      const mem = c.kind === 'public' ? D.users().map(u => u.id) : arr(c.members);
      const r = D.get('reads', 'r_' + D.me);
      const seen = mem.filter(u => u !== D.me && (obj((D.get('reads', 'r_' + u) || {}).ch)[c.id] || '') >= last.at);
      if (seen.length) html += `<div class="seen">Vu par ${avs(seen, 'xs', 6)}</div>`;
      void r;
    }
    return html;
  },
  typingHtml(c) {
    const now = Date.now() / 1000;
    const who = Object.entries(D.presence).filter(([u, p]) => u !== D.me && p.online && p.ty && p.ty.ch === c.id && now - p.ty.t < 7).map(([u]) => fname(u));
    return who.length ? esc(who.join(', ')) + (who.length > 1 ? ' écrivent…' : ' écrit…') : '';
  },
  infoHtml(c) {
    const files = this.msgs(c.id).flatMap(m => arr(m.files).map(f => Object.assign({ at: m.at }, f))).reverse();
    const imgs = files.filter(f => /^image\//.test(f.mime || '')).slice(0, 12), others = files.filter(f => !/^image\//.test(f.mime || '')).slice(0, 15);
    const pins = arr(c.pins).map(id => D.get('messages', id)).filter(Boolean);
    const mem = c.kind === 'public' ? D.users().map(u => u.id) : arr(c.members);
    const pj = c.projectId && D.get('projects', c.projectId);
    return `<div class="row"><b style="flex:1">Détails</b><button class="ibtn" data-act="chat-info">${ic('x')}</button></div>
      ${c.topic ? `<p class="sm-t">${esc(c.topic)}</p>` : ''}${pj ? `<p><a href="#/projet/${pj.id}">${ic('layers', 'sm')} Ouvrir le projet</a></p>` : ''}
      <label class="sw" style="margin-top:8px"><input type="checkbox" data-act="chat-mute"${this.muted(c.id) ? ' checked' : ''}><i></i>Couper les notifications</label>
      <h4>Membres (${mem.length})</h4><div class="col" style="gap:5px">${mem.map(u => `<div class="row" style="font-size:13px">${av(u, 'sm', true)}<span class="trunc">${esc(uname(u))}</span></div>`).join('')}</div>
      <h4>Épinglés (${pins.length})</h4>${pins.length ? pins.map(m => `<div class="cmt" style="margin-bottom:7px;cursor:pointer" data-goto="${m.id}"><div class="bd" style="padding:6px 9px"><div class="hdr"><b>${esc(fname(m.from))}</b>${esc(ago(m.at))}</div><div class="sm-t">${esc(plain(m.text).slice(0, 140))}</div></div></div>`).join('') : '<p class="mut sm-t">Aucun message épinglé.</p>'}
      <h4>Photos (${files.filter(f => /^image\//.test(f.mime || '')).length})</h4>${imgs.length ? `<div class="shots">${imgs.map(f => `<img src="${esc(fsrc(f.id))}" data-fid="${esc(f.id)}" data-act="open-file" data-id="${esc(f.id)}" data-name="${esc(f.name)}" loading="lazy" alt="">`).join('')}</div>` : '<p class="mut sm-t">Aucune photo.</p>'}
      <h4>Fichiers et vidéos</h4>${others.length ? `<div class="col" style="gap:6px">${others.map(fileHtml).join('')}</div>` : '<p class="mut sm-t">Aucun fichier.</p>'}
      ${c.kind === 'public' ? `<div style="margin-top:16px"><button class="btn sm" data-act="chat-editch">${ic('edit')} Modifier le canal</button></div>` : ''}`;

async function shrinkImage(file) {

    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });

function mentionAuto(ta) {
  const before = ta.value.slice(0, ta.selectionStart), m = /(^|\s)@([\wÀ-ÿ.\-]*)$/.exec(before);
  if (!m) { if (POP && POP.classList.contains('mention-pop')) closePop(); return; }
  const k = norm(m[2]);
  const list = [...D.users().filter(u => u.id !== D.me && (norm(u.firstName).startsWith(k) || norm(u.lastName).startsWith(k))).map(u => ({ id: u.id, ins: u.firstName, l: u.firstName + ' ' + u.lastName })),
    ...('tous'.startsWith(k) ? [{ id: '*', ins: 'tous', l: 'tous — toute l’équipe' }] : [])];
  if (!list.length) { closePop(); return; }
  let sel = 0;
  const pick = i => {
    const it = list[i], start = before.length - m[2].length - 1;
    ta.value = ta.value.slice(0, start) + '@' + it.ins + ' ' + ta.value.slice(ta.selectionStart);
    const p = start + it.ins.length + 2; ta.setSelectionRange(p, p); closePop(); ta.focus(); Chat.drafts[Chat.cur] = ta.value;
  };
  const draw = () => list.map((u, i) => `<button class="mi ${i === sel ? 'on' : ''}" data-i="${i}" style="${i === sel ? 'background:var(--surface-3)' : ''}">${u.id === '*' ? `<span class="sq" style="${cvar('#1487c9')};width:24px;height:24px">${ic('users', 'sm')}</span>` : av(u.id, 'sm', true)}${esc(u.l)}</button>`).join('');
  const el = popover(ta, draw(), { left: true, w: 260, cls: 'mention-pop' });
  el.onmousedown = e => { const b = e.target.closest('[data-i]'); if (b) { e.preventDefault(); pick(+b.dataset.i); } };

    e.preventDefault();
    if (e.key === 'ArrowDown') sel = (sel + 1) % list.length; else if (e.key === 'ArrowUp') sel = (sel - 1 + list.length) % list.length; else return pick(sel);
    el.innerHTML = draw();
  };
}

      onClose: () => { clearInterval(timer); if (rec && rec.state !== 'inactive') rec.stop(); stream.getTracks().forEach(t => t.stop()); }
    });
    const v = $('video', m.el); if (v) v.srcObject = stream;
    const show = (...s) => ['[data-rec]', '[data-stop]', '[data-redo]', '[data-use]'].forEach(x => $(x, m.el).classList.toggle('hide', !s.includes(x)));
    const tick = () => { const s = Math.floor((Date.now() - t0) / 1000); $('[data-t]', m.el).textContent = Math.floor(s / 60) + ':' + pad(s % 60); if (s >= MAX) stop(); };
    const stop = () => { if (rec && rec.state !== 'inactive') rec.stop(); clearInterval(timer); $('.dot', m.el).classList.add('hide'); };
    $('[data-rec]', m.el).onclick = () => {
      chunks = []; rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);

      rec.onstop = () => {
        blob = new Blob(chunks, { type: (mime || (video ? 'video/webm' : 'audio/webm')).split(';')[0] });
        const p = $('[data-play]', m.el); p.classList.remove('hide');

        if (v) v.classList.add('hide');
        show('[data-redo]', '[data-use]');
      };
      rec.start(1000); t0 = Date.now(); timer = setInterval(tick, 500);
      $('.dot', m.el).classList.remove('hide'); show('[data-stop]');
    };
    $('[data-stop]', m.el).onclick = stop;
    $('[data-redo]', m.el).onclick = () => { $('[data-play]', m.el).classList.add('hide'); if (v) v.classList.remove('hide'); $('[data-t]', m.el).textContent = '0:00'; show('[data-rec]'); };
    $('[data-use]', m.el).onclick = () => {
      const ext = /mp4/.test(blob.type) ? (video ? 'mp4' : 'm4a') : /ogg/.test(blob.type) ? 'ogg' : video ? 'webm' : 'weba';
      cb(new File([blob], `${video ? 'video' : 'vocal'}-${today()}-${fmtT(new Date()).replace(':', 'h')}.${ext}`, { type: blob.type }));
      m.close();
    };
  },
  async screenshot(cb) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return toast(isSecureContext ? 'Capture d’écran non prise en charge par ce navigateur : utilisez Win+Maj+S puis Ctrl+V dans la zone de saisie.' : 'Capture indisponible en http : utilisez Win+Maj+S puis Ctrl+V dans la zone de saisie.', 'warn', null, 9000);
    let s; try { s = await navigator.mediaDevices.getDisplayMedia({ video: true }); } catch (e) { return; }
    const v = document.createElement('video'); v.srcObject = s; v.muted = true; await v.play().catch(() => { });
    await sleep(350);

/* ---------- glisser-déposer (tableaux Kanban) ---------- */
function dnd(root, o) {
  root.addEventListener('dragstart', e => {
    const it = e.target.closest('[data-drag]'); if (!it) return;
    DRAG.on = true; DRAG.id = it.dataset.drag; it.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', DRAG.id); } catch (x) { }
  });
  root.addEventListener('dragend', () => { const was = DRAG.on; DRAG.on = false; $$('.dragging,.dragover', root).forEach(x => x.classList.remove('dragging', 'dragover')); if (was !== undefined) setTimeout(() => App.render(), 30); });
  root.addEventListener('dragover', e => {
    const z = e.target.closest('[data-drop]'); if (!z || !DRAG.on) return;
    e.preventDefault(); $$('.dragover', root).forEach(x => x !== z && x.classList.remove('dragover')); z.classList.add('dragover');
  });
  root.addEventListener('drop', e => { const z = e.target.closest('[data-drop]'); if (!z || !DRAG.on) return; e.preventDefault(); DRAG.on = false; o.onDrop(DRAG.id, z.dataset.drop); });
}

function projProgress(p) {
  if (p.status === 'termine') return 100;
  if (p.progressMode === 'manuel') return clamp(Math.round(+p.progress || 0), 0, 100);
  const ph = arr(p.phases).filter(x => x.start && x.end);
  if (ph.length) { let w = 0, s = 0; for (const x of ph) { const d = Math.max(1, diffD(x.start, x.end) + 1); w += d; s += d * clamp(+x.progress || 0, 0, 100); } return Math.round(s / w); }
  const ts = D.all('tasks').filter(t => t.projectId === p.id);
  if (ts.length) return Math.round(ts.filter(t => t.status === 'fait').length / ts.length * 100);
  return clamp(Math.round(+p.progress || 0), 0, 100);
}

  const ds = [p.start, p.end, ...arr(p.phases).flatMap(x => [x.start, x.end]), ...arr(p.milestones).map(m => m.date)].filter(Boolean).sort();
  return ds.length ? [ds[0], ds[ds.length - 1]] : [null, null];
}

/** saisie rapide de tâche : « Texte @prénom ! » (! = priorité haute) */
function quickTask(root, projectId) {
  root.addEventListener('keydown', async e => {
    const i = e.target.closest('[data-qtask]'); if (!i || e.key !== 'Enter' || !i.value.trim()) return;
    e.preventDefault();
    let txt = i.value.trim(); const who = mentionsIn(txt).filter(x => x !== '*');
    txt = txt.replace(/(^|\s)@[\wÀ-ÿ.\-]+/g, ' ').replace(/\s+/g, ' ').trim();
    const hi = /(^|\s)!+(\s|$)/.test(txt); txt = txt.replace(/(^|\s)!+(\s|$)/g, ' ').trim();
    const pid = projectId || i.dataset.qtask || '';
    i.value = '';
    const set = { title: txt, status: 'afaire', priority: hi ? 2 : 3, assignees: who.length ? who : [D.me], projectId: pid, visibility: pid || who.some(u => u !== D.me) ? 'equipe' : 'prive' };
    await save('tasks', uid('tk'), { set }, 'Tâche ' + txt);
    notify(who, 'task', `${fname(D.me)} vous a assigné : ${txt}`, '#/taches');
  });
}

    projs.sort((a, b) => order[a.status] - order[b.status] || (projRange(a)[0] || '9').localeCompare(projRange(b)[0] || '9'));
    const rows = [];

      rows.push({ t: 'p', p });
      if (open[p.id] !== false) {
        for (const ph of arr(p.phases).slice().sort((a, b) => (a.start || '').localeCompare(b.start || ''))) rows.push({ t: 'ph', p, ph });

    const t = today();
    const dates = projs.flatMap(p => projRange(p)).filter(Boolean).concat([addD(t, -14), addD(t, 60)]).sort();
    let a = addD(dates[0], -7), b = addD(dates[dates.length - 1], 21);

      else if (z === 'm') { if (isoWD(d) === 1) { const wk = isoWeek(d); low += `<div class="l" style="left:${x(d)}px;width:${Math.round(7 * px)}px">S${wk}</div>`; grid += `<div style="left:${x(d)}px"></div>`; } }

        if (!s) return ms + `<div class="gt-lbl" style="left:${x(t) + 6}px">Aucune date</div>`;

function layoutDay(items) {
  const l = items.map(i => Object.assign({}, i, { e2: i.e != null ? i.e : i.s + 30 })).sort((a, b) => a.s - b.s);
  let group = [], end = -1;
  const flush = () => { const cols = []; for (const it of group) { let c = cols.findIndex(x => x <= it.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = it.e2; it.col = c; } group.forEach(it => it.cols = cols.length); group = []; };
  for (const it of l) { if (it.s >= end && group.length) flush(); group.push(it); end = Math.max(end, it.e2); }
  flush();
  return l;
}

const Lates = {
  edit(id, preset = {}) {
    const l = id ? D.get('lates', id) : null, val = isVal();
    if (l && l.userId !== D.me && !val) return toast('Seuls les responsables peuvent modifier le retard d’un collègue.', 'warn');
    const now = new Date(), exp = SET().dayStart || '09:00';
    const v = l ? clone(l) : Object.assign({ userId: D.me, date: today(), expected: exp, eta: minT(Math.max(tmin(exp) + 15, now.getHours() * 60 + now.getMinutes() + 15)), reason: 'transport', recover: true }, preset);
    editForm({
      title: l ? 'Retard' : 'Signaler un retard', size: 'sm', icon: `<span class="sq" style="${cvar('#c2721a')}">${ic('clock')}</span>`,
      fields: [
        ...(val ? [{ k: 'userId', l: 'Personne', t: 'select', opts: uopts() }] : []),
        { k: 'date', l: 'Date', t: 'date', req: true },
        { k: 'expected', l: 'Heure d’arrivée prévue', t: 'time', req: true }, { k: 'eta', l: 'Arrivée estimée', t: 'time', req: true },
        { k: 'reason', l: 'Motif', t: 'select', opts: Object.entries(LATE_R) },
        { k: 'comment', l: 'Message à l’équipe', t: 'textarea', rows: 2, ph: 'ex. RER B à l’arrêt, je préviens dès que je repars.' },
        { k: 'recover', t: 'switch', lbl: 'À rattraper (ajouté au compteur d’heures)' },
        { k: 'arrived', l: 'Arrivée réelle', t: 'time', show: () => !!l }
      ],
      value: v,
      validate: x => tmin(x.eta) <= tmin(x.expected) ? 'L’arrivée estimée doit être après l’heure prévue.' : null,
      onDelete: l ? () => { remove('lates', l.id, 'Retard'); if (l.hoursId) remove('hours', l.hoursId, '', { undo: false }); } : null,
      onSave: async x => {
        const nid = l ? l.id : uid('lt'), minutes = Math.max(0, tmin(x.arrived || x.eta) - tmin(x.expected));
        const set = Object.assign({}, x, { minutes });
        if (x.recover) {
          const hid = (l && l.hoursId) || uid('hr');
          await save('hours', hid, { set: { userId: x.userId, kind: 'retard', date: x.date, minutes, reason: 'Retard — ' + LATE_R[x.reason] + (x.comment ? ' : ' + x.comment : ''), lateId: nid } }, 'Heures ' + uname(x.userId));
          set.hoursId = hid;
        } else if (l && l.hoursId) { remove('hours', l.hoursId, '', { undo: false }); set.hoursId = ''; }
        const r = await save('lates', nid, { set }, 'Retard ' + uname(x.userId)); if (!r) return false;
        if (!l && x.date === today()) {
          notify(D.users().map(u => u.id).filter(u => u !== x.userId), 'late', `${fname(x.userId)} signale un retard d’environ ${hm(minutes)} (${LATE_R[x.reason]}) — arrivée vers ${x.eta}${x.comment ? ' · ' + x.comment : ''}`, '#/retards');
          toast('Retard signalé à l’équipe', 'ok');
        }
      }
    });
  },
  async arrived(id) {
    const l = D.get('lates', id); if (!l) return;
    const n = new Date(), t = minT(n.getHours() * 60 + n.getMinutes()), minutes = Math.max(0, tmin(t) - tmin(l.expected));
    await save('lates', id, { set: { arrived: t, minutes } });
    if (l.hoursId) save('hours', l.hoursId, { set: { minutes } });
    notify(D.users().map(u => u.id).filter(u => u !== l.userId), 'late', `${fname(l.userId)} est arrivé(e) à ${t}`, '#/retards');
    toast(`Arrivée enregistrée à ${t} (${hm(minutes)} de retard)`, 'ok');
  }
};

function vbars(series, colors, labels) {
  const max = Math.max(1, ...series.map(s => s.v.reduce((a, b) => a + b, 0)));
  return `<div class="vbars">${series.map(s => `<div class="vb" title="${esc(s.l)} : ${s.v.map((v, i) => (labels ? labels[i] + ' ' : '') + v).join(', ')}"><b>${s.v.reduce((a, b) => a + b, 0) || ''}</b><div class="stk" style="height:${s.v.reduce((a, b) => a + b, 0) / max * 140}px">${s.v.map((v, i) => `<i style="--c:${colors[i]};height:${v / Math.max(1, s.v.reduce((a, b) => a + b, 0)) * 100}%"></i>`).join('')}</div><small>${esc(s.l)}</small></div>`).join('')}</div>
    ${labels ? `<div class="legend" style="margin-top:8px">${labels.map((l, i) => `<span><i style="--c:${colors[i]}"></i>${esc(l)}</span>`).join('')}</div>` : ''}`;
}
function hbars(rows, color) { const max = Math.max(1, ...rows.map(r => r[1])); return rows.length ? `<div class="hbars">${rows.map(([l, v, c]) => `<div class="hb"><span class="trunc" title="${esc(l)}">${esc(l)}</span><span class="bar" style="--c:${c || color}"><i style="width:${v / max * 100}%"></i></span><span class="v">${typeof v === 'number' ? num(v, v % 1 ? 1 : 0) : v}</span></div>`).join('')}</div>` : '<p class="mut">Pas encore de données.</p>'; }

    <button class="btn pri" style="margin-top:12px" onclick="location.reload()">Réessayer</button></div></div></div>`;
}
function banner(type, html, key) {
  try { if (key && sessionStorage.getItem(KEY + '-bn-' + key)) return; } catch (e) { }
  const el = document.createElement('div'); el.className = 'bnr ' + type;
  el.innerHTML = html + `<span class="spacer"></span><button class="ibtn" style="width:24px;height:24px" title="Masquer">${ic('x', 'sm')}</button>`;
  $('button:last-child', el).onclick = () => { el.remove(); try { key && sessionStorage.setItem(KEY + '-bn-' + key, '1'); } catch (e) { } };
  $('#banner').appendChild(el);
}

  } else B = Local;
  if (B === Local) { try { await Local.init(); } catch (e) { return fatal('Stockage local indisponible (navigation privée ?) : ' + e.message); } }
  let info = await B.me();
  if (!info.auth) info = await Auth.start(); else { Auth.info = info; Auth.user = info; }
  D.me = info.userId;
  try { await App.load(); } catch (e) { return fatal('Chargement impossible : ' + e.message); }
  $('#app').classList.remove('hide');

  if (B === Local) banner('info', `${ic('info')}<span><b>Mode démonstration</b> : données d’exemple stockées dans ce navigateur uniquement${why ? ' (' + esc(why) + ')' : ''}. Pour une utilisation en équipe, déposez le dossier sur un serveur web avec PHP (voir LISEZMOI.md).</span>`, 'demo');
