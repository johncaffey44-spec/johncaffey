<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#15171b">
<title>D8 · Espace SI</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315171b'/%3E%3Ctext x='32' y='40' font-family='Segoe UI,Arial' font-weight='800' font-size='27' fill='white' text-anchor='middle'%3ED8%3C/text%3E%3Crect x='17' y='47' width='10' height='4' fill='%23009246'/%3E%3Crect x='27' y='47' width='10' height='4' fill='%23ffffff'/%3E%3Crect x='37' y='47' width='10' height='4' fill='%23ce2b37'/%3E%3C/svg%3E">
<style>
/* ============ jetons (identiques au Planning D8) ============ */
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
  --bg:#f2f4f6;--surface:#fff;--surface-2:#f7f8fa;--surface-3:#edf0f3;
  --border:#e1e5ea;--border-2:#ccd2da;
  --text:#191d23;--text-2:#485261;--text-3:#6d7783;
  --primary:#1487c9;--primary-2:#0e6da4;--primary-soft:#e7f3fb;
  --danger:#cf4040;--danger-soft:#fdeceb;--warn:#b4700c;--warn-soft:#fdf2e0;
  --ok:#2c8f55;--ok-soft:#e7f5ec;--info:#5a6a7d;--info-soft:#eef1f5;
  --side:#15171b;--side-2:#1c1f25;--side-3:#272b33;--side-tx:#c9cfd8;--side-mu:#7c8593;
  --r:11px;--r-sm:7px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  --sh-lg:0 18px 48px rgba(16,24,40,.24);
  --today:rgba(20,135,201,.07);
  --mine:#e3f1fb;
}
html[data-theme=dark]{
  --bg:#0e1014;--surface:#171a20;--surface-2:#1b1f26;--surface-3:#222730;
  --border:#2a2f38;--border-2:#3a414b;
  --text:#e6e9ee;--text-2:#b2bac5;--text-3:#8a939f;
  --primary:#3ba4e0;--primary-2:#6ab9e9;--primary-soft:#123047;
  --danger:#ea6a6a;--danger-soft:#381e20;--warn:#e3a145;--warn-soft:#372a13;
  --ok:#49bd7b;--ok-soft:#14301f;--info:#98a4b3;--info-soft:#212730;
  --side:#08090b;--side-2:#111318;--side-3:#1c1f26;
  --sh:0 1px 2px rgba(0,0,0,.5);--sh-lg:0 18px 48px rgba(0,0,0,.6);--today:rgba(59,164,224,.10);
  --mine:#14304a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.ic.sm{width:14px;height:14px;vertical-align:-2px}
.ic.lg{width:24px;height:24px}
.mut{color:var(--text-3)}
.sm-t{font-size:12px}
.nowrap{white-space:nowrap}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.hide{display:none!important}
.danger-t{color:var(--danger)}.warn-t{color:var(--warn)}.ok-t{color:var(--ok)}
/* ============ structure ============ */
#app{display:flex;min-height:100vh}
#sb{width:250px;flex:none;background:var(--side);color:var(--side-tx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.sb-head{display:flex;align-items:center;gap:8px;padding:14px 10px 8px 14px}
.brand{display:flex;align-items:center;gap:11px;color:#fff;min-width:0;flex:1}
.brand:hover{text-decoration:none}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,#31363f,#0d0f13);display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;position:relative;box-shadow:inset 0 0 0 1px #ffffff1f;flex:none}
.logo::after{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:3px;border-radius:2px;background:linear-gradient(90deg,#009246 0 34%,#f2f2f2 34% 66%,#ce2b37 66%)}
.brand b{font-size:14.5px;font-weight:650;display:block;line-height:1.2}
.brand small{font-size:11px;color:var(--side-mu);display:block}
.sb-new{margin:6px 12px 8px;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border:0;border-radius:9px;background:var(--primary);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer}
.sb-new:hover{background:var(--primary-2)}
#nav{flex:1;overflow-y:auto;padding:2px 8px 14px}
.nav-sec{margin-top:9px}
.nav-h{display:flex;align-items:center;gap:6px;width:100%;background:0;border:0;color:var(--side-mu);font-size:12px;font-weight:600;padding:6px 8px;cursor:pointer;border-radius:6px}
.nav-h:hover{color:#fff}
.nav-h .ic{width:13px;height:13px;transition:transform .15s}
.nav-sec.closed .nav-h .ic{transform:rotate(-90deg)}
.nav-sec.closed .nav-list{display:none}
.nav-a{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;color:var(--side-tx);font-size:13.5px;position:relative;cursor:pointer}
.nav-a:hover{background:var(--side-2);color:#fff;text-decoration:none}
.nav-a.on{background:var(--side-3);color:#fff;font-weight:600}
.nav-a.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.nav-b{margin-left:auto;font-size:11px;font-weight:650;padding:1px 7px;border-radius:9px;background:#ffffff17;color:#e3e7ee}
.nav-b.danger{background:#e0525255;color:#ffd0d0}
.nav-b.warn{background:#e3a14544;color:#ffd9a6}
.nav-b.pri{background:#3ba4e055;color:#d6eeff}
.sb-team{padding:8px 12px;border-top:1px solid #ffffff12;display:flex;flex-direction:column;gap:3px;max-height:190px;overflow-y:auto}
.sb-team .ttl{font-size:11px;color:var(--side-mu);font-weight:600;padding:2px 2px 4px}
.sb-mate{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--side-tx);padding:3px 4px;border-radius:7px;cursor:pointer}
.sb-mate:hover{background:var(--side-2);color:#fff}
.sb-mate small{color:var(--side-mu);font-size:11px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.sb-foot{padding:9px 14px;border-top:1px solid #ffffff12;font-size:11.5px;color:var(--side-mu);display:flex;align-items:center;gap:8px}
body.mini #sb{width:62px}
body.mini .brand b,body.mini .brand small,body.mini .nav-h,body.mini .nav-a .lbl,body.mini .nav-b,body.mini .sb-new .lbl,body.mini .sb-foot span,body.mini .sb-team{display:none}
body.mini .nav-a{justify-content:center;padding:9px 0}
body.mini .sb-head{flex-direction:column;padding:12px 0 6px;gap:6px}
body.mini .brand{flex:none}
body.mini .sb-new{margin:6px 10px 8px;padding:9px 0}
body.mini .sb-foot{justify-content:center}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:54px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:25}
#crumbs{font-size:14px;display:flex;align-items:center;gap:6px;min-width:0;font-weight:600}
.srch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 9px;color:var(--text-3);cursor:pointer;font-size:13px;min-width:200px}
.srch:hover{border-color:var(--border-2)}
kbd{font:11px/1 var(--mono);border:1px solid var(--border-2);border-bottom-width:2px;border-radius:4px;padding:3px 5px;color:var(--text-3);background:var(--surface)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);padding:4px 9px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--text-3);display:block}
.sync.ok i{background:var(--ok)}.sync.saving i{background:var(--primary)}.sync.err i{background:var(--danger)}.sync.warn i{background:var(--warn)}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:0;color:var(--text-2);cursor:pointer;position:relative;flex:none}
.ibtn:hover{background:var(--surface-3);color:var(--text)}
.ibtn.on{background:var(--primary-soft);color:var(--primary-2)}
.ibtn .cnt{position:absolute;top:1px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
#burger{display:none}
.who{display:flex;align-items:center;gap:8px;padding:3px 9px 3px 3px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:13px;max-width:210px}
.who:hover{border-color:var(--border-2)}
.stbtn{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:12.5px;white-space:nowrap}
.stbtn:hover{border-color:var(--border-2)}
.stbtn i{width:9px;height:9px;border-radius:50%;background:var(--c);display:block}
#view{padding:20px 22px 48px;flex:1;min-width:0}
body.full #view{padding:0}
#banner:not(:empty){padding:10px 22px 0}
.bnr{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:9px;font-size:13px;border:1px solid var(--border);background:var(--surface);margin-bottom:8px}
.bnr.warn{background:var(--warn-soft);border-color:#e3a14555;color:var(--warn)}
.bnr.danger{background:var(--danger-soft);border-color:#cf404055;color:var(--danger)}
.bnr.info{background:var(--primary-soft);border-color:#1487c944}
.bnr.ok{background:var(--ok-soft);border-color:#2c8f5544;color:var(--ok)}
/* ============ éléments communs ============ */
.av{width:28px;height:28px;border-radius:50%;background:var(--c,var(--primary));color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none;position:relative;background-size:cover;background-position:center;letter-spacing:.02em}
.av.xs{width:20px;height:20px;font-size:9px}.av.sm{width:24px;height:24px;font-size:10px}.av.md{width:36px;height:36px;font-size:13px}.av.lg{width:56px;height:56px;font-size:19px}.av.xl{width:96px;height:96px;font-size:32px}
.av .pd{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--pc,#8a939f);border:2px solid var(--surface)}
.av.xs .pd{width:8px;height:8px;border-width:1.5px}
#sb .av .pd{border-color:var(--side)}
.avs{display:inline-flex}
.avs .av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.avs .av:first-child{margin-left:0}
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.phead h1{font-size:22px}
.phead p{margin:3px 0 0;color:var(--text-3);font-size:13px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.card>h3,.card-h{padding:12px 15px;border-bottom:1px solid var(--border);font-size:14.5px;display:flex;align-items:center;gap:9px}
.card-h .acts{margin-left:auto;display:flex;gap:6px}
.card-b{padding:15px}
.card-b.tight{padding:6px}
.grid{display:grid;gap:14px}
.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.grid>*,.g2>*,.g3>*,.split>*,.kpis>*{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:550;cursor:pointer;white-space:nowrap;text-decoration:none!important}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-2)}
.btn.dgr{color:var(--danger);border-color:#cf404055}
.btn.dgr:hover{background:var(--danger-soft)}
.btn.dgr.fill{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ok{color:var(--ok);border-color:#2c8f5555}
.btn.ok:hover{background:var(--ok-soft)}
.btn.ok.fill{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.xs{padding:2px 7px;font-size:12px;border-radius:6px;gap:4px}
.btn.gh{border-color:transparent;background:0}
.btn.gh:hover{background:var(--surface-3)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.big{padding:11px 16px;font-size:14.5px;border-radius:10px}
.in,select.in,textarea.in{width:100%;padding:7px 10px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text);min-width:0}
.in:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.in{resize:vertical;min-height:62px;line-height:1.45}
select.in{cursor:pointer}
input[type=color].in{padding:2px;height:34px;cursor:pointer}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.fld .help{font-size:11.5px;color:var(--text-3)}
.fld.span2{grid-column:1/-1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px}
.fgrid.one{grid-template-columns:1fr}
.fgrid.two{grid-template-columns:1fr 1fr}
.inrow{display:flex;gap:6px;align-items:center}
.inrow>*{flex:1}
.sw{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
.sw input{position:absolute;opacity:0;width:0}
.sw i{width:38px;height:21px;border-radius:12px;background:var(--border-2);position:relative;transition:background .15s;flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px #0003}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(17px)}
.sw input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:550;background:var(--surface-3);color:var(--text-2);border:1px solid transparent;white-space:nowrap;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--border-2)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.sel,.chip:has(input:checked){background:var(--primary-soft);border-color:var(--primary);color:var(--primary-2)}
label.chip input{display:none}
.chip b{font-weight:700}
.tag{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--t,var(--surface-3));color:var(--c,var(--text-2));border:1px solid var(--tb,transparent);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--t);color:var(--c);border:1px solid var(--tb);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--c);display:block}
.seg{display:inline-flex;padding:3px;background:var(--surface-3);border-radius:9px;gap:2px}
.seg button,.seg a{border:0;background:0;padding:5px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.seg .on{background:var(--surface);color:var(--text);box-shadow:var(--sh)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs a,.tabs button{padding:9px 13px;border:0;background:0;border-bottom:2px solid transparent;color:var(--text-2);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;text-decoration:none!important;margin-bottom:-1px}
.tabs .on{border-bottom-color:var(--primary);color:var(--text)}
.tabs .nb{font-size:11px;padding:0 6px;border-radius:8px;background:var(--surface-3);color:var(--text-2)}
.tabs .nb.danger{background:var(--danger);color:#fff}
.bar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--c,var(--primary));border-radius:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--text-3);padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clic{cursor:pointer}
.tbl .n{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.hl td{background:var(--warn-soft)}
.tbl-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);box-shadow:var(--sh)}
.empty{padding:34px 20px;text-align:center;color:var(--text-3)}
.empty b{display:block;color:var(--text-2);font-size:15px;margin-bottom:5px}
.empty .btn{margin-top:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .in{width:auto;min-width:130px;max-width:100%}
.toolbar .srchin{min-width:220px;flex:0 1 280px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;color:inherit;text-decoration:none!important}
.kpi:hover{border-color:var(--border-2)}
.kpi .v{font-size:24px;font-weight:700;line-height:1;display:block}
.kpi .l{font-size:12.5px;color:var(--text-3);margin-top:3px;display:block}
.kpi .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--t);color:var(--c);flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;min-width:0;color:inherit;text-decoration:none!important}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .main{flex:1;min-width:0}
.li .t1,.li .t2{display:block}
.li .t1{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .side{font-size:12px;color:var(--text-3);white-space:nowrap;text-align:right}
.li.done .t1{text-decoration:line-through;color:var(--text-3)}
.sq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--t);color:var(--c);flex:none}
.ck{width:18px;height:18px;border-radius:5px;border:2px solid var(--border-2);display:inline-grid;place-items:center;cursor:pointer;flex:none;background:var(--surface);color:#fff;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck .ic{width:12px;height:12px;stroke-width:3}
.ck:not(.on) .ic{display:none}
.md{line-height:1.55;overflow-wrap:anywhere}
.md p{margin:0 0 .55em}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{font-size:15px;margin:.6em 0 .3em}
.md ul,.md ol{margin:.2em 0 .55em;padding-left:1.4em}
.md li.task{list-style:none;margin-left:-1.3em;display:flex;gap:7px;align-items:flex-start}
.md li.task .ck{margin-top:2px;width:16px;height:16px}
.md li.task.done>span{text-decoration:line-through;color:var(--text-3)}
.md code{font:12.5px var(--mono);background:var(--surface-3);padding:1px 5px;border-radius:4px}
.md pre{font:12.5px/1.45 var(--mono);background:var(--surface-3);padding:9px 11px;border-radius:8px;overflow-x:auto;margin:.3em 0 .6em;white-space:pre-wrap}
.md pre code{background:0;padding:0}
.md blockquote{margin:.3em 0;padding:2px 10px;border-left:3px solid var(--border-2);color:var(--text-2)}
.md .mention{background:var(--primary-soft);color:var(--primary-2);border-radius:4px;padding:0 3px;font-weight:600}
.md .mention.me{background:#f7d97455;color:var(--warn)}
.md hr{border:0;border-top:1px solid var(--border);margin:.6em 0}
/* ============ modales, notifications, menus ============ */
#modals{position:relative;z-index:60}
.mwrap{position:fixed;inset:0;background:rgba(15,20,28,.45);display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto;z-index:60;backdrop-filter:blur(2px)}
.mdl{background:var(--surface);border-radius:14px;box-shadow:var(--sh-lg);width:100%;max-width:560px;border:1px solid var(--border);animation:mi .14s ease-out}
.mdl.lg{max-width:830px}.mdl.sm{max-width:420px}.mdl.xl{max-width:1100px}
@keyframes mi{from{transform:translateY(-8px);opacity:.6}to{transform:none;opacity:1}}
.mdl>header{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
.mdl>header h3{font-size:16px;flex:1;min-width:0}
.mdl .mb{padding:15px;max-height:calc(100vh - 210px);overflow-y:auto}
.mdl>footer{display:flex;gap:8px;align-items:center;padding:12px 15px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:9px;z-index:95;max-width:min(400px,92vw)}
.tst{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-lg);font-size:13.5px;animation:mi .15s}
.tst.ok{border-left:4px solid var(--ok)}.tst.danger{border-left:4px solid var(--danger)}.tst.warn{border-left:4px solid var(--warn)}.tst.info{border-left:4px solid var(--primary)}
.tst .tb{flex:1;min-width:0}
.tst .tb b{display:block}
.tst .tb small{color:var(--text-2);display:block;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tst.clk{cursor:pointer}
.pop{position:fixed;z-index:70;min-width:210px;max-width:340px;padding:6px;box-shadow:var(--sh-lg)}
.mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;border:0;background:0;width:100%;text-align:left;color:var(--text);text-decoration:none!important}
.mi:hover{background:var(--surface-3)}
.mi.dgr{color:var(--danger)}
.mi small{margin-left:auto;color:var(--text-3);font-size:11.5px}
.msep{height:1px;background:var(--border);margin:5px 4px}
.mhd{font-size:11.5px;font-weight:650;color:var(--text-3);padding:6px 10px 3px;text-transform:uppercase;letter-spacing:.03em}
.pal{max-width:640px;margin-top:6vh}
.pal input{width:100%;border:0;border-bottom:1px solid var(--border);padding:15px 16px;font-size:16px;background:0;border-radius:14px 14px 0 0}
.pal input:focus{outline:0}
.pal-l{max-height:56vh;overflow-y:auto;padding:7px}
.pal-i{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:9px;cursor:pointer;font-size:13.5px}
.pal-i .trunc{flex:1}
.pal-i small{color:var(--text-3);font-size:12px;white-space:nowrap}
.pal-i.on,.pal-i:hover{background:var(--primary-soft)}
.pal-g{font-size:11.5px;font-weight:650;color:var(--text-3);padding:8px 11px 3px;text-transform:uppercase;letter-spacing:.03em}
/* ============ tableau de bord ============ */
.hello{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.hello h1{font-size:23px}
.hello p{margin:2px 0 0;color:var(--text-3)}
.mates{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mate{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);min-width:0}
.mate .t1{font-weight:600;font-size:13.5px}
.mate .t2{font-size:12px;color:var(--text-3)}
.ann{border-left:4px solid var(--c);padding:11px 13px;border-radius:9px;background:var(--t);margin-bottom:9px}
.ann h4{font-size:14px;display:flex;align-items:center;gap:8px}
.ann .md{margin-top:5px;font-size:13.5px}
.ann .meta{font-size:12px;color:var(--text-3);margin-top:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ============ messagerie ============ */
body.full #main{height:100vh;height:100dvh;overflow:hidden}
body.full #view{flex:1;min-height:0;display:flex;flex-direction:column}
body.full .vroot{flex:1;min-height:0}
.chat{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%;background:var(--surface);position:relative}
.chat.info-on{grid-template-columns:268px minmax(0,1fr) 290px}
.ch-side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.ch-side .hd{padding:12px 12px 8px;display:flex;gap:6px;align-items:center}
.ch-side .hd .in{padding:6px 9px}
.ch-list{flex:1;overflow-y:auto;padding:0 8px 12px}
.ch-g{font-size:11.5px;font-weight:650;color:var(--text-3);padding:12px 8px 4px;display:flex;align-items:center;text-transform:uppercase;letter-spacing:.03em}
.ch-g .ibtn{width:24px;height:24px;margin-left:auto}
.ch-i{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--text-2);min-width:0;text-decoration:none!important}
.ch-i:hover{background:var(--surface-3);color:var(--text)}
.ch-i.on{background:var(--primary-soft);color:var(--primary-2);font-weight:600}
.ch-i.unread{color:var(--text);font-weight:650}
.ch-i .hash{width:24px;height:24px;display:grid;place-items:center;color:var(--text-3);flex:none}
.ch-i .nb{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger);color:#fff;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.ch-i .nb.soft{background:var(--text-3)}
.ch-i .mute{margin-left:auto;color:var(--text-3)}
.ch-main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.ch-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);min-height:56px}
.ch-head h2{font-size:15.5px;display:flex;align-items:center;gap:7px}
.ch-head p{margin:0;font-size:12px;color:var(--text-3)}
.msgs{flex:1;overflow-y:auto;padding:10px 0 6px;overscroll-behavior:contain}
.day-sep{display:flex;align-items:center;gap:12px;margin:14px 18px 6px;font-size:12px;font-weight:650;color:var(--text-3)}
.day-sep::before,.day-sep::after{content:"";flex:1;height:1px;background:var(--border)}
.new-sep{display:flex;align-items:center;gap:10px;margin:8px 18px;font-size:11.5px;font-weight:700;color:var(--danger)}
.new-sep::after{content:"";flex:1;height:1px;background:var(--danger);opacity:.5}
.msg{display:flex;gap:11px;padding:3px 18px;position:relative}
.msg:hover{background:var(--surface-2)}
.msg .gut{width:36px;flex:none;font-size:10.5px;color:var(--text-3);text-align:right;padding-top:3px}
.msg.cont .gut{opacity:0;padding-top:4px}
.msg.cont:hover .gut{opacity:1}
.msg .bd{flex:1;min-width:0}
.msg .hdr{display:flex;align-items:baseline;gap:8px;margin-bottom:1px}
.msg .hdr b{font-size:13.5px}
.msg .hdr time{font-size:11.5px;color:var(--text-3)}
.msg.first{margin-top:8px}
.msg .md{font-size:14px}
.msg.pending{opacity:.6}
.msg.sys .md{color:var(--text-2);font-style:italic}
.msg.hl{animation:hlm 2.2s ease-out}
@keyframes hlm{0%,40%{background:#f7d97455}100%{background:transparent}}
.msg .edited{font-size:11px;color:var(--text-3);margin-left:4px}
.msg .acts{position:absolute;right:14px;top:-14px;display:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--sh);padding:2px;gap:1px;z-index:3}
.msg:hover .acts,.msg .acts.open{display:flex}
.msg .acts .ibtn{width:28px;height:28px}
.msg .quote{border-left:3px solid var(--border-2);padding:2px 9px;margin:3px 0 4px;font-size:12.5px;color:var(--text-2);cursor:pointer;border-radius:0 6px 6px 0;background:var(--surface-2)}
.msg .quote b{font-size:12px}
.reacts{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.react{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);font-size:12.5px;cursor:pointer}
.react.mine{border-color:var(--primary);background:var(--primary-soft)}
.react b{font-size:11.5px;font-weight:650;color:var(--text-2)}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px}
.att-img{max-width:min(340px,100%);max-height:260px;border-radius:9px;border:1px solid var(--border);cursor:zoom-in;display:block;object-fit:cover;background:var(--surface-3)}
.att-vid{max-width:min(420px,100%);max-height:300px;border-radius:9px;background:#000;display:block}
.att-aud{width:300px;max-width:100%;height:40px}
.att-file{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);max-width:320px;min-width:200px;color:var(--text);text-decoration:none!important}
.att-file:hover{border-color:var(--border-2)}
.att-file .sq{width:34px;height:34px}
.att-file b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-file small{color:var(--text-3);font-size:11.5px}
.seen{display:flex;justify-content:flex-end;gap:4px;align-items:center;padding:0 18px;font-size:11px;color:var(--text-3)}
.typing{height:20px;padding:0 18px;font-size:12px;color:var(--text-3);font-style:italic}
.composer{border-top:1px solid var(--border);padding:8px 14px 12px;background:var(--surface)}
.composer .box{border:1px solid var(--border-2);border-radius:11px;background:var(--surface);transition:border-color .1s}
.composer .box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.composer textarea{width:100%;border:0;background:0;resize:none;padding:10px 12px 4px;max-height:220px;min-height:42px;outline:0;line-height:1.45;display:block}
.composer .tools{display:flex;align-items:center;gap:2px;padding:2px 6px 6px}
.composer .tools .ibtn{width:30px;height:30px}
.composer .replying{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;color:var(--text-2);border-bottom:1px solid var(--border);background:var(--surface-2);border-radius:11px 11px 0 0}
.pend{display:flex;gap:7px;flex-wrap:wrap;padding:8px 10px 0}
.pend .pf{display:flex;align-items:center;gap:7px;padding:4px 6px 4px 9px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--surface-2);max-width:240px}
.pend .pf img{width:28px;height:28px;object-fit:cover;border-radius:5px}
.pend .pf .bar{width:60px}
.drop-on{outline:3px dashed var(--primary);outline-offset:-8px;background:var(--primary-soft)!important}
.mention-pop .mi{padding:5px 9px}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emo-grid button{border:0;background:0;font-size:20px;padding:4px;border-radius:6px;cursor:pointer;line-height:1}
.emo-grid button:hover{background:var(--surface-3)}
.ch-info{border-left:1px solid var(--border);overflow-y:auto;padding:14px;background:var(--surface-2)}
.ch-info h4{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-3);margin:14px 0 7px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:96;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px}
.lightbox img{max-width:100%;max-height:calc(100vh - 90px);border-radius:6px}
.lightbox .row{color:#fff}
/* ============ kanban & cartes ============ */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.bcol{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 210px);min-height:120px}
.bcol-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:650;font-size:13px;border-bottom:1px solid var(--border)}
.bcol-h .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.bcol-h .n{color:var(--text-3);font-weight:600;font-size:12px}
.bcol-l{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;min-height:60px}
.bcol.dragover{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.bcard{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c,var(--border-2));border-radius:9px;padding:9px 11px;cursor:pointer;box-shadow:var(--sh);font-size:13px}
.bcard:hover{border-color:var(--border-2)}
.bcard.dragging{opacity:.4}
.bcard .t1{font-weight:620;font-size:13.5px;margin-bottom:3px;overflow-wrap:anywhere}
.bcard .t2{font-size:12px;color:var(--text-2);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bcard .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3);margin-top:6px}
.bcard .meta .late{color:var(--danger);font-weight:650}
.bcard.done .t1{text-decoration:line-through;color:var(--text-3)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
/* ============ notes ============ */
.notes{columns:270px;column-gap:14px}
.note{break-inside:avoid;margin-bottom:14px;border-radius:12px;padding:12px 14px;background:var(--nb,var(--surface));border:1px solid var(--nbd,var(--border));box-shadow:var(--sh);cursor:pointer;position:relative}
.note:hover{box-shadow:0 4px 14px rgba(16,24,40,.12)}
.note h4{font-size:14.5px;margin-bottom:5px;padding-right:22px;overflow-wrap:anywhere}
.note .md{font-size:13px;max-height:340px;overflow:hidden}
.note .meta{display:flex;gap:7px;align-items:center;margin-top:9px;font-size:11.5px;color:var(--text-3);flex-wrap:wrap}
.note .pin{position:absolute;top:10px;right:10px;color:var(--text-3)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches label{width:26px;height:26px;border-radius:50%;background:var(--c);cursor:pointer;border:2px solid var(--border-2);display:block}
.swatches input{display:none}
.swatches input:checked+label{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary)}
.cl-ed{display:flex;flex-direction:column;gap:5px}
.cl-ed .r{display:flex;gap:7px;align-items:center}
.cl-ed .r .in{padding:5px 8px}
/* ============ agenda ============ */
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--border);border-top:1px solid var(--border);background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.mcal .dh{padding:7px 8px;font-size:12px;font-weight:650;color:var(--text-3);border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface-2);text-transform:capitalize}
.mcal .dc{min-height:112px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 5px 6px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.mcal .dc:hover{background:var(--surface-2)}
.mcal .dc.out{background:var(--surface-2);color:var(--text-3)}
.mcal .dc.out .ev{opacity:.6}
.mcal .dc.we{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 6px,transparent 6px,transparent 12px)}
.mcal .dc.today{background:var(--today)}
.mcal .dn{font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:6px;padding:1px 2px}
.mcal .dc.today .dn b{background:var(--primary);color:#fff;border-radius:10px;padding:0 7px}
.mcal .dn small{font-weight:500;color:var(--text-3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 6px;border-radius:5px;background:var(--t);color:var(--text);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.5}
.ev .ic{width:12px;height:12px;color:var(--c)}
.ev.dim{opacity:.75;font-style:italic}
.ev.done{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--text-3);padding:0 6px}
.wk{display:grid;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--sh)}
.wk-h{display:grid;border-bottom:1px solid var(--border);background:var(--surface-2)}
.wk-h div{padding:7px 8px;font-size:12.5px;font-weight:650;border-left:1px solid var(--border);text-transform:capitalize}
.wk-h div.today{color:var(--primary-2);background:var(--today)}
.wk-ad{display:grid;border-bottom:1px solid var(--border)}
.wk-ad>div{border-left:1px solid var(--border);padding:3px;display:flex;flex-direction:column;gap:2px;min-height:26px;min-width:0}
.wk-b{display:grid;position:relative;max-height:calc(100vh - 290px);overflow-y:auto}
.wk-hrs{font-size:11px;color:var(--text-3);text-align:right}
.wk-hrs div{height:44px;padding:0 6px;transform:translateY(-7px)}
.wk-col{position:relative;border-left:1px solid var(--border);background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--border) 43px,var(--border) 44px)}
.wk-col.today{background-color:var(--today)}
.wk-col .slot{position:absolute;left:0;right:0;height:22px;cursor:pointer}
.wk-col .slot:hover{background:var(--primary-soft)}
.wk-ev{position:absolute;left:3px;right:3px;border-radius:6px;background:var(--t);border-left:3px solid var(--c);padding:2px 6px;font-size:11.5px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);z-index:2}
.wk-ev b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:3}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.layers{display:flex;gap:6px;flex-wrap:wrap}
/* ============ Gantt ============ */
.gt-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);max-height:calc(100vh - 205px);position:relative}
.gt{position:relative;min-width:100%}
.gt-row{display:flex;height:34px;border-bottom:1px solid var(--border)}
.gt-row.proj{background:var(--surface-2)}
.gt-name{position:sticky;left:0;z-index:4;width:280px;flex:none;background:inherit;background-color:var(--surface);border-right:1px solid var(--border-2);display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12.5px;min-width:0}
.gt-row.proj .gt-name{background-color:var(--surface-2);font-weight:650;font-size:13px}
.gt-name .ibtn{width:22px;height:22px}
.gt-name .trunc{flex:1}
.gt-name.sub{padding-left:34px}
.gt-head{display:flex;position:sticky;top:0;z-index:6;background:var(--surface-2);border-bottom:1px solid var(--border-2);height:46px}
.gt-head .gt-name{background-color:var(--surface-2);z-index:7;font-weight:650;color:var(--text-3);font-size:12px}
.gt-tl{position:relative;flex:none}
.gt-scale{position:absolute;inset:0}
.gt-scale .u{position:absolute;top:0;height:22px;border-left:1px solid var(--border);font-size:11.5px;font-weight:650;padding:3px 6px;white-space:nowrap;overflow:hidden;color:var(--text-2);text-transform:capitalize}
.gt-scale .l{position:absolute;top:22px;height:24px;border-left:1px solid var(--border);font-size:10.5px;padding:5px 3px;color:var(--text-3);text-align:center;overflow:hidden;white-space:nowrap}
.gt-scale .l.we{background:var(--surface-3)}
.gt-grid{position:absolute;top:0;bottom:0;pointer-events:none}
.gt-grid div{position:absolute;top:0;bottom:0;border-left:1px solid var(--border);opacity:.7}
.gt-grid div.we{background:var(--surface-2);border:0;opacity:1}
.gt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:3;pointer-events:none}
.gt-bar{position:absolute;top:7px;height:20px;border-radius:6px;background:var(--t);border:1px solid var(--c);cursor:grab;z-index:2;display:flex;align-items:center;overflow:hidden;font-size:11.5px;font-weight:600;color:var(--text);white-space:nowrap;user-select:none}
.gt-bar .pg{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.35}
.gt-bar span{position:relative;padding:0 7px;overflow:hidden;text-overflow:ellipsis}
.gt-bar.proj{top:9px;height:16px;border-radius:4px}
.gt-bar.stby{background:repeating-linear-gradient(135deg,var(--t),var(--t) 5px,transparent 5px,transparent 10px)}
.gt-bar .hd{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}
.gt-bar .hd.l{left:0}.gt-bar .hd.r{right:0}
.gt-bar.dragging{cursor:grabbing;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.gt-bar.late{border-color:var(--danger);border-width:2px}
.gt-ms{position:absolute;top:10px;width:14px;height:14px;transform:rotate(45deg);background:var(--c);border:2px solid var(--surface);cursor:pointer;z-index:3;box-shadow:0 0 0 1px var(--c)}
.gt-ms.done{opacity:.55}
.gt-lbl{position:absolute;top:9px;font-size:11px;color:var(--text-3);white-space:nowrap;pointer-events:none}
.gt-links{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
/* ============ planning d'équipe ============ */
.tp-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh)}
.tp{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
.tp th,.tp td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0;text-align:center}
.tp thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;font-weight:600;color:var(--text-3);padding:4px 0;min-width:30px;font-size:11px}
.tp thead th b{display:block;color:var(--text);font-size:12.5px}
.tp th.we,.tp td.we{background:var(--surface-3)}
.tp th.hol,.tp td.hol{background:repeating-linear-gradient(135deg,var(--surface-3),var(--surface-3) 4px,transparent 4px,transparent 8px)}
.tp th.today{background:var(--primary-soft);color:var(--primary-2)}
.tp td.nm{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:5px 10px;white-space:nowrap;min-width:170px}
.tp thead th.nm{z-index:3;left:0;position:sticky;text-align:left;padding-left:10px}

.tp .hf{display:flex;flex-direction:column;height:34px}
.tp .hf i{flex:1;display:block}
.tp .mk{position:absolute;right:1px;top:1px;font-size:9px;line-height:1}
.tp .ab{font-size:9.5px;font-weight:700;position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-shadow:0 1px 1px #0005;pointer-events:none}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c);display:block}

.hbars{display:flex;flex-direction:column;gap:8px}

.vbars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.vbars .vb .stk{width:100%;max-width:36px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.vbars .vb .stk i{display:block;background:var(--c)}
.vbars .vb small{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.vbars .vb b{font-size:11px}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
/* ============ appels ============ */
#call{position:fixed;inset:0;z-index:85;background:#0c0e12;color:#fff;display:flex;flex-direction:column}
#call:empty{display:none}
#call .c-top{display:flex;align-items:center;gap:12px;padding:12px 16px}

#call .c-top small{color:#9aa4b2}
#call .ibtn{color:#dfe4ea}
#call .ibtn:hover{background:#ffffff1a;color:#fff}
.tiles{flex:1;display:grid;gap:10px;padding:0 16px;min-height:0;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));grid-auto-rows:minmax(160px,1fr)}
.tile{position:relative;background:#1b1f27;border-radius:12px;overflow:hidden;display:grid;place-items:center;min-height:0}
.tile video{width:100%;height:100%;object-fit:cover;background:#000}
.tile video.contain{object-fit:contain}
.tile .who{position:absolute;left:10px;bottom:10px;background:#000a;border:0;color:#fff;padding:4px 10px;border-radius:8px;font-size:12.5px;max-width:calc(100% - 20px);display:flex;gap:6px;align-items:center;cursor:default}

.c-bar{display:flex;justify-content:center;gap:12px;padding:14px;flex-wrap:wrap}
.cbtn{width:52px;height:52px;border-radius:50%;border:0;background:#2a303b;color:#fff;display:grid;place-items:center;cursor:pointer}
.cbtn:hover{background:#363d4a}
.cbtn.off{background:#e8eaed;color:#202124}
.cbtn.end{background:#d93025;width:64px;border-radius:26px}
.cbtn.end:hover{background:#c5221f}
.cbtn.on{background:#1487c9}
.cbtn .ic{width:22px;height:22px}
#call.mini{inset:auto 16px 16px auto;width:340px;height:auto;border-radius:14px;box-shadow:var(--sh-lg);overflow:hidden}
#call.mini .tiles{grid-template-columns:1fr;grid-auto-rows:190px;padding:0 8px}

#call.mini .cbtn{width:40px;height:40px}
#call.mini .cbtn.end{width:48px}
.ring{text-align:center;padding:10px 0}
.ring .av{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #1487c988}70%{box-shadow:0 0 0 22px #1487c900}100%{box-shadow:0 0 0 0 #1487c900}}
.rec{display:grid;place-items:center;gap:10px}
.rec video{width:100%;max-height:52vh;background:#000;border-radius:10px}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* ============ connexion ============ */
#auth{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 32px;overflow-y:auto}
#auth:empty{display:none}
.auth-box{width:100%;max-width:420px}
.auth-brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:18px}
.auth-brand b{display:block;font-size:17px;font-weight:650;line-height:1.2}
.auth-brand small{display:block;font-size:12px;color:var(--text-3)}
.auth-box h3{font-size:16px;margin-bottom:4px}
.auth-box .bnr{margin-bottom:12px}
.auth-note{font-size:12.5px;color:var(--text-3);margin:0;line-height:1.5}
.auth-foot{font-size:12px;color:var(--text-3);text-align:center;margin:14px 0 0;line-height:1.5}
.pwm{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.pwm i{display:block;height:100%;transition:width .15s,background .15s}
.rules{font-size:12px;color:var(--text-3);display:grid;gap:2px;margin:0;padding:0;list-style:none}
.rules li.ok{color:var(--ok)}
.rules li::before{content:"○ "}
.rules li.ok::before{content:"✓ "}
.users-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.users-pick button{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);cursor:pointer;text-align:left;font-size:13px}

/* ============ divers ============ */
.prio{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:750;color:#fff;background:var(--c)}
.cnt-b{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:700;background:var(--t);color:var(--c)}
.rec-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:#b5179e;background:#b5179e1c;border:1px solid #b5179e44;border-radius:20px;padding:1px 8px;white-space:nowrap}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-i{position:relative;margin-bottom:11px;font-size:13px}
.tl-i::before{content:"";position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--primary));border:2px solid var(--surface)}
.tl-i small{color:var(--text-3);display:block;font-size:11.5px}
.cmt{display:flex;gap:10px;margin-bottom:12px}
.cmt .bd{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 11px}
.cmt .hdr{font-size:12px;color:var(--text-3);margin-bottom:3px;display:flex;gap:8px;align-items:center}
.cmt .hdr b{color:var(--text);font-size:13px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--text-3);font-size:12.5px}
.kv dd{margin:0;min-width:0}
.big-n{font-size:30px;font-weight:750;line-height:1}
.sev{width:4px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.prob{display:flex;gap:11px;padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer}
.prob:hover{background:var(--surface-2)}
.prob:last-child{border-bottom:0}
.prob .main{flex:1;min-width:0}
.prob .t1{font-weight:620;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prob .t2{font-size:12.5px;color:var(--text-3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sim{border:1px solid var(--warn);background:var(--warn-soft);border-radius:9px;padding:9px 11px;font-size:13px}
.sim .li{border:0;padding:6px 4px;background:transparent}
.help-k{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shots img{width:96px;height:72px;object-fit:cover;border-radius:7px;border:1px solid var(--border);cursor:zoom-in}
.dropzone{border:2px dashed var(--border-2);border-radius:10px;padding:12px;text-align:center;color:var(--text-3);font-size:12.5px;cursor:pointer}
.dropzone:hover{border-color:var(--primary);color:var(--primary-2)}
.ctc{display:flex;flex-direction:column;gap:6px}
.ctc .l{display:flex;gap:8px;align-items:center;font-size:13px;min-width:0}
.ctc .l .ic{color:var(--text-3)}
.countdown{font-weight:700;font-size:12.5px;padding:2px 9px;border-radius:12px;background:var(--t);color:var(--c);white-space:nowrap}
#print{display:none}
/* ============ responsive ============ */
@media(max-width:1180px){.split{grid-template-columns:1fr}.chat.info-on{grid-template-columns:268px minmax(0,1fr)}.chat.info-on .ch-info{position:absolute;right:0;top:0;bottom:0;width:290px;z-index:20;box-shadow:var(--sh-lg)}}
@media(max-width:980px){
  #sb{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .18s;box-shadow:var(--sh-lg)}
  body.sb-open #sb{transform:none}
  body.mini #sb{width:250px}
  body.mini .brand b,body.mini .brand small,body.mini .nav-h,body.mini .nav-a .lbl,body.mini .nav-b,body.mini .sb-new .lbl,body.mini .sb-foot span{display:revert}
  body.mini .sb-head{flex-direction:row;padding:14px 10px 8px 14px}
  body.mini .brand{flex:1}
  #view{padding:14px 12px 40px}
  #top{padding:0 10px;gap:6px}
  .srch{min-width:0;width:34px;justify-content:center;padding:5px}
  .srch span,.srch kbd{display:none}
  #burger{display:inline-grid}
  .who span.trunc,.stbtn span,#sync span{display:none}
  .chat{grid-template-columns:1fr}
  .chat .ch-side{display:none}
  .chat.list-on .ch-side{display:flex}
  .chat.list-on .ch-main{display:none}
  .gt-name{width:170px}
  .kv{grid-template-columns:110px 1fr}
}
@media(max-width:600px){
  #sync,#btn-theme,.ch-head #ch-search{display:none}
  .toolbar .in,.toolbar .srchin{flex:1 1 100%;min-width:0}
  .toolbar .seg{flex-wrap:wrap}
  .phead .acts{margin-left:0}
  .phead h1{font-size:19px}
  .fgrid.two{grid-template-columns:1fr}
  .mcal .dc{min-height:72px}
  .mcal .ev span{display:none}
  .users-pick{grid-template-columns:1fr}
  .msg{padding:3px 10px}
  .msg .gut{width:30px}
  .composer{padding:6px 8px 10px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  #sb,#top,#banner,.no-print,.toolbar,#toasts{display:none!important}
  #app{display:block}
  #view{padding:0}
  body{background:#fff}
  .card,.tbl-wrap,.gt-wrap,.tp-wrap{box-shadow:none;max-height:none!important;overflow:visible!important}
  @page{size:A4 landscape;margin:9mm}
}

<script>
'use strict';
/* =====================================================================
   D8 · ESPACE SI — outil d'échange du service informatique (1 fichier)
   Messagerie, appels vidéo, projets & Gantt, tâches, notes, calendrier,
   rappels, problèmes récurrents, congés, retards, compteur d'heures…
   Stockage : api.php (serveur partagé) ou, à défaut, base locale du
   navigateur (mode démonstration). Aucune dépendance externe.
   ===================================================================== */
const APP_VERSION = '1.0';
const KEY = 'd8-espace-si';

/* ---------- petits outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const rnd = n => { let s = ''; while (s.length < n) s += Math.random().toString(36).slice(2); return s.slice(0, n); };
const uid = p => p + '_' + Date.now().toString(36) + rnd(6);
const msgId = () => { const d = new Date(); return `m_${d.getFullYear()}${pad(d.getMonth() + 1)}_${Date.now().toString(36)}${rnd(6)}`; };
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
/** objet « dictionnaire » (PHP renvoie [] pour un dictionnaire vide) */
const obj = x => x && typeof x === 'object' && !Array.isArray(x) ? x : {};
const arr = x => Array.isArray(x) ? x : [];
const num = (n, d = 0) => Number(n || 0).toLocaleString('fr-FR', { maximumFractionDigits: d, minimumFractionDigits: d });
const plural = (n, s, p) => `${num(n, n % 1 ? 1 : 0)} ${Math.abs(n) > 1 ? (p || s + 's') : s}`;
const initials = s => String(s || '?').split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function tint(hex, a) {
  const h = String(hex || '#8a939f').replace('#', '');
  const f = (h.length === 3 ? h.split('').map(c => c + c).join('') : h).padEnd(6, '0').slice(0, 6);
  const n = parseInt(f, 16) || 0;
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
const cvar = (hex, a = .15, b = .35) => `--c:${hex};--t:${tint(hex, a)};--tb:${tint(hex, b)}`;
const fsize = b => b < 1024 ? b + ' o' : b < 1048576 ? num(b / 1024) + ' Ko' : b < 1073741824 ? num(b / 1048576, 1) + ' Mo' : num(b / 1073741824, 2) + ' Go';
function download(name, content, type = 'text/plain;charset=utf-8') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function pickFiles(accept = '', multiple = true, capture) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = multiple;
    if (capture) i.setAttribute('capture', capture);
    i.onchange = () => res([...i.files]); i.click();
  });
}
const csvCell = v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCSV(name, head, rows) {
  download(name, '﻿' + [head, ...rows].map(r => r.map(csvCell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}

/* ---------- dates (dates 'AAAA-MM-JJ', heures locales 'AAAA-MM-JJTHH:MM') ---------- */
const DAY = 86400000;
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
const JOURS_C = ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'];
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

/* conserver la saisie et le défilement lors d'un rafraîchissement */
function keepState(view) {
  const a = document.activeElement, k = {};
  if (a && view.contains(a) && (a.id || a.name)) k.focus = { id: a.id, name: a.name, v: a.value, s: a.selectionStart, e: a.selectionEnd };
  k.scroll = $$('[data-keep]', view).map(e => [e.dataset.keep, e.scrollTop, e.scrollLeft]);
  k.y = window.scrollY;
  return k;
}
function restoreState(view, k) {
  for (const [key, t, l] of k.scroll) { const e = $(`[data-keep="${key}"]`, view); if (e) { e.scrollTop = t; e.scrollLeft = l; } }
  window.scrollTo(0, k.y);
  if (k.focus) {
    const e = k.focus.id ? $('#' + CSS.escape(k.focus.id), view) : $(`[name="${k.focus.name}"]`, view);
    if (e) { if (e.value !== undefined && k.focus.v !== undefined) e.value = k.focus.v; e.focus(); try { e.setSelectionRange(k.focus.s, k.focus.e); } catch (x) { } }
  }
}

const Alerts = {
  shown: new Set(), lastTick: 0, openRem: {},
  onFresh(list) {
    for (const { c, item } of list) {
      if (c === 'messages') Chat.onNew(item);
      else if (c === 'inbox' && item.to === D.me && !item.read) this.inbox(item);
    }
  },
  inbox(it) {
    const kind = it.kind === 'urgent' ? 'urgent' : it.kind === 'mention' ? 'mention' : it.kind === 'reminder' ? 'reminder' : 'info';
    Snd.play(kind);
    const who = it.from ? fname(it.from) : '';
    toast(it.text, it.kind === 'urgent' ? 'danger' : 'info', null, it.kind === 'urgent' ? 20000 : 8000,
      { sub: who ? 'De ' + who : '', icon: ic(INBOX_IC[it.kind] || 'bell'), onclick: () => { save('inbox', it.id, { set: { read: true } }); if (it.link) location.hash = it.link; } });
    Notif.show(it.kind === 'urgent' ? '🚨 Espace SI' : 'Espace SI', (who ? who + ' : ' : '') + it.text, it.link, it.id);
  },
  tick() {
    if (!D.me) return;
    const now = Date.now(); if (now - this.lastTick < 10000) return; this.lastTick = now;
    const nl = nowLocal(), t = today();
    // rappels personnels
    for (const r of D.all('reminders')) {
      if (r.ownerId !== D.me || r.done) continue;
      const due = r.snooze || r.at; if (!due || due > nl) continue;
      const k = 'r:' + r.id + ':' + due; if (this.shown.has(k)) continue;
      this.shown.add(k); this.reminder(r);
    }
    // événements qui me concernent (rappel N minutes avant)
    const seen = (() => { try { return JSON.parse(localStorage.getItem(KEY + '-evr') || '{}'); } catch (e) { return {}; } })();
    for (const o of expandEvents(t, t)) {
      const e = o.ev; if (!o.first || e.remind == null || e.remind === '' || e.allDay) continue;
      if (e.ownerId !== D.me && !arr(e.participants).includes(D.me)) continue;
      const start = pdt(o.date + 'T' + (e.start || '').slice(11, 16)), diff = (start - now) / 60000;
      const k = e.id + ':' + o.date;
      if (diff <= +e.remind && diff > -5 && !seen[k]) {
        seen[k] = 1; try { localStorage.setItem(KEY + '-evr', JSON.stringify(seen)); } catch (x) { }
        Snd.play('reminder');
        toast(`${e.title} — ${diff > 1 ? 'dans ' + Math.round(diff) + ' min' : 'maintenant'}`, 'info', null, 15000, { sub: `${EVT[e.type] ? EVT[e.type][0] : 'Événement'} à ${fmtT(start)}${e.location ? ' · ' + e.location : ''}`, icon: ic('cal'), onclick: () => Agenda.edit(e.id) });
        Notif.show('📅 ' + e.title, `À ${fmtT(start)}${e.location ? ' — ' + e.location : ''}`, '#/agenda', k);
      }
    }
    // récapitulatif du jour (une fois par jour) + échéances proches
    let dig = ''; try { dig = localStorage.getItem(KEY + '-digest-' + D.me) || ''; } catch (e) { }
    if (dig !== t && Date.now() - BOOT_AT > 4000) {
      try { localStorage.setItem(KEY + '-digest-' + D.me, t); } catch (e) { }
      const tasks = myTasks(), late = tasks.filter(x => x.due && x.due < t).length, tod = tasks.filter(x => x.due === t).length;
      const dls = D.all('deadlines').filter(d => !d.done && dlLeft(d) <= (+d.notifyDays || 30));
      const evs = expandEvents(t, t).filter(o => o.ev.ownerId === D.me || arr(o.ev.participants).includes(D.me)).length;
      if (late || tod || evs) toast(`Votre journée : ${plural(tod, 'tâche')} à faire${late ? `, ${plural(late, 'tâche')} en retard` : ''}${evs ? `, ${plural(evs, 'événement')}` : ''}.`, late ? 'warn' : 'info', null, 10000, { icon: ic('sun'), onclick: () => go('#/') });
      if (dls.length) { Snd.play('reminder'); toast(`${plural(dls.length, 'échéance')} à surveiller : ${dls.slice(0, 3).map(d => d.name).join(', ')}${dls.length > 3 ? '…' : ''}`, 'warn', null, 12000, { icon: ic('hourglass'), onclick: () => go('#/echeances') }); }
    }
    // typage « en train d'écrire » qui expire
    const s = D.sig(); if (s !== D.presSig) { D.presSig = s; changed('presence'); }
  },
  reminder(r) {
    Snd.play('reminder');
    Notif.show('⏰ Rappel', r.title, '#/rappels', 'rem-' + r.id);
    if (this.openRem[r.id]) return;
    const link = r.link ? `<p><a href="${esc(r.link)}" data-close>Ouvrir l’élément lié</a></p>` : '';
    const m = modal({

      body: `<div style="font-size:16px;font-weight:650;margin-bottom:6px">${esc(r.title)}</div>${r.note ? md(r.note) : ''}${link}

        <div class="mhd" style="padding-left:0">Reporter</div><div class="chips">${[[5, '5 min'], [15, '15 min'], [60, '1 h'], [180, '3 h'], ['tm', 'Demain 9 h']].map(([k, l]) => `<button class="chip" data-snz="${k}">${l}</button>`).join('')}</div>`,

  }

    D.all('contacts').filter(c => norm(c.name + ' ' + (c.company || '') + ' ' + (c.phone || '') + ' ' + (c.notes || '')).includes(k)).forEach(c => add('Contacts', c.name + (c.company ? ' — ' + c.company : ''), 'phone', () => Contacts.edit(c.id), c.phone || ''));
    D.all('deadlines').filter(d => norm(d.name + ' ' + (d.vendor || '')).includes(k)).forEach(d => add('Échéances', d.name, 'hourglass', () => Deadlines.edit(d.id), fmtD(d.date)));
    D.all('events').filter(e => norm(e.title + ' ' + (e.location || '')).includes(k)).slice(0, 8).forEach(e => add('Calendrier', e.title, 'cal', () => Agenda.edit(e.id), fmtDT(e.start)));
    if (k.length >= 2) add('Messages', `Rechercher « ${q} » dans tous les messages`, 'chat', () => Chat.searchAll(q));
    return out.slice(0, 80);
  };
  const draw = () => {
    let g = '';
    list.innerHTML = items.map((x, i) => (x.g !== g ? `<div class="pal-g">${esc(g = x.g)}</div>` : '') + `<div class="pal-i ${i === sel ? 'on' : ''}" data-i="${i}">${ic(x.i || 'arrow')}<span class="trunc">${esc(x.l)}</span>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</div>`).join('') || '<div class="empty">Aucun résultat</div>';
    const on = $('.pal-i.on', list); on && on.scrollIntoView({ block: 'nearest' });
  };
  const run = i => { const x = items[i]; if (!x) return; m.close(); x.fn(); };
  inp.oninput = () => { items = build(inp.value); sel = 0; draw(); };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { run(sel); e.preventDefault(); }
  };
  list.onclick = e => { const it = e.target.closest('[data-i]'); if (it) run(+it.dataset.i); };
  items = build(''); draw(); setTimeout(() => inp.focus(), 30);
}
